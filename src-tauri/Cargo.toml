[package]
name = "clash-verge"
version = "2.5.4"
description = "A modern GUI client based on Tauri, designed to run in Windows, macOS and Linux for tailored proxy experience"
authors = ["clash-verge-rev"]
license = "GPL-3.0-only"
repository = "https://github.com/clash-verge-rev/clash-verge-rev"
edition = "2021"
rust-version = "1.96.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "clash_verge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
ta uri = { package = "tauri", version = "2.10.2", features = [
  "macos-private-api",
  "tray-icon",
  "image-png",
  "unstable",
  "devtools",
] }
anyhow = { workspace = true }
async-recursion = "1.1.1"
chrono = { version = "0.4.44", features = ["serde"] }
derive_builder = "0.20.2"
dirs = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
reqwest = { version = "0.13.2", features = [
  "json",
  "multipart",
  "rustls",
  "stream",
  "socks",
] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = "0.10.9"
sysinfo = { version = "0.38.4", default-features = false, features = [
  "system",
] }
tokio = { workspace = true }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.5.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-window-state = "2.4.1"
zip = "8.6.0"
reqwest_dav = "0.3.3"
serde-xml-rs = "0.6.0"
aes-gcm = { version = "0.11.0" }
base64 = "0.22.1"
getrandom = "0.4.3"
futures = "0.3.32"
gethostname = "1.1.0"
scopeguard = "1.2.0"
tauri-plugin-notification = "2.3.3"
tokio-stream = "0.1.18"
backon = { version = "1.6.0", features = ["tokio-sleep"] }
tauri-plugin-http = "2.5.9"
console-subscriber = { version = "0.5.0", optional = true }
tauri-plugin-devtools = { version = "2.1.0" }
tauri-plugin-mihomo = { git = "https://github.com/clash-verge-rev/tauri-plugin-mihomo", branch = "fix/api-robustness" }
clash_verge_logger = { git = "https://github.com/clash-verge-rev/clash-verge-logger" }
async-trait = "0.1.89"
clash_verge_service_ipc = { version = "2.3.3", features = [
  "client",
], git = "https://github.com/clash-verge-rev/clash-verge-service-ipc" }
arc-swap = "1.9.2"
tokio-rustls = "0.26.4"
rustls = { version = "0.23.41", features = ["ring"] }
webpki-roots = "1.0.8"
rust_iso3166 = "0.2.0"
# Use the git repo until the next release after v2.0.0.
dark-light = { git = "https://github.com/rust-dark-light/dark-light" }
windows-sys.workspace = true
bytes = "1.12.0"
tokio-util = { version = "0.7.18", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
  "NSString",
  "NSDictionary",
  "NSAttributedString",
] }
objc2-app-kit = { version = "0.3.2", features = [
  "NSAttributedString",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSFont",
  "NSFontDescriptor",
  "NSColor",
  "NSParagraphStyle",
  "NSStringDrawing",
  "NSText",
] }

[target.'cfg(windows)'.dependencies]
deelevate = { workspace = true }
runas = "=1.2.0"
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
  "Win32_Globalization",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true
