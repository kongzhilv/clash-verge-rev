[package]
name = "clash-verge"
version = "2.5.4"
description = "Clash Verge Rev"
authors = ["clash-verge-rev"]
license = "GPL-3.0"
repository = "https://github.com/clash-verge-rev/clash-verge-rev"
edition = "2024"
rust-version = "1.88.0"

[lib]
name = "clash_verge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tauri = { version = "2.10.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-updater = "2.10.0"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-window-state = "2.4.1"
zip = "8.6.0"
reqwest_dav = "0.3.3"
serde-xml-rs = "0.6.0"
aes-gcm = { version = "0.11.0" }
base64 = "0.22.1"
getrandom = "0.4.3"
futures = "0.3.32"
gethostname = "1.1.0"
scopeguard = "1.2.0"
tauri-plugin-notification = "2.3.3"
tokio-stream = "0.1.18"
backon = { version = "1.6.0", features = ["tokio-sleep"] }
tauri-plugin-http = "2.5.9"
console-subscriber = { version = "0.5.0", optional = true }
tauri-plugin-devtools = { version = "2.1.0" }
tauri-plugin-mihomo = { git = "https://github.com/clash-verge-rev/tauri-plugin-mihomo", branch = "fix/api-robustness" }
clash_verge_logger = { git = "https://github.com/clash-verge-rev/clash-verge-logger" }
async-trait = "0.1.89"
clash_verge_service_ipc = { version = "2.3.3", features = [
  "client",
], git = "https://github.com/clash-verge-rev/clash-verge-service-ipc" }
arc-swap = "1.9.2"
tokio-rustls = "0.26.4"
rustls = { version = "0.23.41", features = ["ring"] }
webpki-roots = "1.0.8"
rust_iso3166 = "0.2.0"
# Use the git repo until the next release after v2.0.0.
dark-light = { git = "https://github.com/rust-dark-light/dark-light" }
windows-sys.workspace = true
bytes = "1.12.0"
tokio-util = { version = "0.7.18", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
  "NSString",
  "NSDictionary",
  "NSAttributedString",
] }
objc2-app-kit = { version = "0.3.2", features = [
  "NSAttributedString",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSFont",
  "NSFontDescriptor",
  "NSColor",
  "NSParagraphStyle",
  "NSStringDrawing",
  "NSText",
] }

[target.'cfg(windows)'.dependencies]
deelevate = { workspace = true }
runas = "=1.2.0"
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
  "Win32_Globalization",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
verge-dev = []
clippy = []
tracing = ["console-subscriber"]
