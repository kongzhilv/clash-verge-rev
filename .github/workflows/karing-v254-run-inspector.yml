name: Karing 2.5.4 启动器检查器

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  inspect:
    name: 读取启动器运行状态
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/inspect-karing-v254-launcher'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      INSPECTOR_PATH: .github/workflows/karing-v254-run-inspector.yml
      MARKER: '<!-- karing-v254-run-inspector -->'
    steps:
      - name: 查询并回写 Actions 状态
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/launch-karing-v254-release.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | {id, event, status, conclusion, head_sha, created_at, updated_at, html_url}]')
          main_runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/karing-diagnostics-once.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | {id, event, status, conclusion, head_sha, created_at, updated_at, html_url}]' 2>/dev/null || echo '[]')
          body=$(cat <<EOF
          ${MARKER}
          ## Karing 2.5.4 Actions 实时检查

          **启动器运行**
          
          \`\`\`json
          ${runs}
          \`\`\`

          **主发行运行**

          \`\`\`json
          ${main_runs}
          \`\`\`
          EOF
          )
          jq -n --arg body "$body" '{body: $body}' | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" --input - >/dev/null

      - name: 清理一次性检查器
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${INSPECTOR_PATH}?ref=dev" --jq '.sha')
          jq -n \
            --arg message 'chore: remove one-time Karing launcher inspector' \
            --arg sha "$sha" \
            --arg branch dev \
            '{message: $message, sha: $sha, branch: $branch}' | \
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${INSPECTOR_PATH}" --input - >/dev/null