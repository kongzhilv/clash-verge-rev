name: Frontend Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check frontend changes
        id: check_frontend
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/**'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.json'
              - '**/*.md'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'knip.json'
              - 'eslint.config.ts'
              - 'tsconfig.json'
              - 'vite.config.*'

      - name: Skip if no frontend changes
        if: steps.check_frontend.outputs.frontend != 'true'
        run: echo "No frontend changes, skipping frontend checks."

      - name: Install pnpm
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        if: steps.check_frontend.outputs.frontend == 'true'
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: Restore pnpm cache
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            pnpm-shared-stable-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        if: steps.check_frontend.outputs.frontend == 'true'

      - name: Generate Biome format diagnostics
        if: steps.check_frontend.outputs.frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm format:check > biome-check.log 2>&1
          check_status=$?
          set -e
          pnpm format > biome-write.log 2>&1
          git diff --name-only > biome-changed-files.txt
          git diff > biome-format.diff
          printf '%s\n' "$check_status" > biome-check-status.txt

      - name: Upload Biome format diagnostics
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: biome-format-diagnostics
          path: |
            biome-check.log
            biome-write.log
            biome-changed-files.txt
            biome-format.diff
            biome-check-status.txt
          if-no-files-found: error
          retention-days: 2

      - name: Fail when Biome changes files
        if: steps.check_frontend.outputs.frontend == 'true'
        shell: bash
        run: |
          if [ -s biome-changed-files.txt ]; then
            cat biome-changed-files.txt
            exit 1
          fi

      - name: Run ESLint
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm lint

      - name: Run TypeScript typecheck
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm typecheck

      - name: Report unused frontend code and dependencies
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm knip:report
