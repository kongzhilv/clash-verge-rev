name: 前端检查
run-name: 前端检查

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  format_once:
    name: 提交官方格式化结果
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/karing-style-diversion'
    runs-on: ubuntu-latest
    steps:
      - name: 检出功能分支
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: 安装依赖并格式化
        run: |
          pnpm install --frozen-lockfile
          pnpm exec biome format --write \
            src/components/connection/connection-rule-assistant.tsx \
            src/components/routing/connection-project-card.tsx \
            src/components/rule/diversion-manager/project-editor-dialog.tsx \
            src/components/rule/diversion-manager/project-panel.tsx \
            src/services/process-connections.ts

      - name: 提交格式化源码
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/components/connection/connection-rule-assistant.tsx \
            src/components/routing/connection-project-card.tsx \
            src/components/rule/diversion-manager/project-editor-dialog.tsx \
            src/components/rule/diversion-manager/project-panel.tsx \
            src/services/process-connections.ts
          git diff --cached --check
          git commit -m "style: format application routing UI"
          git push origin HEAD:feature/karing-style-diversion
