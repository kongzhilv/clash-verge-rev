name: 前端检查
run-name: 前端检查

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  apply_application_routing:
    name: 应用分流一次性补丁
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/karing-style-diversion'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: 检出功能分支
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 修改实时归因与用户界面术语
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'export const useConnectionProcessAttribution' src/hooks/use-connection-data.ts; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          def get(path):
              return Path(path).read_text(encoding='utf-8')

          def put(path, text):
              Path(path).write_text(text, encoding='utf-8')

          path = 'src/hooks/use-connection-data.ts'
          text = get(path)
          old = "import {\n  enrichConnectionsWithProcesses,\n  getSystemProcessConnections,\n  type ProcessConnectionSnapshot,\n} from '@/services/process-connections'\n"
          new = "import {\n  enrichConnectionsWithProcesses,\n  getProcessAttributionSnapshot,\n  getSystemProcessConnections,\n  subscribeProcessAttribution,\n  type ProcessConnectionSnapshot,\n} from '@/services/process-connections'\n"
          if old not in text:
              raise SystemExit('process connection import block not found')
          text = text.replace(old, new, 1)
          text = text.rstrip() + "\n\nexport const useConnectionProcessAttribution = (\n  connectionId?: string | null,\n) => {\n  const snapshot = useSyncExternalStore(\n    subscribeProcessAttribution,\n    getProcessAttributionSnapshot,\n    getProcessAttributionSnapshot,\n  )\n  return connectionId ? snapshot.items.get(connectionId) : undefined\n}\n"
          put(path, text)

          paths = [
              'src/components/rule/diversion-manager/manager.tsx',
              'src/components/rule/diversion-manager/project-panel.tsx',
              'src/components/rule/diversion-manager/detected-programs-panel.tsx',
              'src/components/rule/diversion-manager/model.ts',
              'src/components/routing/routing-relations-panel.tsx',
              'src/components/routing/connection-project.ts',
              'src/components/connection/connection-row-item.tsx',
              'src/components/connection/connection-rule-assistant.tsx',
              'src/pages/connections.tsx',
          ]
          phrases = [
              ('程序与项目', '应用分流'),
              ('程序或项目档案', '应用规则'),
              ('程序/项目档案', '应用规则'),
              ('程序或项目', '应用规则'),
              ('程序/项目', '应用规则'),
              ('程序项目', '应用规则'),
              ('项目档案', '应用规则'),
              ('程序档案', '应用规则'),
              ('程序发现', '联网应用'),
              ('Windows 当前联网程序，可直接加入分流', '识别当前联网应用，并为其设置出口策略'),
              ('项目规则', '应用规则'),
              ('项目分流', '应用分流'),
              ('程序分流', '应用分流'),
              ('项目连接', '规则连接'),
              ('添加档案', '创建应用规则'),
              ('保存档案', '保存应用规则'),
              ('编辑档案', '编辑应用规则'),
          ]
          cleanup = [
              ('应用或应用规则', '应用规则'),
              ('应用/应用规则', '应用规则'),
              ('应用规则档案', '应用规则'),
              ('应用规则应用规则', '应用规则'),
              ('应用规则规则', '应用规则'),
              ('应用规则分流', '应用分流'),
              ('应用规则连接', '规则连接'),
              ('连接应用规则', '应用规则'),
              ('应用发现', '联网应用'),
          ]
          for path in paths:
              text = get(path)
              if path.endswith('/model.ts'):
                  text = text.replace(
                      "`${project.kind === 'program' ? '程序' : '项目'} · ${project.name}`",
                      "`应用 · ${project.name}`",
                  )
              for old_text, new_text in phrases:
                  text = text.replace(old_text, new_text)
              text = text.replace('程序', '应用').replace('项目', '应用规则')
              for old_text, new_text in cleanup:
                  text = text.replace(old_text, new_text)
              put(path, text)

          path = 'src/components/rule/diversion-manager/project-panel.tsx'
          text = get(path)
          text = text.replace('  WorkspacesRounded,\n', '')
          text = text.replace(
              '<WorkspacesRounded fontSize="small" />',
              '<AppsRounded fontSize="small" />',
          )
          text = re.sub(
              r"\{project\.kind === 'program' \? \(\s*<AppsRounded fontSize=\"small\" />\s*\) : \(\s*<AppsRounded fontSize=\"small\" />\s*\)\}",
              '<AppsRounded fontSize="small" />',
              text,
          )
          text = text.replace(
              '一条应用规则对应一组识别条件和一个出口。',
              '按应用、域名、IP 或端口识别流量，并指定出口策略。',
          )
          text = text.replace(
              '从上方选择应用，或新建一个应用规则。',
              '从上方选择联网应用，或新建一条应用规则。',
          )
          put(path, text)

          path = 'src/components/connection/connection-rule-assistant.tsx'
          text = get(path)
          text = text.replace('  WorkspacesRounded,\n', '')
          text = text.replace('<WorkspacesRounded />', '<AppsRounded />')
          text = text.replace('应用文件名', '应用名称')
          text = text.replace('完整应用路径', '应用完整路径')
          text = text.replace(
              '由连接详情创建，可继续补充同一应用规则使用的其他域名、IP 和端口。',
              '由连接详情创建，可继续补充此应用使用的域名、IP 和端口。',
          )
          put(path, text)

          path = 'src/components/rule/diversion-manager/action-picker.tsx'
          put(
              path,
              get(path).replace(
                  '对应 Karing 服务器选择页中的测速组和自定义组。',
                  '选择现有代理组，或手动填写一个出口名称。',
              ),
          )

          for path in ['README.md', 'THIRD_PARTY_NOTICES.md']:
              text = get(path)
              for old_text, new_text in [
                  ('程序/项目档案', '应用规则'),
                  ('程序与项目', '应用分流'),
                  ('程序项目', '应用规则'),
                  ('程序或项目', '应用规则'),
                  ('项目档案', '应用规则'),
                  ('程序档案', '应用规则'),
                  ('保存档案', '保存应用规则'),
                  ('添加档案', '创建应用规则'),
                  ('程序名称', '应用名称'),
                  ('程序完整路径', '应用完整路径'),
                  ('程序路径', '应用路径'),
                  ('程序名', '应用名称'),
                  ('程序发现', '联网应用'),
                  ('项目卡片', '应用规则卡片'),
                  ('项目指定代理组', '应用规则指定出口策略'),
                  ('项目关联', '应用规则关联'),
                  ('对应项目', '对应应用规则'),
                  ('点击项目', '点击应用规则'),
              ]:
                  text = text.replace(old_text, new_text)
              text = text.replace('程序', '应用')
              put(path, text)

          audit_paths = paths + [
              'src/components/connection/connection-detail.tsx',
              'src/components/routing/connection-project-card.tsx',
              'src/components/rule/diversion-manager/project-editor-dialog.tsx',
          ]
          for path in audit_paths:
              text = get(path)
              for phrase in [
                  '程序项目',
                  '程序与项目',
                  '程序或项目',
                  '程序/项目',
                  '项目档案',
                  '程序档案',
                  '添加档案',
                  '保存档案',
                  '程序发现',
              ]:
                  if phrase in text:
                      raise SystemExit(f'{phrase} remains in {path}')
          PY
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        if: steps.patch.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        if: steps.patch.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: 安装依赖并格式化
        if: steps.patch.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec biome check --write src

      - name: 提交应用分流补丁并恢复工作流
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/frontend-check.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src README.md THIRD_PARTY_NOTICES.md .github/workflows/frontend-check.yml
          git diff --cached --check
          git commit -m "refactor: mature application routing and live attribution"
          git push origin HEAD:feature/karing-style-diversion

  frontend:
    name: 检查前端代码
    needs: apply_application_routing
    if: always() && needs.apply_application_routing.outputs.changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检测前端相关变更
        id: check_frontend
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/**'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.json'
              - '**/*.md'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'knip.json'
              - 'eslint.config.ts'
              - 'tsconfig.json'
              - 'vite.config.*'

      - name: 无前端变更时跳过检查
        if: steps.check_frontend.outputs.frontend != 'true'
        run: echo "未检测到前端相关变更，跳过前端检查。"

      - name: 安装 pnpm
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        if: steps.check_frontend.outputs.frontend == 'true'
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: 恢复 pnpm 缓存
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            pnpm-shared-stable-${{ runner.os }}-

      - name: 安装项目依赖
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: 检查代码格式
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm format:check

      - name: 运行 ESLint
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm lint

      - name: 运行 TypeScript 类型检查
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm typecheck

      - name: 检查未使用的前端代码和依赖
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm knip:report
