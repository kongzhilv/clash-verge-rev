name: Frontend Check
run-name: Fix and audit Karing 4 candidate

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/frontend-check.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  HUSKY: 0

concurrency:
  group: karing4-fix-and-audit
  cancel-in-progress: false

jobs:
  frontend:
    name: Fix and audit feature candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature candidate
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove the obsolete import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/connection/connection-rule-assistant.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace("import {\n  Alert,\n  Box,", "import {\n  Box,")
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply official format and lint fixes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/components/base/index.ts
            src/components/base/overflow-reveal.tsx
            src/components/base/scroll-area.ts
            src/components/connection/connection-rule-assistant.tsx
            src/components/routing/focused-policy-panel.tsx
            src/components/routing/routing-relations-panel.tsx
            src/components/rule/diversion-manager/action-picker.tsx
            src/components/rule/diversion-manager/detected-programs-panel.tsx
            src/components/rule/diversion-manager/project-editor-dialog.tsx
            src/components/rule/diversion-manager/project-panel.tsx
          )
          pnpm exec biome format --write "${files[@]}"
          pnpm exec eslint -c eslint.config.ts --fix --max-warnings=0 "${files[@]}"
          pnpm exec biome format --write "${files[@]}"

      - name: Commit source fixes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source fixes were required'
          else
            git commit -m 'style: finalize readable overflow interactions'
            git push origin HEAD:feature/karing-style-diversion
          fi
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm format:check 2>&1 | tee /tmp/format.log

      - name: Audit mature routing UI
        id: ui
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            test -f src/components/base/overflow-reveal.tsx
            test -f src/components/base/scroll-area.ts
            grep -q "overflowX: 'auto'" src/components/base/overflow-reveal.tsx
            grep -q 'ResizeObserver' src/components/base/overflow-reveal.tsx
            grep -q 'requestAnimationFrame' src/components/base/overflow-reveal.tsx
            grep -q 'softScrollAreaSx' src/components/rule/diversion-manager/detected-programs-panel.tsx
            grep -q 'OverflowReveal' src/components/rule/diversion-manager/project-panel.tsx
            grep -q 'OverflowReveal' src/components/rule/diversion-manager/action-picker.tsx
            grep -q 'OverflowReveal' src/components/routing/routing-relations-panel.tsx
            grep -q 'OverflowReveal' src/components/routing/focused-policy-panel.tsx
            grep -q 'useConnectionData({ enabled: open })' src/components/connection/connection-detail.tsx
            grep -q 'isMihomoFakeIp' src/components/connection/connection-rule-assistant.tsx
            grep -q 'MAX_ATTRIBUTION_ITEMS' src/services/process-connections.ts
            echo '[pass] routing UI and overflow reveal audit'
          } 2>&1 | tee /tmp/ui.log

      - name: Run ESLint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/lint.log

      - name: Run TypeScript check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Run Knip report
        id: knip
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm knip:report 2>&1 | tee /tmp/knip.log

      - name: Build web application
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run web:build 2>&1 | tee /tmp/build.log

      - name: Publish audit report to PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.commit.outputs.candidate }}
          FORMAT: ${{ steps.format.outcome }}
          UI: ${{ steps.ui.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          KNIP: ${{ steps.knip.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          report=/tmp/audit-report.md
          {
            echo '<!-- karing4-frontend-audit-fixed -->'
            echo '## Karing 4 前端最终审查'
            echo
            echo "候选提交：\`$CANDIDATE\`"
            echo "Action：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '| 检查 | 结果 |'
            echo '| --- | --- |'
            echo "| Biome | $FORMAT |"
            echo "| 成熟化 UI 审查 | $UI |"
            echo "| ESLint | $LINT |"
            echo "| TypeScript | $TYPECHECK |"
            echo "| Knip | $KNIP |"
            echo "| Web 构建 | $BUILD |"
            for item in format ui lint typecheck knip build; do
              value=$(printenv "$(echo "$item" | tr '[:lower:]' '[:upper:]')")
              if [ "$value" != success ]; then
                echo
                echo "<details><summary>$item 错误日志尾部</summary>"
                echo
                echo '```text'
                tail -n 100 "/tmp/$item.log" 2>/dev/null || true
                echo '```'
                echo '</details>'
              fi
            done
          } > "$report"
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file "$report"

      - name: Enforce audit result
        if: always()
        shell: bash
        env:
          FORMAT: ${{ steps.format.outcome }}
          UI: ${{ steps.ui.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          KNIP: ${{ steps.knip.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          for value in "$FORMAT" "$UI" "$LINT" "$TYPECHECK" "$KNIP" "$BUILD"; do
            test "$value" = success
          done
