name: Frontend Check
run-name: Registered Karing 4 finalizer

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/frontend-check.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HUSKY: 0

concurrency:
  group: registered-karing4-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format current routing changes
        run: |
          pnpm exec biome format --write \
            src/components/connection/connection-filter-menu.tsx \
            src/components/connection/connection-row-item.tsx \
            src/components/connection/connection-detail.tsx \
            src/components/connection/connection-rule-assistant.tsx \
            src/components/routing/connection-project-card.tsx \
            src/components/routing/routing-relations-panel.tsx \
            src/components/rule/diversion-manager/manager.tsx \
            src/components/rule/diversion-manager/project-editor-dialog.tsx \
            src/components/rule/diversion-manager/settings-panel.tsx \
            src/pages/connections.tsx \
            src/pages/proxies.tsx \
            src/pages/rules.tsx \
            src/services/process-connections.ts

      - name: Set Karing 4 release tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/karing-diagnostics-once.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '  RELEASE_TAG: v2.5.3-karing\n',
              '  RELEASE_TAG: v2.5.3-karing.4\n',
          )
          old_title = '--title "Clash Verge Rev Karing v' + '$' + '{{ needs.review.outputs.version }}"'
          text = text.replace(
              old_title,
              '--title "Clash Verge Rev Karing v2.5.3-karing.4"',
          )
          path.write_text(text, encoding='utf-8')
          PY
          grep -q 'RELEASE_TAG: v2.5.3-karing.4' .github/workflows/karing-diagnostics-once.yml

      - name: Restore permanent feature gate and push candidate
        shell: bash
        run: |
          set -euo pipefail
          git show da57d770bdb6e5634c4313eb2ffd118e965fdfe5:.github/workflows/frontend-check.yml > .github/workflows/frontend-check.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src README.md .github/workflows/frontend-check.yml .github/workflows/karing-diagnostics-once.yml
          git diff --cached --check
          git commit -m 'release: finalize audited Karing 4 candidate'
          git push origin HEAD:feature/karing-style-diversion

      - name: Restore registered default-branch workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout -B dev origin/dev
          git show HEAD^:.github/workflows/frontend-check.yml > .github/workflows/frontend-check.yml
          git add .github/workflows/frontend-check.yml
          git commit -m 'chore: restore permanent frontend checks'
          git push origin dev
