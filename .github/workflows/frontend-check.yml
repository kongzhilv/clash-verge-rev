name: 前端检查
run-name: 前端检查

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  frontend:
    name: 检查前端代码
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检测前端相关变更
        id: check_frontend
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/**'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.json'
              - '**/*.md'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'knip.json'
              - 'eslint.config.ts'
              - 'tsconfig.json'
              - 'vite.config.*'

      - name: 无前端变更时跳过检查
        if: steps.check_frontend.outputs.frontend != 'true'
        run: echo "未检测到前端相关变更，跳过前端检查。"

      - name: 安装 pnpm
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        if: steps.check_frontend.outputs.frontend == 'true'
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: 恢复 pnpm 缓存
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            pnpm-shared-stable-${{ runner.os }}-

      - name: 安装项目依赖
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: 检查代码格式
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm format:check

      - name: 审查应用分流文案与实时联动
        if: steps.check_frontend.outputs.frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ui_paths=(
            src/components/connection
            src/components/routing
            src/components/rule/diversion-manager
            src/pages
            README.md
          )
          if grep -RInE '程序项目|程序与项目|程序或项目|程序/项目|项目档案|程序档案|添加档案|保存档案|程序发现' "${ui_paths[@]}"; then
            echo '[失败] 用户界面仍包含旧的“程序/项目/档案”产品术语'
            exit 1
          fi
          if grep -RInF 'label={project.groupId}' src/components; then
            echo '[失败] 用户界面暴露了内部托管规则组 ID'
            exit 1
          fi
          grep -q 'useConnectionProcessAttribution' src/hooks/use-connection-data.ts
          grep -q 'Windows TUN 归因' src/components/routing/connection-project-card.tsx
          grep -q 'useConnectionData({ enabled: open })' src/components/connection/connection-detail.tsx
          grep -q "source: 'windows'" src/services/process-connections.ts
          echo '[通过] 应用分流术语、实时详情和归因来源检查完成'

      - name: 运行 ESLint
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm lint

      - name: 运行 TypeScript 类型检查
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm typecheck

      - name: 检查未使用的前端代码和依赖
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm knip:report
