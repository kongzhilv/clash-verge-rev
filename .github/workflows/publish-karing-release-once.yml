name: Karing 正式发行（一次性）
run-name: 发布 v2.5.3-karing 正式版本

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/publish-karing-release-once.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: karing-release-v2.5.3
  cancel-in-progress: true

env:
  RELEASE_TAG: v2.5.3-karing
  RELEASE_VERSION: 2.5.3
  REVIEWED_RUN_ID: '30607375051'
  EXPECTED_BUILD_COMMIT: 5f04c014b439e995da510843fdc59a6458bb2f8c

jobs:
  publish:
    name: 汇总已审查安装包并发布正式版本
    runs-on: ubuntu-latest
    steps:
      - name: 下载已通过审查的全部平台产物
        uses: actions/download-artifact@v8
        with:
          pattern: karing-*
          path: downloaded-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REVIEWED_RUN_ID }}

      - name: 汇总并复核 12 个安装文件
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p release-assets
          find downloaded-assets -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            -exec cp '{}' release-assets/ \;

          installer_count=$(find release-assets -maxdepth 1 -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            | wc -l)
          if [ "$installer_count" -ne 12 ]; then
            echo "[失败] 应有 12 个安装文件，实际为 $installer_count 个"
            find downloaded-assets -type f -printf '%P\n' | sort
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_BUILD_COMMIT" >/dev/null

          (
            cd release-assets
            sha256sum *.exe *.dmg *.deb *.rpm 2>/dev/null | sort -k2 > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

          cat > release-assets/BUILD_INFO.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Reviewed run: ${REVIEWED_RUN_ID}
          Commit: ${EXPECTED_BUILD_COMMIT}
          Version: ${RELEASE_VERSION}
          Release tag: ${RELEASE_TAG}
          Platforms: Windows x64/ARM64, macOS Intel/Apple Silicon, Linux x64/ARM64/ARMv7
          Signing: unsigned fork build; no upstream Apple notarization or updater signature
          Android: intentionally not included
          EOF

          cat > release-assets/release-notes.md <<EOF
          # Clash Verge Rev Karing v${RELEASE_VERSION}

          本桌面发行版在 Clash Verge Rev / Mihomo 配置链上融合了 Karing 风格分流交互，并完成以下功能：

          - 点击规则行弹出出口选择器，可选无、当前选择、自动选择、直连、拦截及现有策略组
          - 新建规则组时可选空白组、常用模板或复制现有规则组
          - 添加匹配条件时先选择域名、IP、进程、端口、Rule Set 等类型，再选择常用值
          - 连接详情可显示域名、IP、端口、进程名和进程路径，并直接向规则组添加或删除条件
          - 修改规则后复用 Merge 校验、回滚与运行时热加载；活动连接会关闭并在下次连接时重新匹配
          - 清理已移除的 Mihomo 全局指纹字段，并将常见健康检查地址升级为 HTTPS
          - 修复核心停止时代理模式保存、全局关闭优先级及旧地区预设重复问题

          ## 安装包
          - Windows x64 与 ARM64
          - Windows x64 与 ARM64 固定 WebView2 版本
          - macOS Apple Silicon 与 Intel
          - Linux x64、ARM64 与 ARMv7 的 DEB/RPM

          Android 不在本次发行范围内。本分支安装包不包含上游官方签名或 Apple 公证，请使用 SHA256SUMS.txt 验证下载文件。

          Reviewed run: ${REVIEWED_RUN_ID}
          Commit: ${EXPECTED_BUILD_COMMIT}
          EOF

          echo "build_commit=$EXPECTED_BUILD_COMMIT" >> "$GITHUB_OUTPUT"
          echo '[通过] 12 个安装文件及 SHA256 校验全部有效'
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 创建并发布正式 Latest 版本
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          if gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$repo" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" \
            release-assets/*.exe \
            release-assets/*.dmg \
            release-assets/*.deb \
            release-assets/*.rpm \
            release-assets/SHA256SUMS.txt \
            release-assets/BUILD_INFO.txt \
            --repo "$repo" \
            --target "${{ steps.verify.outputs.build_commit }}" \
            --title "Clash Verge Rev Karing v${RELEASE_VERSION}" \
            --notes-file release-assets/release-notes.md \
            --latest

          release_json=$(gh release view "$RELEASE_TAG" --repo "$repo" \
            --json url,tagName,isDraft,isPrerelease,assets,targetCommitish)
          asset_count=$(jq '.assets | length' <<< "$release_json")
          if [ "$asset_count" -ne 14 ]; then
            echo "[失败] Release 应上传 14 个资产，实际为 $asset_count 个"
            jq -r '.assets[].name' <<< "$release_json"
            exit 1
          fi

          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$EXPECTED_BUILD_COMMIT" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and .targetCommitish == $commit' \
            <<< "$release_json" >/dev/null

          echo '[通过] 正式 Release 已创建并包含 14 个资产'
          jq '{url, tagName, targetCommitish, isDraft, isPrerelease, assets: [.assets[].name]}' \
            <<< "$release_json"

  report:
    name: 将正式发行结果回报到 PR
    if: ${{ always() }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: 写入或更新 PR #1 发行状态
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- karing-release-once-status -->'
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          if [ "$PUBLISH_RESULT" = 'success' ]; then
            status='✅ 正式发行成功'
            detail="Release: ${release_url}"
          else
            status="❌ 正式发行失败（${PUBLISH_RESULT}）"
            detail='请查看运行日志中的首个失败步骤。'
          fi

          body=$(cat <<EOF
          ${marker}
          ## Karing 正式发行状态

          ${status}

          - 构建提交：`${EXPECTED_BUILD_COMMIT}`
          - 已审查运行：`${REVIEWED_RUN_ID}`
          - 发行标签：`${RELEASE_TAG}`
          - Action：${run_url}
          - ${detail}
          EOF
          )

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -f body="$body" >/dev/null
          else
            gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
