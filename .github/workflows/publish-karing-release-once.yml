name: Karing 正式发行（一次性）
run-name: 补发 v2.5.3-karing.2 正式版本

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/publish-karing-release-once.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: karing-release-v2.5.3-karing.2
  cancel-in-progress: true

env:
  RELEASE_TAG: v2.5.3-karing.2
  RELEASE_VERSION: 2.5.3-karing.2
  REVIEWED_RUN_ID: '30790427584'
  EXPECTED_BUILD_COMMIT: e8e36b66fa73c270cf6584f4a1209f4e3362952d

jobs:
  publish:
    name: 发布已审查的 12 个安装文件
    runs-on: ubuntu-latest
    steps:
      - name: 下载已审查的完整发行资产
        uses: actions/download-artifact@v8
        with:
          name: karing-release-assets
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REVIEWED_RUN_ID }}

      - name: 复核安装文件、提交与 SHA256
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          installer_count=$(find release-assets -maxdepth 1 -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            | wc -l)
          if [ "$installer_count" -ne 12 ]; then
            echo "[失败] 应有 12 个安装文件，实际为 $installer_count 个"
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_BUILD_COMMIT" >/dev/null
          grep -F "Commit: $EXPECTED_BUILD_COMMIT" release-assets/BUILD_INFO.txt >/dev/null

          (
            cd release-assets
            sha256sum --check SHA256SUMS.txt
          )

          cat > release-assets/release-notes.md <<EOF
          # Clash Verge Rev Karing v${RELEASE_VERSION}

          本版本将 Windows 原生程序连接归因深度接入 Clash Verge Rev / Mihomo 分流链路，不再只是手动维护程序档案。

          ## 核心改动
          - 通过 Windows IP Helper API 枚举 TCP/UDP IPv4/IPv6 连接及 PID
          - 读取进程名称和完整 exe 路径，并回填 Mihomo 活动连接
          - 优先按协议、源端口、目标地址和目标端口精确匹配；仅在源端口归属唯一时降级
          - 规则页展示正在联网的程序，可一键创建程序分流档案
          - 程序档案生成 PROCESS-NAME / PROCESS-PATH 规则，并联动规则组和出口策略
          - 连接页、规则助手、程序项目和代理组共用同一份关系数据
          - Merge / Script 保存后重新生成并热应用运行时配置

          ## 安装包
          - Windows x64 与 ARM64
          - Windows x64 与 ARM64 固定 WebView2 版本
          - macOS Apple Silicon 与 Intel
          - Linux x64、ARM64 与 ARMv7 的 DEB/RPM

          本分支安装包未使用上游官方签名或 Apple 公证。请使用 SHA256SUMS.txt 核验文件。

          Reviewed run: ${REVIEWED_RUN_ID}
          Commit: ${EXPECTED_BUILD_COMMIT}
          EOF

          echo "build_commit=$EXPECTED_BUILD_COMMIT" >> "$GITHUB_OUTPUT"
          echo '[通过] 12 个安装文件及 SHA256 校验全部有效'
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 创建正式 Latest Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          if gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$repo" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" \
            release-assets/*.exe \
            release-assets/*.dmg \
            release-assets/*.deb \
            release-assets/*.rpm \
            release-assets/SHA256SUMS.txt \
            release-assets/BUILD_INFO.txt \
            --repo "$repo" \
            --target "${{ steps.verify.outputs.build_commit }}" \
            --title "Clash Verge Rev Karing v${RELEASE_VERSION}" \
            --notes-file release-assets/release-notes.md \
            --latest

          release_json=$(gh release view "$RELEASE_TAG" --repo "$repo" \
            --json url,tagName,isDraft,isPrerelease,assets,targetCommitish)
          asset_count=$(jq '.assets | length' <<< "$release_json")
          if [ "$asset_count" -ne 14 ]; then
            echo "[失败] Release 应上传 14 个资产，实际为 $asset_count 个"
            jq -r '.assets[].name' <<< "$release_json"
            exit 1
          fi

          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$EXPECTED_BUILD_COMMIT" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and .targetCommitish == $commit' \
            <<< "$release_json" >/dev/null

          echo '[通过] 正式 Release 已创建并包含 14 个资产'
          jq '{url, tagName, targetCommitish, assets: [.assets[].name]}' <<< "$release_json"

  report:
    name: 回报发行结果到 PR
    if: ${{ always() }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: 更新 PR #1 发行状态
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- karing-release-once-status -->'
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          if [ "$PUBLISH_RESULT" = 'success' ]; then
            status='✅ 正式发行成功'
            detail="Release: ${release_url}"
          else
            status="❌ 正式发行失败（${PUBLISH_RESULT}）"
            detail='请查看运行日志中的首个失败步骤。'
          fi

          body=$(cat <<EOF
          ${marker}
          ## Karing 正式发行状态

          ${status}

          - 构建提交：${EXPECTED_BUILD_COMMIT}
          - 已审查运行：${REVIEWED_RUN_ID}
          - 发行标签：${RELEASE_TAG}
          - Action：${run_url}
          - ${detail}
          EOF
          )

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -f body="$body" >/dev/null
          else
            gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
