name: Karing one-shot release control hardening

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-release-control-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: karing-release-control-hardening-once
  cancel-in-progress: false

jobs:
  harden-release-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Harden release authorization and observers
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          OPEN = '$' + '{{'
          CLOSE = '}}'
          def expr(body: str) -> str:
              return OPEN + ' ' + body + ' ' + CLOSE

          main_path = Path('.github/workflows/karing-diagnostics-once.yml')
          main = main_path.read_text(encoding='utf-8')

          old_run_name = "run-name: " + expr("github.event_name == 'pull_request' && '审查 Karing 桌面版安装包' || '构建并发布 Karing 桌面版'")
          new_run_name = "run-name: " + expr("github.event_name == 'pull_request' && '审查 Karing 桌面版安装包' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(karing): publish ') && '构建并发布 Karing 桌面版' || '审查并构建 Karing 桌面版候选')")
          if old_run_name not in main:
              raise SystemExit('main workflow run-name marker not found')
          main = main.replace(old_run_name, new_run_name, 1)

          release_glob = "      - '.release/**'\n"
          if main.count(release_glob) != 2:
              raise SystemExit(f'expected 2 broad .release globs in main workflow, got {main.count(release_glob)}')
          exact_release_paths = "      - '.release/karing-release-tag.txt'\n      - '.release/karing-release-authorize.txt'\n"
          main = main.replace(release_glob, exact_release_paths)

          publish_marker = "\n  publish-release:\n"
          if main.count(publish_marker) != 1:
              raise SystemExit('publish-release marker not unique')

          authorize_job = dedent('''
            
            authorize_release:
              name: 校验正式发行授权
              needs:
                - review
                - package-release
              runs-on: ubuntu-latest
              outputs:
                authorized: @@AUTHORIZED_OUTPUT@@
              steps:
                - name: 检出发行授权提交
                  uses: actions/checkout@v7
                  with:
                    fetch-depth: 2
            
                - name: Fail-closed 校验发行授权
                  id: gate
                  env:
                    RELEASE_TAG: @@RELEASE_TAG@@
                    COMMIT_MESSAGE: @@COMMIT_MESSAGE@@
                  shell: bash
                  run: |
                    set -euo pipefail
                    echo 'authorized=false' >> "$GITHUB_OUTPUT"
            
                    if [ "$GITHUB_EVENT_NAME" != 'push' ]; then
                      echo '非 push 事件：仅构建候选，不发布'
                      exit 0
                    fi
                    if [ "$GITHUB_REF" != 'refs/heads/feature/karing-style-diversion' ]; then
                      echo '非发行分支：仅构建候选，不发布'
                      exit 0
                    fi
                    if [ "$GITHUB_ACTOR" != 'kongzhilv' ]; then
                      echo "非仓库发行账户触发：${GITHUB_ACTOR}"
                      exit 0
                    fi
                    if [[ "$COMMIT_MESSAGE" != "release(karing): publish ${RELEASE_TAG}" ]]; then
                      echo 'commit message 未形成精确发行授权'
                      exit 0
                    fi
            
                    mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
                    if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != '.release/karing-release-authorize.txt' ]; then
                      echo '发行授权提交必须且只能修改 .release/karing-release-authorize.txt'
                      printf 'changed: %s\n' "${changed[@]}"
                      exit 0
                    fi
            
                    test -f .release/karing-release-authorize.txt || { echo '缺少发行授权文件'; exit 0; }
                    authorization=$(tr -d '\r\n' < .release/karing-release-authorize.txt)
                    if [ "$authorization" != "PUBLISH:${RELEASE_TAG}" ]; then
                      echo '发行授权内容与当前 tag 不匹配'
                      exit 0
                    fi
            
                    echo 'authorized=true' >> "$GITHUB_OUTPUT"
                    echo "正式发行授权通过：${RELEASE_TAG} @ ${GITHUB_SHA}"
          ''')
          authorize_job = authorize_job.replace('@@AUTHORIZED_OUTPUT@@', expr('steps.gate.outputs.authorized'))
          authorize_job = authorize_job.replace('@@RELEASE_TAG@@', expr('needs.review.outputs.release_tag'))
          authorize_job = authorize_job.replace('@@COMMIT_MESSAGE@@', expr('github.event.head_commit.message'))
          authorize_job = '\n'.join(('  ' + line) if line else '' for line in authorize_job.splitlines()) + '\n'
          main = main.replace(publish_marker, "\n" + authorize_job + publish_marker, 1)

          old_publish = "    if: " + expr("github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/karing-style-diversion'") + "\n    needs:\n      - review\n      - package-release\n"
          new_publish = "    if: " + expr("needs.authorize_release.outputs.authorized == 'true'") + "\n    needs:\n      - review\n      - package-release\n      - authorize_release\n"
          if old_publish not in main:
              raise SystemExit('publish-release condition marker not found')
          main = main.replace(old_publish, new_publish, 1)
          main_path.write_text(main, encoding='utf-8')

          for workflow_name in ('karing-windows-hotspot-v26.yml', 'karing-windows-wfp-v21.yml'):
              path = Path('.github/workflows') / workflow_name
              text = path.read_text(encoding='utf-8')
              if release_glob not in text:
                  raise SystemExit(f'{workflow_name}: broad .release glob not found')
              path.write_text(text.replace(release_glob, exact_release_paths), encoding='utf-8')

          observer_path = Path('.github/workflows/karing-release-observer.yml')
          observer = observer_path.read_text(encoding='utf-8')
          start = observer.index('    paths:\n')
          end = observer.index('\n\npermissions:', start)
          observer = observer[:start] + "    paths:\n      - '.github/workflows/karing-release-observer.yml'\n      - '.release/karing-release-authorize.txt'" + observer[end:]
          observer = observer.replace('          fetch-depth: 1\n', '          fetch-depth: 2\n', 1)
          job_marker = "  verify-release:\n    name: 核验当前 Karing 正式发行\n"
          if job_marker not in observer:
              raise SystemExit('observer verify-release marker not found')
          observer = observer.replace(job_marker, job_marker + "    if: " + expr("startsWith(github.event.head_commit.message, 'release(karing): publish ')") + "\n", 1)

          validation_marker = "          version=$(jq -r .version package.json)\n          if [[ ! \"$release_tag\" =~ ^v${version}-karing\\.[0-9]+$ ]]; then\n            echo \"非法 Karing Release tag: $release_tag\" >&2\n            exit 1\n          fi\n"
          if validation_marker not in observer:
              raise SystemExit('observer release tag validation marker not found')
          validation_extra = dedent('''
            
            authorization=$(tr -d '\\r\\n' < .release/karing-release-authorize.txt)
            if [ "$authorization" != "PUBLISH:${release_tag}" ]; then
              echo "发行授权内容与 tag 不匹配: $authorization" >&2
              exit 1
            fi
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$source_sha")
            if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != '.release/karing-release-authorize.txt' ]; then
              echo '发行核验要求授权提交只能修改发行授权文件' >&2
              printf 'changed: %s\\n' "${changed[@]}" >&2
              exit 1
            fi
          ''')
          validation_extra = '\n'.join('          ' + line if line else '' for line in validation_extra.splitlines()) + '\n'
          observer = observer.replace(validation_marker, validation_marker + validation_extra, 1)
          observer_path.write_text(observer, encoding='utf-8')

          Path('.release/karing-release-tag.txt').write_text('v2.5.4-karing.27\n', encoding='utf-8')

      - name: Validate hardened workflow structure
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'authorize_release:' .github/workflows/karing-diagnostics-once.yml
          grep -Fq "needs.authorize_release.outputs.authorized == 'true'" .github/workflows/karing-diagnostics-once.yml
          grep -Fq '.release/karing-release-authorize.txt' .github/workflows/karing-diagnostics-once.yml
          ! grep -Fq "'.release/**'" .github/workflows/karing-diagnostics-once.yml
          ! grep -Fq "'.release/**'" .github/workflows/karing-release-observer.yml
          ! grep -Fq "'.release/**'" .github/workflows/karing-windows-hotspot-v26.yml
          ! grep -Fq "'.release/**'" .github/workflows/karing-windows-wfp-v21.yml
          test "$(tr -d '\r\n' < .release/karing-release-tag.txt)" = 'v2.5.4-karing.27'
          git diff --check

      - name: Stage hardened workflow blobs outside Actions paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .karing-generated
          cp .github/workflows/karing-diagnostics-once.yml .karing-generated/karing-diagnostics-once.yml.txt
          cp .github/workflows/karing-release-observer.yml .karing-generated/karing-release-observer.yml.txt
          cp .github/workflows/karing-windows-hotspot-v26.yml .karing-generated/karing-windows-hotspot-v26.yml.txt
          cp .github/workflows/karing-windows-wfp-v21.yml .karing-generated/karing-windows-wfp-v21.yml.txt
          cp .release/karing-release-tag.txt .karing-generated/karing-release-tag.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .karing-generated
          git commit -m 'chore(ci): stage hardened release workflow blobs'
          git push origin HEAD:feature/karing-style-diversion
