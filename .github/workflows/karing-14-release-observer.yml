name: Karing .14 Release Observer

on:
  workflow_run:
    workflows:
      - Karing 桌面版审查与发行
    types:
      - requested
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  report:
    if: ${{ github.event.workflow_run.head_branch == 'feature/karing-style-diversion' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report release run to merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- karing-14-release-observer -->'
          body="${marker}
          ## Karing .14 release observer

          - action: \`${RUN_EVENT}\`
          - run: \`${RUN_ID}\`
          - source: \`${RUN_SHA}\`
          - status: \`${RUN_STATUS}\`
          - conclusion: \`${RUN_CONCLUSION:-pending}\`
          - url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/6/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n1 || true)
          if [ -n "$comment_id" ]; then
            jq -n --arg body "$body" '{body:$body}' | \
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input - >/dev/null
          else
            jq -n --arg body "$body" '{body:$body}' | \
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/6/comments" --input - >/dev/null
          fi

      - name: Remove one-shot observer after completion
        if: ${{ github.event.action == 'completed' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout dev
          rm -f .github/workflows/karing-14-release-observer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/karing-14-release-observer.yml
          git commit -m 'chore: remove completed karing .14 observer'
          git push origin dev
