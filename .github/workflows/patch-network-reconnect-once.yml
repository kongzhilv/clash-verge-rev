name: Patch Windows reconnect recovery once

on:
  push:
    branches:
      - fix/mihomo-control-readiness
    paths:
      - '.github/workflows/patch-network-reconnect-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mihomo-control-readiness
          fetch-depth: 0

      - name: Patch Windows TUN reconnect behavior and permanent release gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('src-tauri/src/utils/windows_network.rs')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''pub fn apply_managed_upstream(config: &mut Mapping, route: &WindowsUpstreamRoute) {\n    config.insert(\n        Value::from("interface-name"),\n        Value::from(route.interface_alias.as_str()),\n    );\n\n    if let Some(Value::Mapping(tun)) = config.get_mut("tun") {\n        tun.insert(Value::from("auto-detect-interface"), Value::from(false));\n''',
              '''pub fn apply_managed_upstream(config: &mut Mapping, route: &WindowsUpstreamRoute) {\n    if let Some(Value::Mapping(tun)) = config.get_mut("tun") {\n        // Do not pin the top-level outbound interface here. Windows can lose and\n        // restore connectivity on another physical adapter while Mihomo keeps\n        // running; keeping auto detection enabled lets Mihomo's own network\n        // monitor follow that change instead of dialing through a dead adapter.\n        tun.insert(Value::from("auto-detect-interface"), Value::from(true));\n''',
              'dynamic interface behavior',
          )
          text = replace_once(
              text,
              'fn managed_upstream_pins_interface_and_protects_lan_and_hotspot_routes() {',
              'fn managed_upstream_keeps_dynamic_interface_and_protects_lan_and_hotspot_routes() {',
              'test name',
          )
          text = replace_once(
              text,
              '''        assert_eq!(config.get("interface-name").and_then(Value::as_str), Some("WLAN"));\n        let tun = config.get("tun").and_then(Value::as_mapping).unwrap();\n        assert_eq!(tun.get("auto-detect-interface").and_then(Value::as_bool), Some(false));\n''',
              '''        assert!(config.get("interface-name").is_none());\n        let tun = config.get("tun").and_then(Value::as_mapping).unwrap();\n        assert_eq!(tun.get("auto-detect-interface").and_then(Value::as_bool), Some(true));\n''',
              'dynamic interface assertions',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src-tauri/src/core/manager/config.rs')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''        logging!(\n            info,\n            Type::Core,\n            "Windows TUN safety: pinned outbound interface={} index={} source={} gateway={} metric={} (auto-detect-interface=false)",\n            route.interface_alias,\n            route.interface_index,\n            route.source_address,\n            route.gateway,\n            route.effective_metric\n        );\n''',
              '''        logging!(\n            info,\n            Type::Core,\n            "Windows TUN safety: verified stable physical upstream={} index={} source={} gateway={} metric={}; Mihomo auto-detect-interface remains enabled for reconnect/failover",\n            route.interface_alias,\n            route.interface_index,\n            route.source_address,\n            route.gateway,\n            route.effective_metric\n        );\n        diagnostics::info(\n            "windows-tun",\n            "dynamic-upstream-enabled",\n            json!({\n                "observed_interface": route.interface_alias.as_str(),\n                "observed_interface_index": route.interface_index,\n                "observed_source": route.source_address.as_str(),\n                "observed_gateway": route.gateway.as_str(),\n                "auto_detect_interface": true,\n                "top_level_interface_pinned": false,\n            }),\n        );\n''',
              'runtime logging',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/karing-diagnostics-once.yml')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''          check_contains src-tauri/src/utils/windows_network.rs 'Value::from("auto-detect-interface"), Value::from(false)' 'Windows TUN 运行时固定物理出口并关闭自动抖动探测'\n''',
              '''          check_contains src-tauri/src/utils/windows_network.rs 'Value::from("auto-detect-interface"), Value::from(true)' 'Windows TUN 保持 Mihomo 动态出口检测以恢复断网/切网'\n          check_not_contains src-tauri/src/utils/windows_network.rs 'config.insert(\n        Value::from("interface-name")' 'Windows TUN 不再写死顶层物理出口接口'\n          check_contains src-tauri/src/core/manager/config.rs 'dynamic-upstream-enabled' 'Windows TUN 记录动态出口恢复策略'\n''',
              'release source gate',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format and inspect source diff
        run: |
          rustup toolchain install 1.95 --profile minimal --component rustfmt
          cargo +1.95 fmt --all
          git diff --check
          git diff -- src-tauri/src/utils/windows_network.rs src-tauri/src/core/manager/config.rs

      - name: Export patched permanent workflow
        uses: actions/upload-artifact@v7
        with:
          name: patched-karing-diagnostics-workflow
          path: .github/workflows/karing-diagnostics-once.yml
          if-no-files-found: error
          retention-days: 1

      - name: Commit product source changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/utils/windows_network.rs src-tauri/src/core/manager/config.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep Windows TUN outbound dynamic after reconnect'
          git push origin HEAD:fix/mihomo-control-readiness
