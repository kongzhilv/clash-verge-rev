name: Prepare Karing UI maturity release

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/patch-karing-ui-release-once.yml'
      - 'scripts/patch-karing-ui-release.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Patch permanent release workflow
        run: node scripts/patch-karing-ui-release.mjs

      - name: Commit permanent workflow and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/patch-karing-ui-release-once.yml
          rm scripts/patch-karing-ui-release.mjs
          git add .github/workflows/karing-diagnostics-once.yml .github/workflows/patch-karing-ui-release-once.yml scripts/patch-karing-ui-release.mjs
          git commit -m 'ci: audit and publish Karing UI maturity release'
          git push origin HEAD:feature/karing-style-diversion
