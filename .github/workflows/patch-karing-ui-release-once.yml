name: Prepare Karing UI maturity release

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/patch-karing-ui-release-once.yml'
      - 'scripts/patch-karing-ui-release.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Generate permanent release workflow
        run: |
          node scripts/patch-karing-ui-release.mjs
          cp .github/workflows/karing-diagnostics-once.yml scripts/karing-diagnostics-generated.yml

      - name: Stage generated workflow for authorized commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/karing-diagnostics-generated.yml
          git commit -m 'ci: stage generated Karing UI release workflow'
          git push origin HEAD:feature/karing-style-diversion
