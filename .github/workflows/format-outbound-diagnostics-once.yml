name: Format outbound diagnostics once

on:
  push:
    branches:
      - fix/outbound-failure-diagnostics-ci
    paths:
      - '.github/workflows/format-outbound-diagnostics-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/outbound-failure-diagnostics-ci
          fetch-depth: 0
      - name: Install repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt
      - name: Format only outbound diagnostic changes
        run: |
          cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
          git diff --check
      - name: Commit formatted product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/core/outbound_diagnostics.rs src-tauri/src/core/manager/mod.rs src-tauri/src/core/mod.rs
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: format outbound diagnostics'
          git push origin HEAD:fix/outbound-failure-diagnostics-ci
