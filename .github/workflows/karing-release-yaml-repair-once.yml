name: Karing release YAML repair once

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-release-yaml-repair-once.yml'
      - 'scripts/repair-karing-release-yaml.py'

permissions:
  contents: write

concurrency:
  group: karing-release-yaml-repair-once
  cancel-in-progress: false

jobs:
  repair-and-stage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Repair generated release YAML
        run: python scripts/repair-karing-release-yaml.py

      - name: Actionlint repaired workflows
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -oneline \
            .github/workflows/karing-diagnostics-once.yml \
            .github/workflows/karing-release-observer.yml \
            .github/workflows/karing-windows-hotspot-v26.yml \
            .github/workflows/karing-windows-wfp-v21.yml \
            .github/workflows/karing-workflow-lint.yml
          git diff --check

      - name: Stage repaired workflow blobs outside Actions paths
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .karing-generated2
          mkdir -p .karing-generated2
          cp .github/workflows/karing-diagnostics-once.yml .karing-generated2/karing-diagnostics-once.yml.txt
          cp .github/workflows/karing-release-observer.yml .karing-generated2/karing-release-observer.yml.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .karing-generated2
          git commit -m 'chore(ci): stage repaired release workflow blobs'
          git push origin HEAD:feature/karing-style-diversion
