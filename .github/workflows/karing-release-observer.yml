name: Karing 发行观察器

on:
  push:
    branches:
      - feature/karing-style-diversion

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: karing-release-observer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: 跟踪审查与正式发行
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '1'
      RELEASE_TAG: v2.5.4-karing.7
      RELEASE_BRANCH: feature/karing-style-diversion
      MAIN_WORKFLOW: karing-diagnostics-once.yml
      STATUS_MARKER: '<!-- karing-v254-release-observer -->'
    steps:
      - name: 等待主发行运行并持续回报
        shell: bash
        run: |
          set -euo pipefail

          update_comment() {
            local body="$1"
            local comment_id
            comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq ".[] | select(.body | contains(\"${STATUS_MARKER}\")) | .id" | head -n1 || true)
            if [ -n "$comment_id" ]; then
              jq -n --arg body "$body" '{body: $body}' | \
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input - >/dev/null
            else
              jq -n --arg body "$body" '{body: $body}' | \
                gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - >/dev/null
            fi
          }

          run_id=''
          release_sha=''
          for attempt in $(seq 1 60); do
            run_json=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${MAIN_WORKFLOW}/runs" \
              -f branch="${RELEASE_BRANCH}" -f per_page=20)
            run_id=$(jq -r '.workflow_runs[0].id // empty' <<<"$run_json")
            release_sha=$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$run_json")
            if [ -n "$run_id" ] && [ -n "$release_sha" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$run_id" ] || [ -z "$release_sha" ]; then
            update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ❌ 没有找到 ${RELEASE_BRANCH} 上的主发行运行。

          观察器：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            exit 1
          fi

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ⏳ 正在审查与构建

          - 发行提交：\`${release_sha}\`
          - 观察器提交：\`${GITHUB_SHA}\`
          - 主发行运行：${run_url}
          - 预期标签：\`${RELEASE_TAG}\`"

          status=''
          conclusion=''
          for attempt in $(seq 1 300); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
            if [ "$status" = 'completed' ]; then
              break
            fi
            sleep 60
          done

          if [ "$status" != 'completed' ]; then
            update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ❌ 主发行运行超时，未得到完成结果。

          - 发行提交：\`${release_sha}\`
          - 主发行运行：${run_url}"
            exit 1
          fi

          if [ "$conclusion" != 'success' ]; then
            failed_jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | (.name + ": " + (.conclusion // "unknown"))] | join("；")')
            update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ❌ 审查或构建失败

          - 发行提交：\`${release_sha}\`
          - 主发行运行：${run_url}
          - 失败作业：${failed_jobs:-未取得作业信息}"
            exit 1
          fi

          release_json=''
          for attempt in $(seq 1 30); do
            if release_json=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json url,tagName,targetCommitish,isDraft,isPrerelease,isLatest,assets 2>/dev/null); then
              target=$(jq -r '.targetCommitish' <<<"$release_json")
              if [ "$target" = "$release_sha" ]; then
                break
              fi
            fi
            release_json=''
            sleep 10
          done

          if [ -z "$release_json" ]; then
            update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ❌ 安装包审查成功，但没有找到指向发行提交的公开 Release \`${RELEASE_TAG}\`。

          - 发行提交：\`${release_sha}\`
          - 主发行运行：${run_url}"
            exit 1
          fi

          release_url=$(jq -r '.url' <<<"$release_json")
          target=$(jq -r '.targetCommitish' <<<"$release_json")
          draft=$(jq -r '.isDraft' <<<"$release_json")
          prerelease=$(jq -r '.isPrerelease' <<<"$release_json")
          latest=$(jq -r '.isLatest' <<<"$release_json")
          asset_count=$(jq '.assets | length' <<<"$release_json")
          tag_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | awk '{print $1}')

          test "$target" = "$release_sha"
          test "$tag_sha" = "$release_sha"
          test "$draft" = 'false'
          test "$prerelease" = 'false'
          test "$latest" = 'true'
          test "$asset_count" -eq 14

          mkdir -p release-audit
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --pattern BUILD_INFO.txt --dir release-audit
          grep -Fq "Commit: ${release_sha}" release-audit/BUILD_INFO.txt
          checksum_lines=$(grep -cve '^$' release-audit/SHA256SUMS.txt)
          test "$checksum_lines" -eq 12

          update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ✅ 审查、12 平台安装文件构建与正式发行全部完成

          - 发行提交：\`${release_sha}\`
          - 主发行运行：${run_url}
          - Release：${release_url}
          - 标签：\`${RELEASE_TAG}\`，精确指向发行提交
          - Release 资产：14 个
          - SHA256 安装文件记录：12 条
          - Draft：否；Pre-release：否；Latest：是"
