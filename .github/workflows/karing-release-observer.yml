name: Karing .18 发行核验

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-release-observer.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: karing-release-observer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: 核验 v2.5.4-karing.18 正式发行
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_WORKFLOW: karing-diagnostics-once.yml
      RELEASE_BRANCH: feature/karing-style-diversion
      PR_NUMBER: '10'
      STATUS_MARKER: '<!-- karing-v254-karing18-release-audit -->'
    steps:
      - name: 检出发行分支
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: 等待并只读核验正式发行
        shell: bash
        run: |
          set -euo pipefail

          # 观察器自身是紧跟发行源提交之后的只读审计提交，因此父提交
          # 才是必须与 Release tag / target_commitish 完全一致的发行源。
          source_sha=$(git rev-parse HEAD^)
          release_tag=$(git show "${source_sha}:.release/karing-release-tag.txt" | tr -d '\r\n')
          test "$release_tag" = 'v2.5.4-karing.18'

          post_failure() {
            local reason="$1"
            gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "${STATUS_MARKER}
          ### ❌ ${release_tag} 发行核验失败
          - source: \`${source_sha}\`
          - reason: ${reason}

          观察器只读核验，未删除、覆盖或重建任何 Release。" >/dev/null || true
          }
          trap 'post_failure "observer step failed at line ${LINENO}"' ERR

          run_id=''
          for attempt in $(seq 1 120); do
            run_id=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${MAIN_WORKFLOW}/runs" \
              -f branch="$RELEASE_BRANCH" -f event=push -f per_page=30 \
              --jq ".workflow_runs[] | select(.head_sha == \"${source_sha}\") | .id" | head -n1 || true)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          test -n "$run_id"

          status=''
          for attempt in $(seq 1 240); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            if [ "$status" = 'completed' ]; then
              break
            fi
            sleep 15
          done
          test "$status" = 'completed'

          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          conclusion=$(jq -r '.conclusion' <<<"$run_json")
          test "$conclusion" = 'success'

          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")
          failed_jobs=$(jq -r '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .name] | join("；")' <<<"$jobs_json")
          test -z "$failed_jobs"

          for required_job in \
            '审查并验证源码' \
            '构建 Windows x64' \
            '构建 Windows ARM64' \
            '构建固定 WebView2 x64' \
            '构建固定 WebView2 ARM64' \
            '构建 macOS Apple Silicon' \
            '构建 macOS Intel' \
            '构建 Linux x64' \
            '构建 Linux ARM64' \
            '构建 Linux ARMv7' \
            '汇总并审查发行产物' \
            '发布正式 GitHub Release'; do
            count=$(jq --arg name "$required_job" '[.jobs[] | select(.name == $name and .conclusion == "success")] | length' <<<"$jobs_json")
            test "$count" -eq 1
          done

          artifact_count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "karing-release-assets" and .expired == false)] | length')
          test "$artifact_count" -eq 1

          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}")
          asset_count=$(jq '.assets | length' <<<"$release_json")
          target=$(jq -r '.target_commitish' <<<"$release_json")
          draft=$(jq -r '.draft' <<<"$release_json")
          prerelease=$(jq -r '.prerelease' <<<"$release_json")
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" --jq '.object.sha')

          test "$asset_count" -eq 14
          test "$target" = "$source_sha"
          test "$tag_sha" = "$source_sha"
          test "$draft" = false
          test "$prerelease" = false
          test "$latest_tag" = "$release_tag"

          rm -rf release-audit
          mkdir -p release-audit
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --dir release-audit
          test -f release-audit/SHA256SUMS.txt
          test -f release-audit/BUILD_INFO.txt
          grep -Fqx "Commit: ${source_sha}" release-audit/BUILD_INFO.txt
          grep -Fqx "Release tag: ${release_tag}" release-audit/BUILD_INFO.txt

          installer_count=$(find release-audit -maxdepth 1 -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \
            \) | wc -l)
          checksum_lines=$(grep -cve '^$' release-audit/SHA256SUMS.txt)
          test "$installer_count" -eq 12
          test "$checksum_lines" -eq 12
          (
            cd release-audit
            sha256sum --check SHA256SUMS.txt
          )

          release_url=$(jq -r '.html_url' <<<"$release_json")
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "${STATUS_MARKER}
          ### ✅ ${release_tag} 正式发行核验通过
          - main run: \`${run_id}\` / \`${conclusion}\`
          - source/tag target: \`${source_sha}\`
          - public assets: **${asset_count}**（12 个安装文件 + SHA256SUMS + BUILD_INFO）
          - Latest: \`${latest_tag}\`
          - draft: \`${draft}\`；prerelease: \`${prerelease}\`
          - SHA256: **12/12 verified**
          - Release: ${release_url}

          观察器全程只读核验，没有删除、覆盖或重建 Release。" >/dev/null
