name: Karing 发行观察器

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: karing-release-observer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: 跟踪审查与正式发行
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '1'
      RELEASE_TAG: v2.5.4-karing.7
      RELEASE_BRANCH: feature/karing-style-diversion
      MAIN_WORKFLOW: karing-diagnostics-once.yml
      STATUS_MARKER: '<!-- karing-v254-release-observer -->'
    steps:
      - name: 等待对应源码提交的主发行运行
        shell: bash
        run: |
          set -euo pipefail

          update_comment() {
            local body="$1"
            local comment_id
            comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq ".[] | select(.body | contains(\"${STATUS_MARKER}\")) | .id" | head -n1 || true)
            if [ -n "$comment_id" ]; then
              jq -n --arg body "$body" '{body: $body}' | \
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input - >/dev/null
            else
              jq -n --arg body "$body" '{body: $body}' | \
                gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - >/dev/null
            fi
          }

          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${MAIN_WORKFLOW}/runs" \
              -f branch="${RELEASE_BRANCH}" -f per_page=30 \
              --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\") | .id" | head -n1 || true)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$run_id" ]; then
            update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ❌ 没有找到源码提交 \`${GITHUB_SHA}\` 对应的主发行运行。"
            exit 1
          fi

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ⏳ 正在审查、构建并发行

          - 源码提交：\`${GITHUB_SHA}\`
          - 主发行运行：${run_url}
          - 预期标签：\`${RELEASE_TAG}\`"

          status=''
          conclusion=''
          for attempt in $(seq 1 300); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
            if [ "$status" = 'completed' ]; then
              break
            fi
            sleep 60
          done

          if [ "$status" != 'completed' ] || [ "$conclusion" != 'success' ]; then
            failed_jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | (.name + ": " + (.conclusion // "unknown"))] | join("；")')
            update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ❌ 审查、构建或发行未全部成功

          - 源码提交：\`${GITHUB_SHA}\`
          - 主发行运行：${run_url}
          - 失败作业：${failed_jobs:-未取得作业信息}"
            exit 1
          fi

          release_json=''
          for attempt in $(seq 1 30); do
            if release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null); then
              break
            fi
            sleep 10
          done
          test -n "$release_json"

          asset_count=$(jq '.assets | length' <<<"$release_json")
          draft=$(jq -r '.draft' <<<"$release_json")
          prerelease=$(jq -r '.prerelease' <<<"$release_json")
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          test "$asset_count" -eq 14
          test "$draft" = false
          test "$prerelease" = false
          test "$latest_tag" = "$RELEASE_TAG"

          rm -rf release-audit
          mkdir -p release-audit
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --pattern BUILD_INFO.txt --dir release-audit
          grep -Fq "Commit: ${GITHUB_SHA}" release-audit/BUILD_INFO.txt
          checksum_lines=$(grep -cve '^$' release-audit/SHA256SUMS.txt)
          test "$checksum_lines" -eq 12

          release_url=$(jq -r '.html_url' <<<"$release_json")
          release_target=$(jq -r '.target_commitish' <<<"$release_json")
          update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ✅ 源码审查、全平台构建与正式发行全部完成

          - 构建源码：\`${GITHUB_SHA}\`
          - Release 目标：\`${release_target}\`
          - 主发行运行：${run_url}
          - Release：${release_url}
          - 标签：\`${RELEASE_TAG}\`
          - Release 资产：14 个；SHA256 安装文件记录：12 条
          - Draft：否；Pre-release：否；Latest：是"
