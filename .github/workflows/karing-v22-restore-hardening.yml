name: Karing v22 restore manager hardening

on:
  push:
    branches:
      - fix/karing-windows-hotspot-v22
    paths:
      - '.github/workflows/karing-v22-restore-hardening.yml'

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-v22
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Make restore stop profile-scoped in the normal path
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          p = Path('src-tauri/src/core/windows_hotspot_ics.rs')
          text = p.read_text(encoding='utf-8')
          old = '''fn restore_snapshot_unlocked(path: &Path, snapshot: &SavedTetheringState) -> Result<()> {
    let _apartment = WinRtApartment::init()?;
    let items = profiles()?;
    let original = find_profile_by_saved_guid(&items, &snapshot.original_public_guid)?
        .ok_or_else(|| anyhow!("original hotspot public ConnectionProfile is no longer available"))?;

    require_capability(&original)?;
    let original_manager = manager_for(&original)?;

    // Tethering state is system-global. Stop the current session first even if the
    // original source profile is not the profile currently backing the hotspot.
    stop_tethering(&original_manager, "restore-stop-current")?;
    if snapshot.hotspot_was_on {
        start_tethering(&original_manager, "restore-original-public")?;
    }

    remove_snapshot(path)?;
    diagnostics::info(
        "windows-hotspot-winrt",
        "lease-restored",
        json!({
            "original_public_guid": snapshot.original_public_guid,
            "original_public_profile": snapshot.original_public_profile,
            "hotspot_was_on": snapshot.hotspot_was_on,
            "snapshot_removed": true,
            "strategy": "winrt-create-from-connection-profile",
        }),
    );
    Ok(())
}
'''
          new = '''fn restore_snapshot_unlocked(path: &Path, snapshot: &SavedTetheringState) -> Result<()> {
    let _apartment = WinRtApartment::init()?;
    let items = profiles()?;
    let original = find_profile_by_saved_guid(&items, &snapshot.original_public_guid)?
        .ok_or_else(|| anyhow!("original hotspot public ConnectionProfile is no longer available"))?;

    require_capability(&original)?;
    let original_manager = manager_for(&original)?;

    // A manager created from a ConnectionProfile is profile-scoped: the profile is
    // its public interface. In the normal restore path, stop the Mihomo-backed
    // session through the same saved TUN profile that created it, then restart with
    // the saved physical public profile. Do not assume cross-profile Stop semantics.
    if let Some(tun_profile) = find_profile_by_saved_guid(&items, &snapshot.tun_guid)? {
        let tun_manager = manager_for(&tun_profile)?;
        stop_tethering(&tun_manager, "restore-stop-mihomo")?;
    } else {
        // Crash/restart can remove the ephemeral TUN profile before reconciliation.
        // There is no longer a profile-scoped Mihomo manager to address. Use the
        // original manager only as a documented recovery fallback and keep the
        // snapshot until the physical restart has been verified.
        diagnostics::warn(
            "windows-hotspot-winrt",
            "restore-stop-fallback-original-profile",
            json!({
                "tun_guid": snapshot.tun_guid,
                "original_public_guid": snapshot.original_public_guid,
                "reason": "saved-tun-profile-missing",
                "normal_path": false,
            }),
        );
        stop_tethering(&original_manager, "restore-stop-fallback-original")?;
    }

    if snapshot.hotspot_was_on {
        start_tethering(&original_manager, "restore-original-public")?;
    }

    remove_snapshot(path)?;
    diagnostics::info(
        "windows-hotspot-winrt",
        "lease-restored",
        json!({
            "original_public_guid": snapshot.original_public_guid,
            "original_public_profile": snapshot.original_public_profile,
            "hotspot_was_on": snapshot.hotspot_was_on,
            "snapshot_removed": true,
            "strategy": "profile-scoped-stop-then-original-profile-start",
        }),
    );
    Ok(())
}
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one restore function anchor, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
          node scripts/check-windows-hotspot-v22.mjs
          grep -Fq 'restore-stop-mihomo' src-tauri/src/core/windows_hotspot_ics.rs
          grep -Fq 'restore-stop-fallback-original-profile' src-tauri/src/core/windows_hotspot_ics.rs
          ! grep -Fq 'Tethering state is system-global' src-tauri/src/core/windows_hotspot_ics.rs
      - name: Commit source-only restore hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/core/windows_hotspot_ics.rs
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git commit -m 'fix(windows): stop hotspot through saved Mihomo profile'
          git push origin HEAD:fix/karing-windows-hotspot-v22
