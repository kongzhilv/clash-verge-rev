name: Karing v22 saved GUID uniqueness hardening

on:
  push:
    branches:
      - fix/karing-windows-hotspot-v22
    paths:
      - '.github/workflows/karing-v22-restore-hardening.yml'

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-v22
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Fail closed on ambiguous persisted ConnectionProfile GUIDs
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from base64 import b64decode
          from pathlib import Path
          old = b64decode('').decode()
          new = b64decode('').decode()
          controller = Path('src-tauri/src/core/windows_hotspot_ics.rs')
          text = controller.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one saved-GUID lookup anchor, found {count}')
          controller.write_text(text.replace(old, new, 1), encoding='utf-8')

          gate = Path('scripts/check-windows-hotspot-v22.mjs')
          gate_text = gate.read_text(encoding='utf-8')
          anchor = "  'original-public-profile-ambiguous',\n"
          addition = "  'saved adapter GUID {guid} mapped to {count} ConnectionProfiles',\n"
          if addition not in gate_text:
              if gate_text.count(anchor) != 1:
                  raise SystemExit('expected one static-gate insertion anchor')
              gate_text = gate_text.replace(anchor, anchor + addition, 1)
              gate.write_text(gate_text, encoding='utf-8')
          PY
          cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
          node scripts/check-windows-hotspot-v22.mjs
          grep -Fq 'saved adapter GUID {guid} mapped to {count} ConnectionProfiles' src-tauri/src/core/windows_hotspot_ics.rs
          grep -Fq 'restore-stop-mihomo' src-tauri/src/core/windows_hotspot_ics.rs
      - name: Commit source and permanent gate hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/core/windows_hotspot_ics.rs scripts/check-windows-hotspot-v22.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No hardening changes needed.'
            exit 0
          fi
          git commit -m 'fix(windows): reject ambiguous saved hotspot profiles'
          git push origin HEAD:fix/karing-windows-hotspot-v22
