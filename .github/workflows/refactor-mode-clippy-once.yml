name: Refactor mode Clippy once

on:
  push:
    branches:
      - fix/mode-state-diagnostics
    paths:
      - '.github/workflows/refactor-mode-clippy-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mode-state-diagnostics
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Apply source refactor
        run: python3 scripts/refactor_mode_once.py
      - name: Format Rust
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
      - name: Run strict Clippy
        run: cargo clippy-all
      - name: Commit product source only
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/src/cmd/clash.rs src-tauri/src/feat/clash.rs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: split mode transaction helpers for strict Clippy'
          git push origin HEAD:fix/mode-state-diagnostics
