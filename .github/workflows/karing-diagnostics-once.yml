name: Finalize Karing Source

on:
  workflow_dispatch:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-diagnostics-once.yml'

permissions:
  contents: write

concurrency:
  group: finalize-karing-source
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Apply reviewed source registration
        shell: python
        run: |
          from pathlib import Path

          lib = Path('src-tauri/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          old = '''            cmd::start_core,\n            cmd::stop_core,\n            cmd::restart_core,'''
          new = '''            cmd::start_core,\n            cmd::stop_core,\n            cmd::start_proxy,\n            cmd::stop_proxy,\n            cmd::restart_core,'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'cmd::start_proxy' not in text or 'cmd::stop_proxy' not in text:
              raise SystemExit('core command registration anchor not found')
          lib.write_text(text, encoding='utf-8')

          cmds = Path('src/services/cmds.ts')
          text = cmds.read_text(encoding='utf-8')
          old = "export const getRunningMode = async () => {\n  return invoke<string>('get_running_mode')\n}"
          new = "export const getRunningMode = async () => {\n  return invoke<'Sidecar' | 'Service' | 'NotRunning'>('get_running_mode')\n}"
          if old in text:
              text = text.replace(old, new, 1)
          elif "invoke<'Sidecar' | 'Service' | 'NotRunning'>" not in text:
              raise SystemExit('getRunningMode anchor not found')
          cmds.write_text(text, encoding='utf-8')

          once = Path('.github/workflows/finalize-karing-source-once.yml')
          if once.exists():
              once.unlink()

      - name: Commit source finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs src/services/cmds.ts .github/workflows/finalize-karing-source-once.yml
          if git diff --cached --quiet; then
            echo 'Source is already finalized.'
            exit 0
          fi
          git commit -m 'fix: register isolated proxy lifecycle commands [source-finalized]'
          git push origin HEAD:feature/karing-style-diversion
