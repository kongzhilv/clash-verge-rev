name: Karing All-Platform Test Release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-diagnostics-once.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  NODE_OPTIONS: --max_old_space_size=4096
  RELEASE_TAG: karing-test-latest

concurrency:
  group: karing-all-platform-test-release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare test release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Read version
        id: meta
        shell: bash
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true \
              --silent
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" \
              --silent
          fi

          notes=$(cat <<EOF
          Unsigned test builds from \`feature/karing-style-diversion\`.

          Commit: \`${GITHUB_SHA}\`
          Version: \`${{ steps.meta.outputs.version }}\`

          Targets included after all jobs succeed:
          - Windows x64 and Windows ARM64 (NSIS)
          - Windows x64 and ARM64 fixed-WebView2 editions
          - macOS Apple Silicon and Intel (DMG)
          - Linux x64, ARM64 and ARMv7 (DEB/RPM)

          These are development builds without official code signing, notarization, or updater signatures.
          EOF
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "Clash Verge Rev Karing diversion test build" \
              --notes "$notes" \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Clash Verge Rev Karing diversion test build" \
              --notes "$notes" \
              --prerelease
          fi

  native-builds:
    name: Build ${{ matrix.id }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - id: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
          - id: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - id: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
          - id: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing-all-platform
          key: ${{ matrix.os }}-${{ matrix.target }}
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Mihomo sidecars
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Disable updater artifact signing (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci | Out-Null
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 .ci/tauri-test.conf.json

      - name: Disable updater artifact signing (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .ci/tauri-test.conf.json

      - name: Build Tauri bundle
        run: pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-test.conf.json

      - name: Upload Windows bundle
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: karing-${{ matrix.id }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload macOS bundle
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: karing-${{ matrix.id }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Linux bundles
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: karing-${{ matrix.id }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux-arm-builds:
    name: Build Linux ${{ matrix.arch }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: arm64
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf

    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing-linux-arm
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies and prepare sidecars
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild ${{ matrix.target }}

      - name: Configure Ubuntu multiarch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/sources.list <<'EOF'
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF

          if [ -f /etc/apt/sources.list ]; then
            sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          fi
          sudo mv /tmp/sources.list /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1:${{ matrix.arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.arch }} \
            libayatana-appindicator3-dev:${{ matrix.arch }} \
            libssl-dev:${{ matrix.arch }} \
            patchelf:${{ matrix.arch }} \
            librsvg2-dev:${{ matrix.arch }}

      - name: Install aarch64 compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install armv7 compiler
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Create unsigned test config
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .ci/tauri-test.conf.json

      - name: Cross-build Linux bundles
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_ALLOW_CROSS=1
          if [ "${{ matrix.target }}" = 'aarch64-unknown-linux-gnu' ]; then
            export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig/:${PKG_CONFIG_PATH:-}"
            export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/
          else
            export PKG_CONFIG_PATH="/usr/lib/arm-linux-gnueabihf/pkgconfig/:${PKG_CONFIG_PATH:-}"
            export PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/
          fi
          pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-test.conf.json

      - name: Upload Linux ARM bundles
        uses: actions/upload-artifact@v7
        with:
          name: karing-linux-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  fixed-webview2-builds:
    name: Build fixed WebView2 ${{ matrix.arch }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing-fixed-webview2
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies and prepare sidecars
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild ${{ matrix.target }}

      - name: Download fixed WebView2 runtime
        shell: pwsh
        run: |
          $version = '133.0.3065.92'
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$version.${{ matrix.arch }}.cab"
          Invoke-WebRequest -Uri "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/$cab" -OutFile $cab
          Expand.exe $cab -F:* ./src-tauri
          Remove-Item ./src-tauri/tauri.windows.conf.json
          Rename-Item ./src-tauri/webview2.${{ matrix.arch }}.json tauri.windows.conf.json

      - name: Build fixed WebView2 bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci | Out-Null
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 .ci/tauri-test.conf.json
          pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-test.conf.json

          $files = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe"
          if (-not $files) { throw 'Fixed WebView2 installer not found' }
          foreach ($file in $files) {
            $newName = $file.Name -replace '-setup\.exe$', '_fixed_webview2-setup.exe'
            Rename-Item $file.FullName $newName
          }

      - name: Upload fixed WebView2 bundle
        uses: actions/upload-artifact@v7
        with:
          name: karing-fixed-webview2-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*_fixed_webview2-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-release:
    name: Publish all successful bundles
    needs:
      - prepare-release
      - native-builds
      - linux-arm-builds
      - fixed-webview2-builds
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: karing-*
          path: downloaded-assets
          merge-multiple: true

      - name: Flatten assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find downloaded-assets -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            -exec cp '{}' release-assets/ \;

          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [ "$count" -lt 13 ]; then
            echo "Expected at least 13 installable files, found $count"
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )

          cat > release-assets/BUILD_INFO.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Branch: feature/karing-style-diversion
          Commit: ${GITHUB_SHA}
          Version: ${{ needs.prepare-release.outputs.version }}
          Build type: unsigned all-platform test build
          EOF

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Replace prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            [ -z "$asset" ] || gh release delete-asset "${RELEASE_TAG}" "$asset" --yes
          done

          gh release upload "${RELEASE_TAG}" release-assets/* --clobber

      - name: Show release URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${RELEASE_TAG}" --json url --jq .url
