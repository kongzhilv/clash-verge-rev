name: Karing Diagnostics Once

on:
  push:
    branches:
      - feature/karing-style-diversion

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev

      - name: Capture diagnostics
        shell: bash
        run: |
          mkdir -p .ci
          {
            echo '===== TYPESCRIPT ====='
            pnpm typecheck 2>&1 || true
            echo
            echo '===== CLIPPY ====='
            cargo clippy --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets --all-features -- -D warnings 2>&1 || true
          } > .ci/karing-diagnostics.txt

      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/karing-diagnostics.txt
          git commit -m 'chore: capture karing CI diagnostics'
          git push origin HEAD:feature/karing-style-diversion
