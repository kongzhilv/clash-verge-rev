name: Karing Desktop Release

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/karing-diagnostics-once.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-diagnostics-once.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  NODE_OPTIONS: --max_old_space_size=4096
  RELEASE_TAG: v2.5.3-karing

concurrency:
  group: karing-desktop-release
  cancel-in-progress: true

jobs:
  review:
    name: Review and validate source
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'feature/karing-style-diversion'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          commit=$(git rev-parse HEAD)
          test "$version" = '2.5.3'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Check unused frontend code
        run: pnpm knip:report

      - name: Build frontend
        run: pnpm run web:build

      - name: Run Rust Clippy
        run: cargo clippy --workspace --all-targets --features clippy -- -D warnings

      - name: Audit release scope
        shell: bash
        run: |
          set -euo pipefail
          test ! -e mobile/android/upstream.env
          grep -q 'pub async fn start_proxy()' src-tauri/src/cmd/clash.rs
          grep -q 'pub async fn stop_proxy()' src-tauri/src/cmd/clash.rs
          grep -q 'cmd::start_proxy' src-tauri/src/lib.rs
          grep -q 'cmd::stop_proxy' src-tauri/src/lib.rs
          grep -q "value ? 'start_proxy' : 'stop_proxy'" src/components/home/proxy-tun-card.tsx

  native-builds:
    name: Build ${{ matrix.id }}
    needs: review
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - id: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
          - id: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - id: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
          - id: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing-desktop-native
          key: ${{ matrix.os }}-${{ matrix.target }}
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies and prepare sidecars
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild ${{ matrix.target }}

      - name: Create unsigned bundle config
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .ci/tauri-release.conf.json

      - name: Build desktop bundle
        run: pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-release.conf.json

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: karing-${{ matrix.id }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload macOS image
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: karing-${{ matrix.id }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Linux packages
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: karing-${{ matrix.id }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux-arm-builds:
    name: Build Linux ${{ matrix.arch }}
    needs: review
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: arm64
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf

    runs-on: ubuntu-22.04
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing-desktop-linux-arm
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies and prepare sidecars
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild ${{ matrix.target }}

      - name: Configure Ubuntu multiarch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sources.list <<'EOF'
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF
          if [ -f /etc/apt/sources.list ]; then
            sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          fi
          sudo mv /tmp/sources.list /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1:${{ matrix.arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.arch }} \
            libayatana-appindicator3-dev:${{ matrix.arch }} \
            libssl-dev:${{ matrix.arch }} \
            patchelf:${{ matrix.arch }} \
            librsvg2-dev:${{ matrix.arch }}

      - name: Install aarch64 compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install armv7 compiler
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Create unsigned bundle config
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .ci/tauri-release.conf.json

      - name: Cross-build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_ALLOW_CROSS=1
          if [ "${{ matrix.target }}" = 'aarch64-unknown-linux-gnu' ]; then
            export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig/:${PKG_CONFIG_PATH:-}"
            export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/
          else
            export PKG_CONFIG_PATH="/usr/lib/arm-linux-gnueabihf/pkgconfig/:${PKG_CONFIG_PATH:-}"
            export PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/
          fi
          pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-release.conf.json

      - name: Upload Linux ARM packages
        uses: actions/upload-artifact@v7
        with:
          name: karing-linux-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  fixed-webview2-builds:
    name: Build fixed WebView2 ${{ matrix.arch }}
    needs: review
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    runs-on: windows-latest
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing-desktop-fixed-webview2
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies and prepare sidecars
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild ${{ matrix.target }}

      - name: Download fixed WebView2 runtime
        shell: pwsh
        run: |
          $version = '133.0.3065.92'
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$version.${{ matrix.arch }}.cab"
          Invoke-WebRequest -Uri "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/$cab" -OutFile $cab
          Expand.exe $cab -F:* ./src-tauri
          Remove-Item ./src-tauri/tauri.windows.conf.json
          Rename-Item ./src-tauri/webview2.${{ matrix.arch }}.json tauri.windows.conf.json

      - name: Create unsigned bundle config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci | Out-Null
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 .ci/tauri-release.conf.json

      - name: Build fixed WebView2 installer
        shell: pwsh
        run: |
          pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-release.conf.json
          $files = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe"
          if (-not $files) { throw 'Fixed WebView2 installer not found' }
          foreach ($file in $files) {
            $newName = $file.Name -replace '-setup\.exe$', '_fixed_webview2-setup.exe'
            Rename-Item $file.FullName $newName
          }

      - name: Upload fixed WebView2 installer
        uses: actions/upload-artifact@v7
        with:
          name: karing-fixed-webview2-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*_fixed_webview2-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-release:
    name: Publish formal Latest release
    needs:
      - review
      - native-builds
      - linux-arm-builds
      - fixed-webview2-builds
    runs-on: ubuntu-latest
    steps:
      - name: Download all reviewed build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: karing-*
          path: downloaded-assets
          merge-multiple: true

      - name: Validate and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-assets -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            -exec cp '{}' release-assets/ \;

          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 12 ]; then
            echo "Expected exactly 12 installable files, found $count"
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )

          cat > release-assets/BUILD_INFO.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Branch: feature/karing-style-diversion
          Commit: ${{ needs.review.outputs.commit }}
          Version: ${{ needs.review.outputs.version }}
          Release tag: ${RELEASE_TAG}
          Platforms: Windows x64/ARM64, macOS Intel/Apple Silicon, Linux x64/ARM64/ARMv7
          Signing: unsigned development-fork build; no official Apple notarization or updater signature
          Android: intentionally not included
          EOF

          cat > release-notes.md <<EOF
          # Clash Verge Rev Karing v${{ needs.review.outputs.version }}

          This desktop release contains the Karing-style diversion manager and the reviewed FlClash-style master proxy switch.

          ## Desktop packages
          - Windows x64 and ARM64 installers
          - Windows x64 and ARM64 fixed-WebView2 installers
          - macOS Apple Silicon and Intel disk images
          - Linux x64, ARM64 and ARMv7 DEB/RPM packages

          Android is intentionally not included. These fork builds are not signed with the upstream project's official signing or Apple notarization credentials. Verify downloads with SHA256SUMS.txt.

          Commit: `${{ needs.review.outputs.commit }}`
          EOF

      - name: Create draft, upload, then publish as formal Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes --cleanup-tag
          fi

          gh release create "${RELEASE_TAG}" \
            --target "${{ needs.review.outputs.commit }}" \
            --title "Clash Verge Rev Karing v${{ needs.review.outputs.version }}" \
            --notes-file release-notes.md \
            --draft

          gh release upload "${RELEASE_TAG}" release-assets/*

          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            --silent

          gh release view "${RELEASE_TAG}" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
