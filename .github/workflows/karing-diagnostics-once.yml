name: Karing Windows Bundle Once

on:
  push:
    branches:
      - feature/karing-style-diversion

permissions:
  contents: write

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  windows-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'karing-windows-bundle'
          key: 'x86_64-pc-windows-msvc'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Mihomo sidecars
        run: pnpm run prebuild x86_64-pc-windows-msvc

      - name: Build unsigned Windows test bundle
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force .ci | Out-Null
          pnpm tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}' *>&1 | Tee-Object -FilePath .ci/windows-build.log
          $status = $LASTEXITCODE
          "build_status=$status" | Set-Content -Encoding utf8 .ci/windows-build-summary.txt
          if ($status -eq 0) {
            Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle' -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                $relative = $_.FullName.Replace("$pwd\", '')
                "$relative`t$($_.Length) bytes"
              } | Add-Content -Encoding utf8 .ci/windows-build-summary.txt
          }
          exit $status

      - name: Upload Windows installers
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: clash-verge-karing-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Commit build result
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/windows-build-summary.txt .ci/windows-build.log
          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore: record karing Windows bundle result'
            git push origin HEAD:feature/karing-style-diversion
          }
