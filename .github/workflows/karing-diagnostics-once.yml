name: Karing Windows Bundle Once

on:
  push:
    branches:
      - feature/karing-style-diversion

permissions:
  contents: write

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'karing-windows-bundle'
          key: 'x86_64-pc-windows-msvc'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Mihomo sidecars
        run: pnpm run prebuild x86_64-pc-windows-msvc

      - name: Build unsigned Windows test bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci | Out-Null
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 .ci/tauri-test.conf.json
          pnpm tauri build --target x86_64-pc-windows-msvc --config .ci/tauri-test.conf.json
          $exe = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'NSIS installer not found' }
          Copy-Item $exe.FullName 'Clash.Verge_2.5.3_karing_x64-setup.exe'
          (Get-FileHash 'Clash.Verge_2.5.3_karing_x64-setup.exe' -Algorithm SHA256).Hash.ToLower() | Set-Content 'Clash.Verge_2.5.3_karing_x64-setup.exe.sha256'

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: karing-test-latest
          name: Clash Verge Rev Karing diversion test build
          prerelease: true
          make_latest: false
          body: Unsigned Windows x64 test build from feature/karing-style-diversion.
          files: |
            Clash.Verge_2.5.3_karing_x64-setup.exe
            Clash.Verge_2.5.3_karing_x64-setup.exe.sha256
