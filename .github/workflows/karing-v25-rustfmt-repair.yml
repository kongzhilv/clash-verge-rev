name: Karing v25 rustfmt one-shot repair

on:
  push:
    branches: [feature/karing-style-diversion]
    paths:
      - '.github/workflows/karing-v25-rustfmt-repair.yml'
      - '.github/repair/karing_v25_rustfmt.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.KARING_RELEASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply exact rustfmt tail repair
        run: python3 .github/repair/karing_v25_rustfmt.py
      - name: Verify formatting and scope
        run: |
          cargo fmt --manifest-path ./src-tauri/Cargo.toml --all -- --check
          git diff --check
          git status --short
          git diff -- src-tauri/src/core/windows_hotspot_ics.rs
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style(windows): format karing.25 hotspot ICS tests'
          git push origin HEAD:feature/karing-style-diversion
