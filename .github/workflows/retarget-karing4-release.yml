name: Retarget Karing 4 Audited Release
run-name: Retarget Karing 4 audited release to final application attribution fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/retarget-karing4-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retarget:
    name: Pin and trigger final Karing 4 audit
    runs-on: ubuntu-latest
    env:
      FINAL_CANDIDATE_SHA: 24d7784fd755e1675d23e702f31710fd5dfb5d23
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Retarget audited release and extend source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('.github/workflows/karing4-audited-release.yml')
          text = path.read_text(encoding='utf-8')
          candidate = os.environ['FINAL_CANDIDATE_SHA']

          text, count = re.subn(
              r'CANDIDATE_SHA: [0-9a-f]{40}',
              f'CANDIDATE_SHA: {candidate}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('[fail] CANDIDATE_SHA field was not updated exactly once')

          text = re.sub(
              r'run-name: Build and release v2\.5\.3-karing\.4.*',
              'run-name: Build and release v2.5.3-karing.4 (final attribution audit)',
              text,
              count=1,
          )

          anchor = "              ('bounded attribution cache', 'src/services/process-connections.ts', 'MAX_ATTRIBUTION_ITEMS'),\n"
          additions = """              ('local endpoint attribution', 'src/services/process-connections.ts', \"'local-endpoint'\"),
              ('recent endpoint attribution', 'src/services/process-connections.ts', \"'recent-local-endpoint'\"),
              ('recent endpoint TTL', 'src/services/process-connections.ts', 'RECENT_ENDPOINT_TTL_MS'),
              ('new connection fast sampling', 'src/hooks/use-connection-data.ts', 'PROCESS_CONNECTION_NEW_DELAY_MS'),
              ('new connection retry', 'src/hooks/use-connection-data.ts', 'requestFastProcessConnectionRefresh'),
              ('live technical details', 'src/components/connection/connection-detail.tsx', '技术详情'),
"""
          if 'new connection fast sampling' not in text:
              if anchor not in text:
                  raise SystemExit('[fail] source audit insertion anchor not found')
              text = text.replace(anchor, anchor + additions, 1)

          path.write_text(text, encoding='utf-8')
          print(f'[pass] pinned audited release to {candidate}')
          PY

      - name: Remove one-time retarget workflow
        shell: bash
        run: rm -f .github/workflows/retarget-karing4-release.yml

      - name: Commit and push audited release trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/karing4-audited-release.yml .github/workflows/retarget-karing4-release.yml
          git commit -m 'ci: audit and release final Karing 4 candidate'
          git push origin HEAD:dev
