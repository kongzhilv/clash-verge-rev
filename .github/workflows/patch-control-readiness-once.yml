name: Patch Mihomo control readiness once

on:
  push:
    branches:
      - fix/mihomo-control-readiness
    paths:
      - '.github/temporary/patch_control_readiness.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mihomo-control-readiness
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.95 --profile minimal --component rustfmt
          rustup default 1.95
      - name: Apply targeted patch
        run: python3 .github/temporary/patch_control_readiness.py
      - name: Format and inspect diff
        run: |
          cargo fmt --all
          git diff --check
          git diff -- src-tauri/src/feat/clash.rs src-tauri/src/cmd/clash.rs
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/feat/clash.rs src-tauri/src/cmd/clash.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: wait for Mihomo control API readiness'
          git push origin HEAD:fix/mihomo-control-readiness
