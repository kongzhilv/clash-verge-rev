name: Karing one-shot Rustfmt

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - .github/workflows/karing-rustfmt-once.yml

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Install pinned Rust with rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply canonical Rust formatting
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all

      - name: Commit formatter output only
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/src/core/windows_hotspot_ics_v27.rs
          if git diff --cached --quiet; then
            echo "No rustfmt changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(windows): apply canonical rustfmt to v27 hotspot ICS"
          git push origin HEAD:feature/karing-style-diversion
