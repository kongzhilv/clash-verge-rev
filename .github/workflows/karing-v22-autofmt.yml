name: Karing v22 formatting normalization

on:
  push:
    branches:
      - fix/karing-windows-hotspot-v22
    paths:
      - 'src-tauri/src/core/windows_hotspot_ics.rs'
      - 'src-tauri/Cargo.toml'
      - 'scripts/check-windows-hotspot-v22.mjs'
      - '.github/workflows/karing-windows-hotspot-v22.yml'
      - '.github/workflows/karing-v22-autofmt.yml'

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-v22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize Rust and repository text formats
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
          pnpm exec biome format --write scripts/check-windows-hotspot-v22.mjs .github/workflows/karing-windows-hotspot-v22.yml .github/workflows/karing-v22-autofmt.yml
      - name: Commit normalized formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/core/windows_hotspot_ics.rs scripts/check-windows-hotspot-v22.mjs .github/workflows/karing-windows-hotspot-v22.yml .github/workflows/karing-v22-autofmt.yml
          git commit -m 'style: normalize v22 hotspot changes'
          git push origin HEAD:fix/karing-windows-hotspot-v22