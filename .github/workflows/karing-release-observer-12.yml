name: Karing .12 发行观察器

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-release-observer-12.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: karing-release-observer-12
  cancel-in-progress: true

jobs:
  recover-and-verify:
    name: 发布并核验 v2.5.4-karing.12
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2.5.4-karing.12
      RELEASE_BRANCH: feature/karing-style-diversion
      MAIN_WORKFLOW: karing-diagnostics-once.yml
      SOURCE_SHA: '71a63c6d1c167c119ae267c82a1d82ea78714527'
      RELEASE_TARGET_SHA: '71a63c6d1c167c119ae267c82a1d82ea78714527'
    steps:
      - name: 定位固定源码提交的主发行运行
        id: main
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 90); do
            run_id=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${MAIN_WORKFLOW}/runs" \
              -f branch="${RELEASE_BRANCH}" -f per_page=30 \
              --jq ".workflow_runs[] | select(.head_sha == \"${SOURCE_SHA}\") | .id" | head -n1 || true)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: 等待源码审查与全平台构建完成
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.main.outputs.run_id }}'
          status=''
          for attempt in $(seq 1 300); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            if [ "$status" = 'completed' ]; then
              break
            fi
            sleep 30
          done
          test "$status" = 'completed'

          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")
          failed_jobs=$(jq -r '[.jobs[] | select(.name != "发布正式 GitHub Release") | select(.conclusion != "success" and .conclusion != "skipped") | .name] | join("；")' <<<"$jobs_json")
          if [ -n "$failed_jobs" ]; then
            echo "Non-publish jobs are not green: $failed_jobs" >&2
            exit 1
          fi

          for required_job in \
            '审查并验证源码' \
            '构建 Windows x64' \
            '构建 Windows ARM64' \
            '构建固定 WebView2 x64' \
            '构建固定 WebView2 ARM64' \
            '构建 macOS Apple Silicon' \
            '构建 macOS Intel' \
            '构建 Linux x64' \
            '构建 Linux ARM64' \
            '构建 Linux ARMv7' \
            '汇总并审查发行产物'; do
            count=$(jq --arg name "$required_job" '[.jobs[] | select(.name == $name and .conclusion == "success")] | length' <<<"$jobs_json")
            test "$count" -ge 1
          done

          artifact_count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "karing-release-assets" and .expired == false)] | length')
          test "$artifact_count" -eq 1

      - name: 复核本次模式一致性修复源码
        shell: bash
        run: |
          set -euo pipefail
          fetch_source() {
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/$1?ref=${SOURCE_SHA}"
          }
          fetch_source src-tauri/src/feat/clash.rs > /tmp/feat-clash.rs
          fetch_source src-tauri/src/cmd/clash.rs > /tmp/cmd-clash.rs
          fetch_source src-tauri/src/feat/window.rs > /tmp/window.rs

          grep -Fq 'mode-change-runtime-staged' /tmp/feat-clash.rs
          grep -Fq 'active-mode-readback' /tmp/feat-clash.rs
          grep -Fq 'global-direct-selected' /tmp/feat-clash.rs
          grep -Fq 'get_base_config' /tmp/feat-clash.rs
          grep -Fq 'pre-start-runtime-regeneration-requested' /tmp/cmd-clash.rs
          grep -Fq 'verify_mode_after_start' /tmp/cmd-clash.rs
          grep -Fq 'tun-disable-skipped-core-stopped' /tmp/window.rs

      - name: 下载并复验已审查发行资产
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.main.outputs.run_id }}'
          rm -rf release-assets
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name karing-release-assets \
            --dir release-assets

          test -f release-assets/SHA256SUMS.txt
          test -f release-assets/BUILD_INFO.txt
          test -f release-assets/release-notes.md
          grep -Fqx "Commit: ${SOURCE_SHA}" release-assets/BUILD_INFO.txt

          sed -i -E "s/^Release tag: .*/Release tag: ${RELEASE_TAG}/" release-assets/BUILD_INFO.txt
          sed -i -E "s/v2\.5\.4-karing\.[0-9]+/${RELEASE_TAG}/g" release-assets/release-notes.md
          grep -Fqx "Release tag: ${RELEASE_TAG}" release-assets/BUILD_INFO.txt

          installer_count=$(find release-assets -maxdepth 1 -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \
            \) | wc -l)
          checksum_lines=$(grep -cve '^$' release-assets/SHA256SUMS.txt)
          test "$installer_count" -eq 12
          test "$checksum_lines" -eq 12
          (
            cd release-assets
            sha256sum --check SHA256SUMS.txt
          )

          cat >> release-assets/release-notes.md <<'EOF'

          ## Mode consistency fix

          - 修复 Core 停止时切换 Global/Rule/Direct 后旧 Runtime 未重生成、下次启动仍使用旧 mode 的问题。
          - 模式切换现在对 Mihomo live state、磁盘配置与 App 内存配置执行事务式提交；持久化失败会回滚 live mode。
          - 每次启动前重新生成 Runtime，启动后读取 Mihomo /configs 对照 saved / Runtime / live mode，并对单次偏差执行受控自愈。
          - Global 模式记录 GLOBAL 组当前选择；若实际选择 DIRECT 会写入诊断警告，但不会擅自改写用户选择。
          - Core 已停止时退出流程不再向已消失的 named pipe 发送 TUN disable，避免误导性告警。
          EOF
          printf '\n构建源码：%s\n发行标签：%s\n' "$SOURCE_SHA" "$RELEASE_TAG" >> release-assets/release-notes.md

      - name: 拒绝覆盖历史标签或 Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing overwrite" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; refusing overwrite" >&2
            exit 1
          fi

      - name: 发布正式 Latest Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/*.exe \
            release-assets/*.dmg \
            release-assets/*.deb \
            release-assets/*.rpm \
            release-assets/SHA256SUMS.txt \
            release-assets/BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title 'Clash Verge Rev Karing v2.5.4 · Mode Consistency + Network Diagnostics' \
            --notes-file release-assets/release-notes.md \
            --latest

      - name: 独立核验公开 Release、标签与资产
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          asset_count=$(jq '.assets | length' <<<"$release_json")
          target=$(jq -r '.target_commitish' <<<"$release_json")
          draft=$(jq -r '.draft' <<<"$release_json")
          prerelease=$(jq -r '.prerelease' <<<"$release_json")
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')

          test "$asset_count" -eq 14
          test "$target" = "$RELEASE_TARGET_SHA"
          test "$tag_sha" = "$RELEASE_TARGET_SHA"
          test "$draft" = false
          test "$prerelease" = false
          test "$latest_tag" = "$RELEASE_TAG"

          rm -rf release-audit
          mkdir -p release-audit
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --pattern BUILD_INFO.txt --dir release-audit
          grep -Fqx "Commit: ${SOURCE_SHA}" release-audit/BUILD_INFO.txt
          grep -Fqx "Release tag: ${RELEASE_TAG}" release-audit/BUILD_INFO.txt
          checksum_lines=$(grep -cve '^$' release-audit/SHA256SUMS.txt)
          test "$checksum_lines" -eq 12
