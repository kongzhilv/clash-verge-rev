name: Karing Format Once

on:
  push:
    branches:
      - feature/karing-style-diversion

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format stable-key changes
        run: >-
          pnpm exec biome format --write
          src/components/rule/diversion-manager/model.ts
          src/components/rule/diversion-manager/group-editor.tsx
          src/components/rule/diversion-manager/manager.tsx
          src/components/rule/diversion-builtins.tsx
          src/components/rule/diversion-detector.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet -- src; then
            echo 'No formatting changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'style: format stable diversion keys'
          git push origin HEAD:feature/karing-style-diversion
