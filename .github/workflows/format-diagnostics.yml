name: 格式诊断
run-name: 生成 Biome 格式化补丁

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-diagnostics:
    name: 生成格式化文件和补丁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 使用仓库 Biome 生成格式化结果
        shell: bash
        run: |
          set -euo pipefail
          pnpm format
          mkdir -p format-diagnostics/scripts
          cp scripts/build-matching-service.mjs format-diagnostics/scripts/
          cp package.json format-diagnostics/
          git diff --binary > format-diagnostics/formatting.patch
          git status --short > format-diagnostics/status.txt

      - name: 上传格式诊断结果
        uses: actions/upload-artifact@v7
        with:
          name: 格式诊断结果
          path: format-diagnostics
          if-no-files-found: error
          retention-days: 1
