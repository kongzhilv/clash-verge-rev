name: Karing Windows Hotspot v22 retired compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Delegate retired v22 gate to v24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - run: node scripts/check-windows-hotspot-v22.mjs
