name: Karing 4 Audited Release
run-name: Build and release v2.5.3-karing.4 (7ec661e final)

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/karing4-audited-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  NODE_OPTIONS: --max_old_space_size=4096
  RELEASE_TAG: v2.5.3-karing.4
  CANDIDATE_SHA: 7ec661ec241ea7571058f82463b0cc644596b10d

concurrency:
  group: karing4-final-audited-release
  cancel-in-progress: false

jobs:
  review:
    name: 审查固定候选源码
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 检出固定候选
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 验证候选与版本
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          version=$(jq -r .version package.json)
          test "$commit" = "$CANDIDATE_SHA"
          test "$version" = '2.5.3'
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 运行前端质量门禁
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm knip:report
          pnpm run web:build

      - name: 运行 Rust Clippy
        run: cargo clippy --workspace --all-targets --features clippy -- -D warnings

      - name: 审查应用分流与实时归因
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checks = [
              ('live connection details', 'src/components/connection/connection-detail.tsx', 'useConnectionData({ enabled: open })'),
              ('technical details disclosure', 'src/components/connection/connection-detail.tsx', '技术详情'),
              ('application attribution subscription', 'src/components/routing/connection-project-card.tsx', 'useConnectionProcessAttribution'),
              ('Windows TUN label', 'src/components/routing/connection-project-card.tsx', 'Windows TUN 端点识别'),
              ('local endpoint attribution', 'src/services/process-connections.ts', "'local-endpoint'"),
              ('recent endpoint attribution', 'src/services/process-connections.ts', "'recent-local-endpoint'"),
              ('recent endpoint TTL', 'src/services/process-connections.ts', 'RECENT_ENDPOINT_TTL_MS'),
              ('bounded attribution store', 'src/services/process-connections.ts', 'MAX_ATTRIBUTION_ITEMS'),
              ('new connection fast sampling', 'src/hooks/use-connection-data.ts', 'PROCESS_CONNECTION_NEW_DELAY_MS'),
              ('new connection retry', 'src/hooks/use-connection-data.ts', 'requestFastProcessConnectionRefresh'),
              ('active-only native enrichment', 'src/hooks/use-connection-data.ts', 'activeConnections = enrichConnectionsWithProcesses'),
              ('safe finally control flow', 'src/hooks/use-connection-data.ts', 'if (connectionListeners.size > 0) {'),
              ('Fake-IP guard', 'src/components/connection/connection-rule-assistant.tsx', 'isMihomoFakeIp'),
              ('connection filters', 'src/components/connection/connection-filter-menu.tsx', 'outbound: string'),
              ('common routing presets', 'src/components/rule/diversion-manager/settings-panel.tsx', '常用分流'),
              ('overflow component', 'src/components/base/overflow-reveal.tsx', "overflowX: 'auto'"),
              ('resize measurement', 'src/components/base/overflow-reveal.tsx', 'ResizeObserver'),
              ('shared scroll styles', 'src/components/base/scroll-area.ts', 'softScrollAreaSx'),
              ('TCP owner API', 'src-tauri/src/cmd/process_connections.rs', 'GetExtendedTcpTable'),
              ('UDP owner API', 'src-tauri/src/cmd/process_connections.rs', 'GetExtendedUdpTable'),
              ('executable path API', 'src-tauri/src/cmd/process_connections.rs', 'QueryFullProcessImageNameW'),
              ('native dispatch', 'src-tauri/src/cmd/network.rs', 'process_connections::get_process_connections()'),
              ('registered command', 'src-tauri/src/lib.rs', 'cmd::get_network_interfaces_info'),
          ]

          for label, path, needle in checks:
              text = Path(path).read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'[失败] {label}: {needle!r} missing from {path}')
              print(f'[通过] {label}')

          roots = [
              Path('src/components/connection'),
              Path('src/components/routing'),
              Path('src/components/rule/diversion-manager'),
              Path('src/pages'),
          ]
          forbidden = [
              'Mihomo 进程元数据',
              '未返回程序信息',
              '程序项目',
              '项目档案',
              '程序档案',
          ]
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for value in forbidden:
                      if value in text:
                          raise SystemExit(f'[失败] obsolete UI text {value!r} in {path}')
          print('[通过] 应用分流、实时详情、TUN/短连接归因和产品术语审查完成')
          PY

  build:
    name: 构建 ${{ matrix.name }}
    needs: review
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            kind: desktop
          - id: windows-arm64
            name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            kind: desktop
          - id: windows-fixed-x64
            name: Windows fixed WebView2 x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            kind: fixed
            webview_arch: x64
          - id: windows-fixed-arm64
            name: Windows fixed WebView2 ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            kind: fixed
            webview_arch: arm64
          - id: macos-arm64
            name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            kind: desktop
          - id: macos-x64
            name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            kind: desktop
          - id: linux-x64
            name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            kind: desktop
          - id: linux-arm64
            name: Linux ARM64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux
            kind: cross
            deb_arch: arm64
          - id: linux-armv7
            name: Linux ARMv7
            os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            platform: linux
            kind: cross
            deb_arch: armhf
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出固定候选
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: 安装 Rust 目标
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: 恢复 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing4-7ec661e-v1
          key: ${{ matrix.os }}-${{ matrix.target }}-${{ matrix.kind }}
          workspaces: |
            . -> target
            .ci/service-ipc-source-${{ matrix.target }} -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: 安装 Linux x64 依赖
        if: matrix.platform == 'linux' && matrix.kind == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: 配置 Linux ARM 多架构源
        if: matrix.kind == 'cross'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sources.list <<'EOF'
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF
          if [ -f /etc/apt/sources.list ]; then
            sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          fi
          sudo mv /tmp/sources.list /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.deb_arch }}
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1:${{ matrix.deb_arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.deb_arch }} \
            libayatana-appindicator3-dev:${{ matrix.deb_arch }} \
            libssl-dev:${{ matrix.deb_arch }} \
            librsvg2-dev:${{ matrix.deb_arch }} \
            patchelf

      - name: 安装 Linux ARM 交叉编译器
        if: matrix.kind == 'cross'
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.target }}' = 'aarch64-unknown-linux-gnu' ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
            echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
            echo 'CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/' >> "$GITHUB_ENV"
          else
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"
            echo 'CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"
            echo 'CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig/' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/' >> "$GITHUB_ENV"
          fi
          echo 'PKG_CONFIG_ALLOW_CROSS=1' >> "$GITHUB_ENV"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 构建匹配服务
        run: node scripts/build-matching-service.mjs ${{ matrix.target }}

      - name: 准备 Mihomo 与运行资源
        run: pnpm run prebuild ${{ matrix.target }}

      - name: 下载固定 WebView2 运行库
        if: matrix.kind == 'fixed'
        shell: pwsh
        run: |
          $version = '133.0.3065.92'
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$version.${{ matrix.webview_arch }}.cab"
          Invoke-WebRequest -Uri "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/$cab" -OutFile $cab
          Expand.exe $cab -F:* ./src-tauri
          Remove-Item ./src-tauri/tauri.windows.conf.json
          Rename-Item ./src-tauri/webview2.${{ matrix.webview_arch }}.json tauri.windows.conf.json

      - name: 生成无更新签名配置
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .ci/tauri-release.conf.json

      - name: 构建桌面安装包
        run: pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-release.conf.json

      - name: 重命名固定 WebView2 安装包
        if: matrix.kind == 'fixed'
        shell: pwsh
        run: |
          $files = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe"
          if (-not $files) { throw 'No fixed WebView2 installer was produced' }
          foreach ($file in $files) {
            $newName = $file.Name -replace '-setup\.exe$', '_fixed_webview2-setup.exe'
            Rename-Item $file.FullName $newName
          }

      - name: 收集 Windows 安装包
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bundle/nsis/*.exe" dist/

      - name: 收集 macOS 镜像
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/

      - name: 收集 Linux 安装包
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb dist/
          cp target/${{ matrix.target }}/release/bundle/rpm/*.rpm dist/

      - name: 上传平台安装包
        uses: actions/upload-artifact@v7
        with:
          name: karing4-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package-release:
    name: 汇总并验证 12 个安装文件
    needs:
      - review
      - build
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v8
        with:
          pattern: karing4-*
          path: downloaded-assets
          merge-multiple: true

      - name: 校验并整理发行资产
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-assets -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            -exec cp '{}' release-assets/ \;

          installer_count=$(find release-assets -maxdepth 1 -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            | wc -l)
          if [ "$installer_count" -ne 12 ]; then
            echo "[失败] 应有 12 个安装文件，实际为 $installer_count 个"
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          (
            cd release-assets
            sha256sum *.exe *.dmg *.deb *.rpm > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

          cat > release-assets/BUILD_INFO.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${{ needs.review.outputs.commit }}
          Version: ${{ needs.review.outputs.version }}
          Release tag: ${RELEASE_TAG}
          Platforms: Windows x64/ARM64, macOS Intel/Apple Silicon, Linux x64/ARM64/ARMv7
          Installers: 12
          Signing: unsigned fork build; no upstream Apple notarization or updater signature
          Android: intentionally not included
          EOF

          cat > release-assets/release-notes.md <<EOF
          # Clash Verge Rev Karing v2.5.3-karing.4

          本版本继续收敛为现代应用分流工作流，并修复 Windows TUN/Fake-IP 与短连接应用归因。

          ## 应用归因
          - 新连接出现后约 120ms 采样 Windows TCP/UDP 所属进程，并追加一次短延迟重试
          - 优先按完整端点匹配，其次按 TUN/Fake-IP 本地端点匹配
          - 保存最近 20 秒的无冲突端点记录，避免短连接在轮询前结束后无法识别
          - 只有端点信息不足时才使用唯一源端口兜底；冲突时停止猜测
          - 历史已关闭连接不再被后续端口复用错误覆盖
          - 已打开的连接详情持续订阅最新连接与归因结果

          ## 界面与操作
          - 主视图只保留应用、应用规则、预期出口和当前出口
          - PID、程序路径、原始命中规则、完整出口链与归因原因移入可展开“技术详情”
          - 分流中心按应用分流、通用规则和全局设置组织
          - 支持按应用、命中规则和实际出口筛选连接
          - 保留常用分流预设，隐藏内部托管规则组实现细节
          - 修复小窗口、高 DPI 和长文本造成的裁切与挤压

          ## 安装包
          - Windows x64 与 ARM64
          - Windows x64 与 ARM64 固定 WebView2 版本
          - macOS Apple Silicon 与 Intel
          - Linux x64、ARM64 与 ARMv7 的 DEB/RPM

          本分支安装包没有上游官方签名或 Apple 公证，请使用 SHA256SUMS.txt 校验下载文件。

          Commit: ${{ needs.review.outputs.commit }}
          EOF

          echo '[通过] 12 个安装文件与 SHA256 已验证'
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 上传已审查的完整发行资产
        uses: actions/upload-artifact@v7
        with:
          name: karing4-release-assets
          path: release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    name: 发布并验证 v2.5.3-karing.4
    needs:
      - review
      - package-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载已审查资产
        uses: actions/download-artifact@v8
        with:
          name: karing4-release-assets
          path: release-assets

      - name: 发布并复核 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_commit='${{ needs.review.outputs.commit }}'

          installer_count=$(find release-assets -maxdepth 1 -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            | wc -l)
          test "$installer_count" -eq 12
          test -f release-assets/SHA256SUMS.txt
          test -f release-assets/BUILD_INFO.txt
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" \
            release-assets/*.exe \
            release-assets/*.dmg \
            release-assets/*.deb \
            release-assets/*.rpm \
            release-assets/SHA256SUMS.txt \
            release-assets/BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$expected_commit" \
            --title 'Clash Verge Rev Karing v2.5.3-karing.4' \
            --notes-file release-assets/release-notes.md \
            --latest

          release_json=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isDraft,isPrerelease,targetCommitish,assets)
          asset_count=$(jq '.assets | length' <<< "$release_json")
          installer_assets=$(jq '[.assets[].name | select(test("\\.(exe|dmg|deb|rpm)$"; "i"))] | length' <<< "$release_json")
          metadata_assets=$(jq '[.assets[].name | select(. == "SHA256SUMS.txt" or . == "BUILD_INFO.txt")] | length' <<< "$release_json")
          test "$asset_count" -eq 14
          test "$installer_assets" -eq 12
          test "$metadata_assets" -eq 2
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$expected_commit" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and .targetCommitish == $commit' \
            <<< "$release_json" >/dev/null

          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_sha" = "$expected_commit"
          echo '[通过] Release 标签、最终提交与 14 个资产完全一致'
          jq '{url, tagName, targetCommitish, assets: [.assets[].name]}' <<< "$release_json"

  report:
    name: 回报最终审查与发行状态
    if: always()
    needs:
      - review
      - build
      - package-release
      - publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: 更新 PR 状态
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ needs.review.result }}
          BUILD: ${{ needs.build.result }}
          PACKAGE: ${{ needs.package-release.result }}
          RELEASE: ${{ needs.publish-release.result }}
        shell: bash
        run: |
          set -euo pipefail
          status='❌ 发行未完成'
          if [ "$REVIEW" = success ] && \
             [ "$BUILD" = success ] && \
             [ "$PACKAGE" = success ] && \
             [ "$RELEASE" = success ]; then
            status='✅ v2.5.3-karing.4 正式发行成功'
          fi

          cat > /tmp/release-status.md <<EOF
          <!-- karing4-7ec661e-release-status -->
          ## Karing 4 最终审查与发行状态

          ${status}

          - 候选提交：${CANDIDATE_SHA}
          - Action：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 源码审查：${REVIEW}
          - 九个平台任务 / 12 个安装文件：${BUILD}
          - 汇总与 SHA256：${PACKAGE}
          - Release 与 14 资产验证：${RELEASE}
          - Release：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}
          EOF
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/release-status.md
