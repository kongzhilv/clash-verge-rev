name: Karing release workflow repair

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-release-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    name: Repair Karing release gate safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Patch, review, and push release workflow
        env:
          KARING_PAT: ${{ secrets.KARING_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KARING_PAT:-}"

          python3 tools/karing-release-repair.py
          git diff --check
          git diff -- .github/workflows/karing-diagnostics-once.yml

          rm -f .github/workflows/karing-release-repair.yml tools/karing-release-repair.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(release): harden Karing ARM64 gate and release auth'
          git remote set-url origin "https://x-access-token:${KARING_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feature/karing-style-diversion
