name: Karing Windows Hotspot v28 repair once

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-windows-hotspot-v28-repair.yml'

permissions:
  contents: write

concurrency:
  group: karing-windows-hotspot-v28-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Extract and apply staged generic repair
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/karing-windows-hotspot-v22.yml').read_text(encoding='utf-8')
          start = "python - <<'PY'\n"
          end = "\n          PY\n"
          if workflow.count(start) != 1:
              raise SystemExit('staged repair python start marker mismatch')
          body = workflow.split(start, 1)[1]
          if body.count(end) != 1:
              raise SystemExit('staged repair python end marker mismatch')
          script = textwrap.dedent(body.split(end, 1)[0])
          Path('hotspot_v28_repair.py').write_text(script, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 extract_repair.py
          python extract_repair.py
          python hotspot_v28_repair.py

      - name: Canonical format and Windows regression tests
        shell: pwsh
        run: |
          rustup component add rustfmt
          cargo fmt --all
          cargo test --manifest-path src-tauri/Cargo.toml windows_network --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml windows_hotspot --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit repaired sources and retire one-shot workflows
        shell: pwsh
        run: |
          git show HEAD^^:.github/workflows/karing-windows-hotspot-v22.yml | Set-Content -Encoding utf8 .github/workflows/karing-windows-hotspot-v22.yml
          Remove-Item .github/workflows/karing-windows-hotspot-v28-repair.yml
          Remove-Item hotspot_v28_repair.py,extract_repair.py -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/core/windows_network_diagnostics.rs src-tauri/src/core/windows_hotspot_ics_v27.rs src-tauri/src/utils/windows_network.rs .github/workflows/karing-windows-hotspot-v22.yml .github/workflows/karing-windows-hotspot-v28-repair.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix(windows): stabilize mobile hotspot TUN lifecycle'
          git push origin HEAD:feature/karing-style-diversion
