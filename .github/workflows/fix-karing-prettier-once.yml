name: Fix Karing Prettier Once

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/fix-karing-prettier-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed frontend files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            src/components/home/proxy-tun-card.tsx \
            src/components/rule/diversion-builtins.tsx \
            src/components/rule/diversion-detector.tsx \
            src/components/rule/diversion-manager/group-editor.tsx \
            src/components/rule/diversion-manager/index.tsx \
            src/components/rule/diversion-manager/manager.tsx \
            src/components/rule/diversion-manager/matcher-editor.tsx \
            src/components/rule/diversion-manager/model.ts \
            src/components/rule/diversion-manager/serializer.ts \
            src/components/rule/diversion-manager/settings-panel.tsx \
            src/components/rule/provider-button.tsx \
            src/components/rule/rule-item.tsx \
            src/hooks/use-system-state.ts \
            src/pages/rules.tsx

      - name: Commit formatting and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-karing-prettier-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/fix-karing-prettier-once.yml
          if git diff --cached --quiet; then
            echo 'No formatting changes were needed.'
            exit 0
          fi
          git commit -m 'style: format Karing frontend changes'
          git push origin HEAD:feature/karing-style-diversion
