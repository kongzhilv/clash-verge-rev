name: Karing CI Auto Fix

on:
  push:
    branches:
      - feature/karing-style-diversion

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust changes
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml

      - name: Commit Rust formatting
        run: |
          if git diff --quiet -- src-tauri; then
            echo 'No Rust formatting changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri
          git commit -m 'style: format Karing diversion Rust code'
          git push origin HEAD:feature/karing-style-diversion
