name: Karing CI Auto Fix

on:
  push:
    branches:
      - feature/karing-style-diversion

permissions:
  contents: write

jobs:
  fix-rust-logic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Fix diversion source logic
        shell: python
        run: |
          from pathlib import Path

          path = Path('src-tauri/src/enhance/field/diversion.rs')
          text = path.read_text(encoding='utf-8')

          old = '''    let uses_auto = custom_rules.iter().any(|rule| rule_uses_policy(rule, &auto_group))
                  || fallback_policy == auto_group
                  || uses_current;'''
          new = '''    let uses_auto = custom_rules.iter().any(|rule| rule_uses_policy(rule, &auto_group))
                  || fallback_policy == auto_group;'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''        "GEOIP" | "IP-CIDR" | "IP-CIDR6" | "IP-SUFFIX" | "IP-ASN" | "RULE-SET"'''
          new = '''        "GEOIP" | "IP-CIDR" | "IP-CIDR6" | "IP-SUFFIX" | "IP-ASN"'''
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No logic fixes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/enhance/field/diversion.rs
          git commit -m 'fix: tighten diversion managed group generation'
          git push origin HEAD:feature/karing-style-diversion
