name: Karing CI Auto Fix

on:
  push:
    branches:
      - feature/karing-style-diversion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile

      - name: Fix diversion source logic
        shell: python
        run: |
          from pathlib import Path

          path = Path('src-tauri/src/enhance/field/diversion.rs')
          text = path.read_text(encoding='utf-8')

          old = '''    let uses_auto = custom_rules.iter().any(|rule| rule_uses_policy(rule, &auto_group))
                  || fallback_policy == auto_group
                  || uses_current;'''
          new = '''    let uses_auto = custom_rules.iter().any(|rule| rule_uses_policy(rule, &auto_group))
                  || fallback_policy == auto_group;'''
          if old not in text:
              raise SystemExit('uses_auto block not found')
          text = text.replace(old, new, 1)

          old = '''        "GEOIP" | "IP-CIDR" | "IP-CIDR6" | "IP-SUFFIX" | "IP-ASN" | "RULE-SET"'''
          new = '''        "GEOIP" | "IP-CIDR" | "IP-CIDR6" | "IP-SUFFIX" | "IP-ASN"'''
          if old not in text:
              raise SystemExit('default_no_resolve block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Format frontend changes
        run: >-
          pnpm exec biome format --write
          src/components/rule/diversion-builtins.tsx
          src/components/rule/diversion-detector.tsx
          src/components/rule/diversion-manager/group-editor.tsx
          src/components/rule/diversion-manager/index.tsx
          src/components/rule/diversion-manager/manager.tsx
          src/components/rule/diversion-manager/matcher-editor.tsx
          src/components/rule/diversion-manager/model.ts
          src/components/rule/diversion-manager/serializer.ts
          src/components/rule/diversion-manager/settings-panel.tsx
          src/pages/rules.tsx

      - name: Format Rust changes
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml

      - name: Remove one-time workflow
        run: rm .github/workflows/karing-ci-fix.yml

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No fixes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: format diversion implementation and tighten managed groups'
          git push origin HEAD:feature/karing-style-diversion
