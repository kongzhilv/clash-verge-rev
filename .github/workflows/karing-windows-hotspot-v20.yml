name: Karing Windows 热点 v20 门禁
run-name: Karing Windows Mobile Hotspot v20 安全回归

on:
  pull_request:
    branches:
      - feature/karing-style-diversion
    paths:
      - 'src-tauri/src/core/windows_hotspot_ics.rs'
      - 'src-tauri/src/core/windows_deep_network_diagnostics.rs'
      - 'src-tauri/src/core/mod.rs'
      - 'src-tauri/src/core/manager/mod.rs'
      - 'src-tauri/src/feat/window.rs'
      - 'src-tauri/Cargo.toml'
      - 'scripts/check-windows-hotspot-v20.mjs'
      - '.github/workflows/karing-windows-hotspot-v20.yml'
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - 'src-tauri/src/core/windows_hotspot_ics.rs'
      - 'src-tauri/src/core/windows_deep_network_diagnostics.rs'
      - 'src-tauri/src/core/mod.rs'
      - 'src-tauri/src/core/manager/mod.rs'
      - 'src-tauri/src/feat/window.rs'
      - 'src-tauri/Cargo.toml'
      - 'scripts/check-windows-hotspot-v20.mjs'
      - '.github/workflows/karing-windows-hotspot-v20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: 验证原生 ICS、回滚与深度日志约束
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: 运行 Windows Hotspot v20 静态安全门禁
        run: node scripts/check-windows-hotspot-v20.mjs
