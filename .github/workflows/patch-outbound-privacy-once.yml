name: Patch outbound privacy once

on:
  push:
    branches:
      - fix/outbound-failure-diagnostics-ci
    paths:
      - '.github/workflows/patch-outbound-privacy-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/outbound-failure-diagnostics-ci
          fetch-depth: 0
      - name: Apply privacy patch
        run: python3 .ci/patch-outbound-privacy.py
      - name: Format and verify diff
        run: |
          rustup component add rustfmt
          cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
          git diff --check
      - name: Commit product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/core/outbound_diagnostics.rs
          git commit -m 'fix(diagnostics): redact outbound URL query samples'
          git push origin HEAD:fix/outbound-failure-diagnostics-ci
