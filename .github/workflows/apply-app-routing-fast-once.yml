name: Fast apply application routing patch

on:
  push:
    branches: [dev]
    paths: [.github/workflows/apply-app-routing-fast-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch and push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def get(path): return Path(path).read_text(encoding='utf-8')
          def put(path, text): Path(path).write_text(text, encoding='utf-8')

          path = 'src/hooks/use-connection-data.ts'
          text = get(path)
          if 'getProcessAttributionSnapshot' not in text:
              old = "import {\n  enrichConnectionsWithProcesses,\n  getSystemProcessConnections,\n  type ProcessConnectionSnapshot,\n} from '@/services/process-connections'\n"
              new = "import {\n  enrichConnectionsWithProcesses,\n  getProcessAttributionSnapshot,\n  getSystemProcessConnections,\n  subscribeProcessAttribution,\n  type ProcessConnectionSnapshot,\n} from '@/services/process-connections'\n"
              if old not in text: raise SystemExit('hook import not found')
              text = text.replace(old, new, 1)
          if 'export const useConnectionProcessAttribution' not in text:
              text = text.rstrip() + "\n\nexport const useConnectionProcessAttribution = (\n  connectionId?: string | null,\n) => {\n  const snapshot = useSyncExternalStore(\n    subscribeProcessAttribution,\n    getProcessAttributionSnapshot,\n    getProcessAttributionSnapshot,\n  )\n  return connectionId ? snapshot.items.get(connectionId) : undefined\n}\n"
          put(path, text)

          paths = [
            'src/components/rule/diversion-manager/manager.tsx',
            'src/components/rule/diversion-manager/project-panel.tsx',
            'src/components/rule/diversion-manager/detected-programs-panel.tsx',
            'src/components/rule/diversion-manager/model.ts',
            'src/components/routing/routing-relations-panel.tsx',
            'src/components/routing/connection-project.ts',
            'src/components/connection/connection-row-item.tsx',
            'src/components/connection/connection-rule-assistant.tsx',
            'src/pages/connections.tsx',
          ]
          phrases = [
            ('程序与项目', '应用分流'), ('程序或项目档案', '应用规则'),
            ('程序/项目档案', '应用规则'), ('程序或项目', '应用规则'),
            ('程序/项目', '应用规则'), ('程序项目', '应用规则'),
            ('项目档案', '应用规则'), ('程序档案', '应用规则'),
            ('程序发现', '联网应用'),
            ('Windows 当前联网程序，可直接加入分流', '识别当前联网应用，并为其设置出口策略'),
            ('项目规则', '应用规则'), ('项目分流', '应用分流'),
            ('程序分流', '应用分流'), ('项目连接', '规则连接'),
            ('添加档案', '创建应用规则'), ('保存档案', '保存应用规则'),
            ('编辑档案', '编辑应用规则'),
          ]
          clean = [
            ('应用或应用规则', '应用规则'), ('应用/应用规则', '应用规则'),
            ('应用规则档案', '应用规则'), ('应用规则应用规则', '应用规则'),
            ('应用规则规则', '应用规则'), ('应用规则分流', '应用分流'),
            ('应用规则连接', '规则连接'), ('连接应用规则', '应用规则'),
            ('应用发现', '联网应用'),
          ]
          for path in paths:
              text = get(path)
              if path.endswith('/model.ts'):
                  text = text.replace("`${project.kind === 'program' ? '程序' : '项目'} · ${project.name}`", "`应用 · ${project.name}`")
              for a, b in phrases: text = text.replace(a, b)
              text = text.replace('程序', '应用').replace('项目', '应用规则')
              for a, b in clean: text = text.replace(a, b)
              put(path, text)

          path = 'src/components/rule/diversion-manager/project-panel.tsx'
          text = get(path).replace('  WorkspacesRounded,\n', '').replace('<WorkspacesRounded fontSize="small" />', '<AppsRounded fontSize="small" />')
          text = re.sub(r"\{project\.kind === 'program' \? \(\s*<AppsRounded fontSize=\"small\" />\s*\) : \(\s*<AppsRounded fontSize=\"small\" />\s*\)\}", '<AppsRounded fontSize="small" />', text)
          text = text.replace('一条应用规则对应一组识别条件和一个出口。', '按应用、域名、IP 或端口识别流量，并指定出口策略。')
          text = text.replace('从上方选择应用，或新建一个应用规则。', '从上方选择联网应用，或新建一条应用规则。')
          put(path, text)

          path = 'src/components/connection/connection-rule-assistant.tsx'
          text = get(path).replace('  WorkspacesRounded,\n', '').replace('<WorkspacesRounded />', '<AppsRounded />')
          text = text.replace('应用文件名', '应用名称').replace('完整应用路径', '应用完整路径')
          text = text.replace('由连接详情创建，可继续补充同一应用规则使用的其他域名、IP 和端口。', '由连接详情创建，可继续补充此应用使用的域名、IP 和端口。')
          put(path, text)

          path = 'src/components/rule/diversion-manager/action-picker.tsx'
          put(path, get(path).replace('对应 Karing 服务器选择页中的测速组和自定义组。', '选择现有代理组，或手动填写一个出口名称。'))

          for path in ['README.md', 'THIRD_PARTY_NOTICES.md']:
              text = get(path)
              for a, b in [
                ('程序/项目档案', '应用规则'), ('程序与项目', '应用分流'),
                ('程序项目', '应用规则'), ('程序或项目', '应用规则'),
                ('项目档案', '应用规则'), ('程序档案', '应用规则'),
                ('保存档案', '保存应用规则'), ('添加档案', '创建应用规则'),
                ('程序名称', '应用名称'), ('程序完整路径', '应用完整路径'),
                ('程序路径', '应用路径'), ('程序名', '应用名称'),
                ('程序发现', '联网应用'), ('项目卡片', '应用规则卡片'),
                ('项目指定代理组', '应用规则指定出口策略'),
                ('项目关联', '应用规则关联'), ('对应项目', '对应应用规则'),
                ('点击项目', '点击应用规则'),
              ]: text = text.replace(a, b)
              text = text.replace('程序', '应用')
              put(path, text)

          for path in paths + ['src/components/connection/connection-detail.tsx', 'src/components/routing/connection-project-card.tsx', 'src/components/rule/diversion-manager/project-editor-dialog.tsx']:
              text = get(path)
              for bad in ['程序项目', '程序与项目', '程序或项目', '程序/项目', '项目档案', '程序档案', '添加档案', '保存档案', '程序发现']:
                  if bad in text: raise SystemExit(f'{bad} remains in {path}')

          print('patch complete')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src README.md THIRD_PARTY_NOTICES.md
          git diff --cached --check
          git commit -m "refactor: mature application routing and live attribution"
          git push origin HEAD:feature/karing-style-diversion

      - name: Cleanup workflows
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout -B dev origin/dev
          rm -f .github/workflows/apply-app-routing-fast-once.yml
          rm -f .github/workflows/apply-application-routing-maturity-once.yml
          rm -f .github/workflows/apply-application-routing-maturity-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          git commit -m "chore: remove application routing patch workflows"
          git push origin dev
