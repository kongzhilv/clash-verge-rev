name: Karing v27 forwarding-stable gate repair once

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-v27-forwarding-gate-repair-once.yml'

permissions:
  contents: write

concurrency:
  group: karing-v27-forwarding-gate-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Align forwarding-stable release contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = '.github/workflows/karing-diagnostics-once.yml'
          hotspot = '.github/workflows/karing-windows-hotspot-v26.yml'
          observer = '.github/workflows/karing-release-observer.yml'

          replace_once(
              main,
              "          check_contains src-tauri/src/core/windows_network_diagnostics.rs 'physical-forwarding-mode-changed' '物理 ForwardingEnabled 变化继续触发受控 Runtime 重生成'\n",
              "          check_not_contains src-tauri/src/core/windows_network_diagnostics.rs 'physical-forwarding-mode-changed' 'Forwarding-only 变化不再伪装成物理上游切换'\n"
              "          check_contains src-tauri/src/core/windows_network_diagnostics.rs 'forwarding-change-observed-without-core-refresh' 'Forwarding-only 变化只记录诊断且不重载核心'\n"
              "          check_contains src-tauri/src/core/windows_network_diagnostics.rs 'physical-identity-change-only' 'Runtime 重生成仅允许真实物理上游身份变化触发'\n",
          )

          replace_once(
              main,
              "          Windows TUN route-mode refresh: stable physical ForwardingEnabled changes trigger runtime regeneration without hotspot Start/Stop\n",
              "          Windows TUN route identity: stable physical ForwardingEnabled changes are observed without runtime regeneration; only physical upstream identity changes refresh runtime\n",
          )

          replace_once(
              main,
              "          - **真实 Windows CI。** `.27` 在 Windows x64 与 ARM64 上分别执行网络路径 `cargo check`，并运行 v27 ICS lease、Fake-IP-only forwarding、自定义 Fake-IP range、ForwardingEnabled 身份变化和显式 interface 优先级回归。\n",
              "          - **Forwarding 生命周期反馈环修复。** Windows Mobile Hotspot 切换物理 WLAN `ForwardingEnabled` 时只更新拓扑诊断；只要接口、源地址、网关等物理上游身份未变化，就不再重载 Mihomo/TUN。\n"
              "          - **真实 Windows CI。** `.27` 在 Windows x64 与 ARM64 上分别执行网络路径 `cargo check`，并运行 v27 ICS lease、Fake-IP-only forwarding、自定义 Fake-IP range、`ForwardingEnabled` 不改变 Runtime identity/稳定路由签名和显式 interface 优先级回归。\n",
          )

          old_test = (
              "      - name: Prove physical ForwardingEnabled changes Runtime identity\n"
              "        working-directory: src-tauri\n"
              "        run: cargo test --target x86_64-pc-windows-msvc --lib windows_network_forwarding_change_changes_runtime_identity --all-features -- --nocapture\n"
          )
          new_test = (
              "      - name: Prove physical ForwardingEnabled does not change Runtime identity\n"
              "        working-directory: src-tauri\n"
              "        run: cargo test --target x86_64-pc-windows-msvc --lib windows_network_forwarding_change_does_not_change_runtime_identity --all-features -- --nocapture\n"
              "      - name: Prove physical ForwardingEnabled does not change stable route signature\n"
              "        working-directory: src-tauri\n"
              "        run: cargo test --target x86_64-pc-windows-msvc --lib windows_network_forwarding_change_does_not_change_stable_route_signature --all-features -- --nocapture\n"
          )
          replace_once(hotspot, old_test, new_test)

          replace_once(
              observer,
              "          grep -Fqx 'Windows Mobile Hotspot restore: persistent v20-path snapshot with v2/v3 schema compatibility, readback, immediate rollback, TUN-off/exit restore and dynamic original-upstream GUID fallback' release-audit/BUILD_INFO.txt\n",
              "          grep -Fqx 'Windows Mobile Hotspot restore: persistent v20-path snapshot with v2/v3 schema compatibility, readback, immediate rollback and TUN-off/exit restore; restore requires a native stable physical IPv4 default-route GUID anchor and fails closed when unavailable' release-audit/BUILD_INFO.txt\n",
          )
          replace_once(
              observer,
              "          grep -Fqx 'Windows TUN route-mode refresh: stable physical ForwardingEnabled changes trigger runtime regeneration without hotspot Start/Stop' release-audit/BUILD_INFO.txt\n",
              "          grep -Fqx 'Windows TUN route identity: stable physical ForwardingEnabled changes are observed without runtime regeneration; only physical upstream identity changes refresh runtime' release-audit/BUILD_INFO.txt\n",
          )
          replace_once(
              observer,
              "          - TUN routing: **ForwardingEnabled -> fake-IP-only route-address · no TUN default route**\n",
              "          - TUN routing: **ForwardingEnabled -> fake-IP-only route-address · no TUN default route · forwarding-only changes do not reload core**\n",
          )
          PY

          git diff --check

      - name: Commit aligned gates and retire one-shot repair workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add .github/workflows/karing-diagnostics-once.yml \
                  .github/workflows/karing-windows-hotspot-v26.yml \
                  .github/workflows/karing-release-observer.yml
          git rm .github/workflows/karing-v27-forwarding-gate-repair-once.yml
          if [ -e .github/workflows/karing-windows-hotspot-v28-repair.yml ]; then
            git rm .github/workflows/karing-windows-hotspot-v28-repair.yml
          fi

          git diff --cached --check
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/karing-diagnostics-once.yml'
            '.github/workflows/karing-release-observer.yml'
            '.github/workflows/karing-v27-forwarding-gate-repair-once.yml'
            '.github/workflows/karing-windows-hotspot-v26.yml'
            '.github/workflows/karing-windows-hotspot-v28-repair.yml'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#staged[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${staged[$i]}" = "${expected_sorted[$i]}"
          done

          git commit --no-verify -m 'ci(karing): align forwarding-stable release gates'
          git push origin HEAD:feature/karing-style-diversion
