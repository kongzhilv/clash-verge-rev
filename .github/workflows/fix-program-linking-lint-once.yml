name: 一次性修复程序项目联动 ESLint
run-name: 修复程序项目联动的 React 状态与导入结构

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/fix-program-linking-lint-once.yml'

permissions:
  contents: write

jobs:
  fix:
    name: 修复、格式化并验证 ESLint
    runs-on: ubuntu-latest
    steps:
      - name: 检出功能分支
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: 修复 React 状态结构和导入顺序
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'未找到预期片段: {path}\n{old[:180]}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          assistant = 'src/components/connection/connection-rule-assistant.tsx'
          replace(
              assistant,
              """import { closeConnection } from 'tauri-plugin-mihomo-api'\n\nimport {\n  makeProject,""",
              """import { closeConnection } from 'tauri-plugin-mihomo-api'\n\nimport { resolveConnectionProject } from '@/components/routing/connection-project'\nimport {\n  makeProject,""",
          )
          replace(
              assistant,
              """import { resolveConnectionProject } from '@/components/routing/connection-project'\nimport { notifyDiversionUpdated }""",
              """import { notifyDiversionUpdated }""",
          )
          replace(
              assistant,
              """  useEffect(() => {\n    if (!open) return\n    setSelectedId('')\n    setProjectEditorOpen(false)\n    setEditingProject(null)\n    void loadProfile()\n  }, [loadProfile, open])""",
              """  useEffect(() => {\n    if (open) void loadProfile()\n  }, [loadProfile, open])""",
          )
          replace(
              assistant,
              """      <ProjectEditorDialog\n        open={projectEditorOpen}\n        project={editingProject}\n        projectIndex={snapshot?.config.projects.length ?? 0}\n        onClose={() => {\n          setProjectEditorOpen(false)\n          setEditingProject(null)\n        }}\n        onSave={(project) => void saveProject(project)}\n      />""",
              """      {projectEditorOpen && (\n        <ProjectEditorDialog\n          open\n          project={editingProject}\n          projectIndex={snapshot?.config.projects.length ?? 0}\n          onClose={() => {\n            setProjectEditorOpen(false)\n            setEditingProject(null)\n          }}\n          onSave={(project) => void saveProject(project)}\n        />\n      )}""",
          )

          editor = 'src/components/rule/diversion-manager/project-editor-dialog.tsx'
          replace(
              editor,
              """} from '@mui/icons-material'\nimport { open as openFileDialog } from '@tauri-apps/plugin-dialog'\nimport {\n  Alert,""",
              """} from '@mui/icons-material'\nimport {\n  Alert,""",
          )
          replace(
              editor,
              """} from '@mui/material'\nimport { useEffect, useState } from 'react'""",
              """} from '@mui/material'\nimport { open as openFileDialog } from '@tauri-apps/plugin-dialog'\nimport { useState } from 'react'""",
          )
          replace(
              editor,
              """\n  useEffect(() => {\n    if (!open) return\n    setDraft(makeProject(projectIndex, project ?? undefined))\n    setActionPickerOpen(false)\n  }, [open, project, projectIndex])\n""",
              "\n",
          )

          manager = 'src/components/rule/diversion-manager/manager.tsx'
          replace(manager, 'lastAutoOpenKey', 'lastAutoOpenKeyRef')
          manager_path = Path(manager)
          manager_text = manager_path.read_text(encoding='utf-8').replace(
              'lastAutoOpenKey.current', 'lastAutoOpenKeyRef.current'
          )
          manager_path.write_text(manager_text, encoding='utf-8')

          panel = 'src/components/rule/diversion-manager/project-panel.tsx'
          replace(
              panel,
              "import { useEffect, useRef, useState } from 'react'",
              "import { useState } from 'react'",
          )
          replace(
              panel,
              """  const [editorOpen, setEditorOpen] = useState(false)\n  const [editingProject, setEditingProject] = useState<DiversionProject | null>(\n    null,\n  )\n  const focusedOnce = useRef<string | null>(null)\n\n  useEffect(() => {\n    if (!focusProjectId || focusedOnce.current === focusProjectId) return\n    const project = config.projects.find((item) => item.id === focusProjectId)\n    if (!project) return\n    focusedOnce.current = focusProjectId\n    setEditingProject(project)\n    setEditorOpen(true)\n  }, [config.projects, focusProjectId])""",
              """  const [manualEditorOpen, setManualEditorOpen] = useState(false)\n  const [editingProject, setEditingProject] = useState<DiversionProject | null>(\n    null,\n  )\n  const [dismissedFocusProjectId, setDismissedFocusProjectId] = useState<\n    string | null\n  >(null)\n  const focusedProject =\n    focusProjectId && dismissedFocusProjectId !== focusProjectId\n      ? (config.projects.find((item) => item.id === focusProjectId) ?? null)\n      : null\n  const editorOpen = manualEditorOpen || Boolean(focusedProject)\n  const editorProject = manualEditorOpen ? editingProject : focusedProject""",
          )
          panel_path = Path(panel)
          panel_text = panel_path.read_text(encoding='utf-8')
          panel_text = panel_text.replace('setEditorOpen(true)', 'setManualEditorOpen(true)')
          panel_text = panel_text.replace('setEditorOpen(false)', 'setManualEditorOpen(false)')
          panel_path.write_text(panel_text, encoding='utf-8')
          replace(
              panel,
              """    setManualEditorOpen(false)\n    setEditingProject(null)\n  }\n\n  const deleteProject""",
              """    setManualEditorOpen(false)\n    setEditingProject(null)\n    setDismissedFocusProjectId(focusProjectId ?? null)\n  }\n\n  const deleteProject""",
          )
          replace(
              panel,
              """      <ProjectEditorDialog\n        open={editorOpen}\n        project={editingProject}\n        projectIndex={config.projects.length}\n        onClose={() => {\n          setManualEditorOpen(false)\n          setEditingProject(null)\n        }}\n        onSave={saveProject}\n      />""",
              """      {editorOpen && (\n        <ProjectEditorDialog\n          open\n          project={editorProject}\n          projectIndex={config.projects.length}\n          onClose={() => {\n            setManualEditorOpen(false)\n            setEditingProject(null)\n            if (focusedProject) setDismissedFocusProjectId(focusedProject.id)\n          }}\n          onSave={saveProject}\n        />\n      )}""",
          )

          rules = 'src/pages/rules.tsx'
          replace(
              rules,
              """import { ScrollTopButton } from '@/components/layout/scroll-top-button'\nimport DiversionDetector from '@/components/rule/diversion-detector'""",
              """import { ScrollTopButton } from '@/components/layout/scroll-top-button'\nimport RoutingRelationsPanel from '@/components/routing/routing-relations-panel'\nimport DiversionDetector from '@/components/rule/diversion-detector'""",
          )
          replace(
              rules,
              """import RuleItem from '@/components/rule/rule-item'\nimport RoutingRelationsPanel from '@/components/routing/routing-relations-panel'""",
              """import RuleItem from '@/components/rule/rule-item'""",
          )
          PY

      - name: 格式化并运行 ESLint
        shell: bash
        run: |
          set -euo pipefail
          pnpm format
          pnpm lint

      - name: 提交通过 ESLint 的修复
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: 消除程序项目联动的 ESLint 警告'
          git push origin HEAD:feature/karing-style-diversion
