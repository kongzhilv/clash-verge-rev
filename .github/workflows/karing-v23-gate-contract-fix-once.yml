name: Karing v23 one-shot gate contract migration

on:
  push:
    branches:
      - fix/karing-windows-hotspot-v23-single-owner
    paths:
      - '.github/workflows/karing-v23-gate-contract-fix-once.yml'

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-v23-single-owner
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove obsolete ICS-private Runtime contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-windows-tun-safety.mjs')
          s = path.read_text()
          block = '''requireText(
            'windowsNetwork',
            'Do not discard them merely because Windows marks SkipAsSource.',
            'ICS private-side route guards retain valid private addresses',
          )
          '''
          if block not in s:
              raise SystemExit('obsolete ICS SkipAsSource contract not found')
          s = s.replace(block, '', 1)
          path.write_text(s)
          PY
          pnpm exec biome format --write scripts/check-windows-tun-safety.mjs
          pnpm exec biome format scripts/check-windows-tun-safety.mjs
          git diff --check
      - name: Commit contract migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-windows-tun-safety.mjs
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'test(windows): retire obsolete ICS-private Runtime contract'
          git push origin HEAD:fix/karing-windows-hotspot-v23-single-owner
