name: v18 release status probe

on:
  push:
    branches: [feature/karing-style-diversion]
    paths: ['.github/workflows/v18-status-probe.yml']

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: f3da9e1b210c46d00014ed23b5428fd58b0526fb
    steps:
      - name: Probe current Karing run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/karing-diagnostics-once.yml/runs?branch=feature/karing-style-diversion&event=push&per_page=30")
          row=$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last // empty' <<<"$runs")
          if [ -z "$row" ]; then
            gh pr comment 10 --repo "$GITHUB_REPOSITORY" --body "⚠️ v18 status probe: no push run found yet for \`${TARGET_SHA}\`."
            exit 0
          fi
          id=$(jq -r '.id' <<<"$row")
          status=$(jq -r '.status' <<<"$row")
          conclusion=$(jq -r '.conclusion // "pending"' <<<"$row")
          created=$(jq -r '.created_at' <<<"$row")
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100")
          completed=$(jq '[.jobs[] | select(.status == "completed")] | length' <<<"$jobs")
          total=$(jq '.jobs | length' <<<"$jobs")
          active=$(jq -r '[.jobs[] | select(.status != "completed") | .name] | join("；")' <<<"$jobs")
          gh pr comment 10 --repo "$GITHUB_REPOSITORY" --body "🔎 v18 status probe: run **${id}**, status **${status}**, conclusion **${conclusion}**, created ${created}, commit \`${TARGET_SHA}\`. Jobs: **${completed}/${total}** completed. Active: ${active:-none}."
