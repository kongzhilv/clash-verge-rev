name: v17 deterministic release watcher

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/v17-push-watcher.yml']

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_SHA: 1f9726c79eac6ab8bb5fdf53956fc3f2613ba760
      TARGET_TAG: v2.5.4-karing.17
      TARGET_WORKFLOW: karing-diagnostics-once.yml
    steps:
      - name: Find, wait and audit release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 40); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=feature/karing-style-diversion&event=push&per_page=30")
            run_id=$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // empty' <<<"$runs")
            if [ -n "$run_id" ]; then break; fi
            sleep 15
          done
          if [ -z "$run_id" ]; then
            gh pr comment 9 --repo "$GITHUB_REPOSITORY" --body "❌ No Karing desktop push release run was found for \`${TARGET_SHA}\`."
            exit 1
          fi
          echo "found release run ${run_id}"

          for attempt in $(seq 1 140); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            status=$(jq -r '.status' <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            echo "run=${run_id} status=${status} conclusion=${conclusion}"
            if [ "$status" = completed ]; then
              if [ "$conclusion" != success ]; then
                jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")
                failed=$(jq -r '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "- \(.name) (job \(.id)): \(.conclusion)"] | join("\n")' <<<"$jobs")
                gh pr comment 9 --repo "$GITHUB_REPOSITORY" --body "❌ **v2.5.4-karing.17 release run failed**\n\n- run: ${run_id}\n- commit: \`${TARGET_SHA}\`\n\n${failed}"
                exit 1
              fi
              break
            fi
            sleep 30
          done

          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success

          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}")
          target=$(jq -r '.target_commitish' <<<"$release")
          draft=$(jq -r '.draft' <<<"$release")
          prerelease=$(jq -r '.prerelease' <<<"$release")
          asset_count=$(jq '.assets | length' <<<"$release")
          release_id=$(jq -r '.id' <<<"$release")
          latest_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')
          test "$target" = "$TARGET_SHA"
          test "$tag_sha" = "$TARGET_SHA"
          test "$draft" = false
          test "$prerelease" = false
          test "$asset_count" -eq 14
          test "$release_id" = "$latest_id"

          rm -rf verify; mkdir verify
          gh release download "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -p BUILD_INFO.txt -D verify
          test "$(grep -Ec '^[0-9a-fA-F]{64}  .+' verify/SHA256SUMS.txt)" -eq 12
          grep -Fq "$TARGET_SHA" verify/BUILD_INFO.txt
          while IFS= read -r file; do
            jq -e --arg file "$file" '.assets | any(.name == $file)' <<<"$release" >/dev/null
          done < <(awk '{sub(/^\*/, "", $2); print $2}' verify/SHA256SUMS.txt)

          gh pr comment 9 --repo "$GITHUB_REPOSITORY" --body "✅ **v2.5.4-karing.17 fully released and audited**\n\n- release run: ${run_id} (success)\n- target/tag commit: \`${TARGET_SHA}\`\n- Latest: yes\n- draft/prerelease: false/false\n- public assets: 14\n- installer checksum entries: 12\n- SHA256SUMS + BUILD_INFO: verified"
