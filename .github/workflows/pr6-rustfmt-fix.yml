name: PR6 Rustfmt Fix Helper

on:
  push:
    branches:
      - fix/outbound-failure-diagnostics-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outbound-failure-diagnostics-ci
          fetch-depth: 0
      - name: Apply exact rustfmt diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/core/outbound_diagnostics.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        let global = parse_route("[TCP] 198.18.0.1:57701 --> r.bing.com:443 using GLOBAL")
            .expect("global route should parse");'''
          new = '''        let global =
            parse_route("[TCP] 198.18.0.1:57701 --> r.bing.com:443 using GLOBAL").expect("global route should parse");'''
          if text.count(old) != 1:
              raise SystemExit('expected rustfmt target not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Remove helper and commit
        run: |
          rm -f .github/workflows/pr6-rustfmt-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/core/outbound_diagnostics.rs .github/workflows/pr6-rustfmt-fix.yml
          git diff --cached --check
          git commit -m "style: apply outbound diagnostics rustfmt"
          git push origin HEAD:fix/outbound-failure-diagnostics-ci
