name: Karing 2.5.4 评论派发器

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    name: 显式派发发行启动器
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/launch-karing-v254-2fb7a8bc'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DISPATCHER_PATH: .github/workflows/karing-v254-comment-dispatch.yml
    steps:
      - name: 通过 workflow_dispatch 启动发行
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run launch-karing-v254-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref dev

      - name: 清理一次性评论派发器
        shell: bash
        run: |
          set -euo pipefail
          dispatcher_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${DISPATCHER_PATH}?ref=dev" --jq '.sha')
          jq -n \
            --arg message 'chore: remove one-time Karing 2.5.4 comment dispatcher' \
            --arg sha "$dispatcher_sha" \
            --arg branch dev \
            '{message: $message, sha: $sha, branch: $branch}' | \
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${DISPATCHER_PATH}" --input - >/dev/null