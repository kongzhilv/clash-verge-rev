name: v20 native fixup once

on:
  push:
    branches:
      - fix/karing-windows-hotspot-ics-v20

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-ics-v20
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          components: rustfmt
      - name: Apply reviewed native ICS corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src-tauri/src/core/windows_hotspot_ics.rs')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} anchor not found')
              s = s.replace(old, new, 1)

          replace_once(
              'static MONITOR_STARTED: AtomicBool = AtomicBool::new(false);',
              'static MONITOR_STARTED: AtomicBool = AtomicBool::new(false);\nstatic RESTORE_REQUESTED: AtomicBool = AtomicBool::new(false);',
              'restore gate',
          )

          replace_once(
              '''        unsafe { CoInitializeEx(None, COINIT_APARTMENTTHREADED) }\n            .context("CoInitializeEx(COINIT_APARTMENTTHREADED) failed")?;''',
              '''        unsafe { CoInitializeEx(None, COINIT_APARTMENTTHREADED) }\n            .ok()\n            .context("CoInitializeEx(COINIT_APARTMENTTHREADED) failed")?;''',
              'CoInitializeEx HRESULT',
          )

          # windows-rs 0.62 generated COM methods take Param<INetConnection>, not &INetConnection.
          s = s.replace(
              'get_NetConnectionProps(connection)',
              'get_NetConnectionProps(connection.clone())',
          )
          s = s.replace(
              'get_INetSharingConfigurationForINetConnection(connection)',
              'get_INetSharingConfigurationForINetConnection(connection.clone())',
          )

          role_anchor = '''fn role_of_guid(roles: &[SavedRole], guid: GUID) -> Option<SharingRole> {\n    roles\n        .iter()\n        .find(|item| same_guid(&item.guid, guid))\n        .map(|item| item.role)\n}\n'''
          role_helpers = role_anchor + '''\nfn has_unrelated_private_role(original: &[SavedRole], pair: &TargetPair) -> bool {\n    original.iter().any(|item| {\n        item.role == SharingRole::Private\n            && !same_guid(&item.guid, pair.tun.guid)\n            && !same_guid(&item.guid, pair.hotspot.guid)\n    })\n}\n\nfn lease_owned_original_roles(original: &[SavedRole], pair: &TargetPair) -> Vec<SavedRole> {\n    original\n        .iter()\n        .filter(|item| {\n            item.role == SharingRole::Public\n                || same_guid(&item.guid, pair.tun.guid)\n                || same_guid(&item.guid, pair.hotspot.guid)\n        })\n        .cloned()\n        .collect()\n}\n'''
          replace_once(role_anchor, role_helpers, 'rollback scope helpers')

          apply_anchor = '''    let original = current_shared_roles(&sharing_manager, &connections)?;\n    let snapshot = SavedSharingState {\n        version: 1,'''
          apply_replacement = '''    let original = current_shared_roles(&sharing_manager, &connections)?;\n    if has_unrelated_private_role(&original, pair) {\n        diagnostics::warn(\n            "windows-hotspot-ics",\n            "lease-refused-unrelated-private-sharing",\n            json!({\n                "originally_shared": &original,\n                "action": "fail-closed-preserve-unrelated-private-ics",\n            }),\n        );\n        bail!("refusing to replace an unrelated existing PRIVATE ICS connection");\n    }\n    let rollback_roles = lease_owned_original_roles(&original, pair);\n    let snapshot = SavedSharingState {\n        version: 2,'''
          replace_once(apply_anchor, apply_replacement, 'apply safety precondition')
          replace_once(
              '        originally_shared: original.clone(),',
              '        originally_shared: rollback_roles,',
              'lease-owned rollback roles',
          )

          replace_once(
              '''    let pair = if tun_enabled { target_pair()? } else { None };''',
              '''    let pair = if tun_enabled && !RESTORE_REQUESTED.load(Ordering::Acquire) {\n        target_pair()?\n    } else {\n        None\n    };''',
              'restore suppression gate',
          )

          old_match = '''            Ok(Err(error)) | Err(error) => {\n                diagnostics::warn(\n                    "windows-hotspot-ics",\n                    "target-discovery-failed",\n                    json!({"error": error.to_string()}),\n                );\n                continue;\n            }'''
          new_match = '''            Ok(Err(error)) => {\n                diagnostics::warn(\n                    "windows-hotspot-ics",\n                    "target-discovery-failed",\n                    json!({"error": error.to_string(), "error_kind": "discovery"}),\n                );\n                continue;\n            }\n            Err(error) => {\n                diagnostics::warn(\n                    "windows-hotspot-ics",\n                    "target-discovery-failed",\n                    json!({"error": error.to_string(), "error_kind": "join"}),\n                );\n                continue;\n            }'''
          replace_once(old_match, new_match, 'async error type split')

          monitor_anchor = 'async fn monitor_loop() {'
          restore_fn = '''pub async fn restore_now(reason: &'static str) -> Result<bool> {\n    RESTORE_REQUESTED.store(true, Ordering::Release);\n    let path = snapshot_path()?;\n    let path_for_task = path.clone();\n    let restored = tokio::task::spawn_blocking(move || -> Result<bool> {\n        let Some(snapshot) = load_snapshot(&path_for_task)? else {\n            return Ok(false);\n        };\n        restore_snapshot(&path_for_task, &snapshot)?;\n        Ok(true)\n    })\n    .await\n    .context("Windows ICS shutdown restore task failed")??;\n\n    diagnostics::info(\n        "windows-hotspot-ics",\n        "explicit-restore-completed",\n        json!({\n            "reason": reason,\n            "restored": restored,\n            "snapshot_file_present": path.exists(),\n            "reapply_suppressed": true,\n        }),\n    );\n    Ok(restored)\n}\n\n'''
          replace_once(monitor_anchor, restore_fn + monitor_anchor, 'explicit restore API')

          replace_once(
              '''            "persistent_rollback": true,\n            "desired_topology": "mihomo-tun=public,windows-mobile-hotspot=private",''',
              '''            "persistent_rollback": true,\n            "rollback_scope": "original-public+lease-targets-only",\n            "unrelated_private_ics_policy": "fail-closed",\n            "shutdown_restore_gate": true,\n            "desired_topology": "mihomo-tun=public,windows-mobile-hotspot=private",''',
              'monitor policy diagnostics',
          )

          tests = r'''\n\n#[cfg(test)]\nmod tests {\n    use super::{\n        InterfaceIdentity, SavedRole, SharingRole, TargetPair, has_unrelated_private_role, lease_owned_original_roles,\n        normalize_guid,\n    };\n    use windows::core::GUID;\n\n    fn pair() -> TargetPair {\n        TargetPair {\n            tun: InterfaceIdentity {\n                guid: GUID::from_u128(0x11111111_1111_1111_1111_111111111111),\n                alias: "Meta".into(),\n                description: "Meta Tunnel".into(),\n            },\n            hotspot: InterfaceIdentity {\n                guid: GUID::from_u128(0x22222222_2222_2222_2222_222222222222),\n                alias: "Hotspot".into(),\n                description: "Microsoft Wi-Fi Direct Virtual Adapter".into(),\n            },\n        }\n    }\n\n    #[test]\n    fn windows_network_guid_normalization_ignores_braces_case_and_space() {\n        assert_eq!(\n            normalize_guid(" {ABCDEFAB-1234-5678-90AB-ABCDEFABCDEF} "),\n            "abcdefab-1234-5678-90ab-abcdefabcdef"\n        );\n    }\n\n    #[test]\n    fn windows_network_rollback_scope_keeps_public_and_lease_targets_only() {\n        let pair = pair();\n        let roles = vec![\n            SavedRole {\n                guid: format!("{:?}", GUID::from_u128(0x33333333_3333_3333_3333_333333333333)),\n                role: SharingRole::Public,\n            },\n            SavedRole {\n                guid: format!("{:?}", pair.hotspot.guid),\n                role: SharingRole::Private,\n            },\n            SavedRole {\n                guid: format!("{:?}", GUID::from_u128(0x44444444_4444_4444_4444_444444444444)),\n                role: SharingRole::Private,\n            },\n        ];\n        let retained = lease_owned_original_roles(&roles, &pair);\n        assert_eq!(retained.len(), 2);\n        assert!(retained.iter().any(|item| item.role == SharingRole::Public));\n        assert!(retained.iter().any(|item| normalize_guid(&item.guid) == normalize_guid(&format!("{:?}", pair.hotspot.guid))));\n    }\n\n    #[test]\n    fn windows_network_unrelated_private_ics_is_fail_closed() {\n        let pair = pair();\n        let roles = vec![SavedRole {\n            guid: format!("{:?}", GUID::from_u128(0x55555555_5555_5555_5555_555555555555)),\n            role: SharingRole::Private,\n        }];\n        assert!(has_unrelated_private_role(&roles, &pair));\n    }\n}\n'''
          if '#[cfg(test)]\nmod tests {' in s:
              raise SystemExit('tests already present unexpectedly')
          s += tests
          p.write_text(s, encoding='utf-8')

          # Restore ICS before TUN teardown so the leased PUBLIC adapter still exists.
          w = Path('src-tauri/src/feat/window.rs')
          ws = w.read_text(encoding='utf-8')
          window_anchor = '''        let core_running = !matches!(\n            CoreManager::global().get_running_mode().as_ref(),\n            RunningMode::NotRunning\n        );\n\n        if tun_enabled && core_running {'''
          window_replacement = '''        let core_running = !matches!(\n            CoreManager::global().get_running_mode().as_ref(),\n            RunningMode::NotRunning\n        );\n\n        #[cfg(target_os = "windows")]\n        let ics_restore_success = match timeout(\n            Duration::from_secs(3),\n            crate::core::windows_hotspot_ics::restore_now("shutdown"),\n        )\n        .await\n        {\n            Ok(Ok(restored)) => {\n                diagnostics::info(\n                    "shutdown",\n                    "windows-ics-restore-completed",\n                    serde_json::json!({"restored": restored}),\n                );\n                true\n            }\n            Ok(Err(error)) => {\n                diagnostics::error(\n                    "shutdown",\n                    "windows-ics-restore-failed",\n                    serde_json::json!({"error": error.to_string()}),\n                );\n                false\n            }\n            Err(_) => {\n                diagnostics::error(\n                    "shutdown",\n                    "windows-ics-restore-timeout",\n                    serde_json::json!({"timeout_ms": 3000}),\n                );\n                false\n            }\n        };\n        #[cfg(not(target_os = "windows"))]\n        let ics_restore_success = true;\n\n        if tun_enabled && core_running {'''
          if window_anchor not in ws:
              raise SystemExit('shutdown restore insertion anchor not found')
          ws = ws.replace(window_anchor, window_replacement, 1)
          stop_anchor = '''        match timeout(stop_timeout, CoreManager::global().stop_core()).await {\n            Ok(_) => {\n                logging!(info, Type::Window, "core已停止");\n                true\n            }\n            Err(_) => {\n                logging!(\n                    warn,\n                    Type::Window,\n                    "Warning: 停止core超时（可能系统正在关机），继续退出"\n                );\n                false\n            }\n        }'''
          stop_replacement = '''        let core_stop_success = match timeout(stop_timeout, CoreManager::global().stop_core()).await {\n            Ok(_) => {\n                logging!(info, Type::Window, "core已停止");\n                true\n            }\n            Err(_) => {\n                logging!(\n                    warn,\n                    Type::Window,\n                    "Warning: 停止core超时（可能系统正在关机），继续退出"\n                );\n                false\n            }\n        };\n        ics_restore_success && core_stop_success'''
          if stop_anchor not in ws:
              raise SystemExit('shutdown result anchor not found')
          w.write_text(ws.replace(stop_anchor, stop_replacement, 1), encoding='utf-8')
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/core/windows_hotspot_ics.rs src-tauri/src/feat/window.rs
          git diff --cached --check
          git commit -m 'fix(v20): harden native ICS lease lifecycle'
          git push origin HEAD:fix/karing-windows-hotspot-ics-v20
