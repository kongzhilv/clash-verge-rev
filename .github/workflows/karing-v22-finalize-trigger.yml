name: Karing v22 finalizer trigger

on:
  push:
    branches:
      - fix/karing-windows-hotspot-v22
    paths:
      - '.github/workflows/karing-v22-finalize-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-finalizer:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v22 finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run karing-v22-finalize.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref fix/karing-windows-hotspot-v22
