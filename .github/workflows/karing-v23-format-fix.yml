name: Karing v23 one-shot Biome format fix

on:
  push:
    branches:
      - fix/karing-windows-hotspot-v23-single-owner
    paths:
      - '.github/workflows/karing-v23-format-fix.yml'

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  format-v23-safety-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-v23-single-owner
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format only v23 safety scripts
        run: |
          pnpm exec biome format --write \
            scripts/check-windows-hotspot-single-owner-v23.mjs \
            scripts/check-windows-tun-safety.mjs
          pnpm exec biome format \
            scripts/check-windows-hotspot-single-owner-v23.mjs \
            scripts/check-windows-tun-safety.mjs
      - name: Commit formatter-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            scripts/check-windows-hotspot-single-owner-v23.mjs \
            scripts/check-windows-tun-safety.mjs; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/check-windows-hotspot-single-owner-v23.mjs \
            scripts/check-windows-tun-safety.mjs
          git commit -m 'style(ci): format v23 safety gates with Biome'
          git push origin HEAD:fix/karing-windows-hotspot-v23-single-owner
