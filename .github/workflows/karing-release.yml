name: Karing 桌面版审查与发行
run-name: ${{ github.event_name == 'pull_request' && '审查 Karing 桌面版安装包' || '构建并发布 Karing 桌面版' }}

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/karing-release.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/karing-release.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  NODE_OPTIONS: --max_old_space_size=4096
  RELEASE_TAG: v2.5.3-karing
  RELEASE_BRANCH: feature/karing-style-diversion

concurrency:
  group: karing-desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: 审查并验证源码
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: 检出本次运行对应的代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 读取并验证发行信息
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          commit=$(git rev-parse HEAD)
          test "$version" = '2.5.3'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: 检查前端格式
        run: pnpm format:check

      - name: 运行 ESLint
        run: pnpm lint

      - name: 运行 TypeScript 类型检查
        run: pnpm typecheck

      - name: 检查未使用的前端代码和依赖
        run: pnpm knip:report

      - name: 构建前端
        run: pnpm run web:build

      - name: 运行 Rust Clippy
        run: cargo clippy --workspace --all-targets --features clippy -- -D warnings

      - name: 审查 Karing 发行范围
        shell: bash
        run: |
          set -euo pipefail
          test ! -e mobile/android/upstream.env
          grep -q 'pub async fn start_proxy()' src-tauri/src/cmd/clash.rs
          grep -q 'pub async fn stop_proxy()' src-tauri/src/cmd/clash.rs
          grep -q 'cmd::start_proxy' src-tauri/src/lib.rs
          grep -q 'cmd::stop_proxy' src-tauri/src/lib.rs
          grep -q "value ? 'start_proxy' : 'stop_proxy'" src/components/home/proxy-tun-card.tsx
          grep -q 'x-karing-diversion' src-tauri/src/enhance/karing.rs
          grep -q 'Global Merge and Script are always collected' src-tauri/src/cmd/save_profile.rs

  native-builds:
    name: 构建 ${{ matrix.name }}
    needs: review
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - id: windows-arm64
            name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
          - id: macos-arm64
            name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - id: macos-x64
            name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
          - id: linux-x64
            name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出本次运行对应的代码
        uses: actions/checkout@v7

      - name: 安装 Rust 及目标平台
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: 恢复 Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing-desktop-native-v3
          key: ${{ matrix.os }}-${{ matrix.target }}
          workspaces: |
            . -> target
            .ci/service-ipc-source-${{ matrix.target }} -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 根据 Cargo.lock 构建匹配服务组件
        run: node scripts/build-matching-service.mjs ${{ matrix.target }}

      - name: 准备 Mihomo 和运行资源
        run: pnpm run prebuild ${{ matrix.target }}

      - name: 生成无更新签名的打包配置
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .ci/tauri-release.conf.json

      - name: 构建桌面安装包
        run: pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-release.conf.json

      - name: 上传 Windows 安装包
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: karing-${{ matrix.id }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: 上传 macOS 磁盘映像
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: karing-${{ matrix.id }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: 上传 Linux 安装包
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: karing-${{ matrix.id }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux-arm-builds:
    name: 构建 Linux ${{ matrix.name }}
    needs: review
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            name: ARM64
            arch: arm64
            deb_arch: arm64
          - target: armv7-unknown-linux-gnueabihf
            name: ARMv7
            arch: armhf
            deb_arch: armhf
    runs-on: ubuntu-22.04
    steps:
      - name: 检出本次运行对应的代码
        uses: actions/checkout@v7

      - name: 安装 Rust 及目标平台
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: 恢复 Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing-desktop-linux-arm-v3
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            .ci/service-ipc-source-${{ matrix.target }} -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: 配置 Ubuntu 多架构软件源
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sources.list <<'EOF'
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF
          if [ -f /etc/apt/sources.list ]; then
            sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          fi
          sudo mv /tmp/sources.list /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.deb_arch }}
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1:${{ matrix.deb_arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.deb_arch }} \
            libayatana-appindicator3-dev:${{ matrix.deb_arch }} \
            libssl-dev:${{ matrix.deb_arch }} \
            librsvg2-dev:${{ matrix.deb_arch }} \
            patchelf

      - name: 安装交叉编译器
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.target }}' = 'aarch64-unknown-linux-gnu' ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
            echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
            echo 'CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/' >> "$GITHUB_ENV"
          else
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"
            echo 'CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"
            echo 'CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig/' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/' >> "$GITHUB_ENV"
          fi
          echo 'PKG_CONFIG_ALLOW_CROSS=1' >> "$GITHUB_ENV"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 根据 Cargo.lock 构建匹配服务组件
        run: node scripts/build-matching-service.mjs ${{ matrix.target }}

      - name: 准备 Mihomo 和运行资源
        run: pnpm run prebuild ${{ matrix.target }}

      - name: 生成无更新签名的打包配置
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .ci/tauri-release.conf.json

      - name: 交叉编译 Linux 安装包
        run: pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-release.conf.json

      - name: 上传 Linux ARM 安装包
        uses: actions/upload-artifact@v7
        with:
          name: karing-linux-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  fixed-webview2-builds:
    name: 构建固定 WebView2 ${{ matrix.name }}
    needs: review
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: x64
            arch: x64
          - target: aarch64-pc-windows-msvc
            name: ARM64
            arch: arm64
    runs-on: windows-latest
    steps:
      - name: 检出本次运行对应的代码
        uses: actions/checkout@v7

      - name: 安装 Rust 及目标平台
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: 恢复 Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: karing-desktop-fixed-webview2-v3
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            .ci/service-ipc-source-${{ matrix.target }} -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 根据 Cargo.lock 构建匹配服务组件
        run: node scripts/build-matching-service.mjs ${{ matrix.target }}

      - name: 准备 Mihomo 和运行资源
        run: pnpm run prebuild ${{ matrix.target }}

      - name: 下载固定版 WebView2 运行库
        shell: pwsh
        run: |
          $version = '133.0.3065.92'
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$version.${{ matrix.arch }}.cab"
          Invoke-WebRequest -Uri "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/$cab" -OutFile $cab
          Expand.exe $cab -F:* ./src-tauri
          Remove-Item ./src-tauri/tauri.windows.conf.json
          Rename-Item ./src-tauri/webview2.${{ matrix.arch }}.json tauri.windows.conf.json

      - name: 生成无更新签名的打包配置
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci | Out-Null
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 .ci/tauri-release.conf.json

      - name: 构建固定 WebView2 安装包
        shell: pwsh
        run: |
          pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-release.conf.json
          $files = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe"
          if (-not $files) { throw '没有找到固定 WebView2 安装包' }
          foreach ($file in $files) {
            $newName = $file.Name -replace '-setup\.exe$', '_fixed_webview2-setup.exe'
            Rename-Item $file.FullName $newName
          }

      - name: 上传固定 WebView2 安装包
        uses: actions/upload-artifact@v7
        with:
          name: karing-fixed-webview2-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*_fixed_webview2-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-release:
    name: 汇总并审查发行产物
    needs:
      - review
      - native-builds
      - linux-arm-builds
      - fixed-webview2-builds
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v8
        with:
          pattern: karing-*
          path: downloaded-assets
          merge-multiple: true

      - name: 校验并整理发行文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-assets -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            -exec cp '{}' release-assets/ \;

          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 12 ]; then
            echo "应当生成 12 个可安装文件，实际找到 $count 个"
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          duplicate_count=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort | uniq -d | wc -l)
          test "$duplicate_count" -eq 0

          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )

          cat > release-assets/BUILD_INFO.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Event: ${GITHUB_EVENT_NAME}
          Commit: ${{ needs.review.outputs.commit }}
          Version: ${{ needs.review.outputs.version }}
          Release tag: ${RELEASE_TAG}
          Platforms: Windows x64/ARM64, macOS Intel/Apple Silicon, Linux x64/ARM64/ARMv7
          Signing: unsigned fork build; no upstream Apple notarization or updater signature
          Android: intentionally not included
          EOF

          cat > release-assets/release-notes.md <<EOF
          # Clash Verge Rev Karing v${{ needs.review.outputs.version }}

          本桌面发行版加入 Karing 风格分流管理、全局 Merge/Script 保存后即时应用，以及经过审查的主代理开关链路。

          ## 安装包
          - Windows x64 与 ARM64
          - Windows x64 与 ARM64 固定 WebView2 版本
          - macOS Apple Silicon 与 Intel
          - Linux x64、ARM64 与 ARMv7 的 DEB/RPM

          Android 不在本次发行范围内。本分支安装包不包含上游官方签名或 Apple 公证，请使用 SHA256SUMS.txt 验证下载文件。

          Commit: `${{ needs.review.outputs.commit }}`
          EOF

          echo '发行文件：'
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 上传已审查的完整发行资产
        uses: actions/upload-artifact@v7
        with:
          name: karing-release-assets
          path: release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    name: 发布正式 GitHub Release
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/karing-style-diversion' }}
    needs:
      - review
      - package-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载已审查的发行资产
        uses: actions/download-artifact@v8
        with:
          name: karing-release-assets
          path: release-assets

      - name: 创建并发布正式 Latest 版本
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes --cleanup-tag
          fi

          gh release create "${RELEASE_TAG}" \
            release-assets/*.exe \
            release-assets/*.dmg \
            release-assets/*.deb \
            release-assets/*.rpm \
            release-assets/SHA256SUMS.txt \
            release-assets/BUILD_INFO.txt \
            --target "${{ needs.review.outputs.commit }}" \
            --title "Clash Verge Rev Karing v${{ needs.review.outputs.version }}" \
            --notes-file release-assets/release-notes.md \
            --latest

          gh release view "${RELEASE_TAG}" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
