          project_panel = r'''import {
  AddRounded,
  AppsRounded,
  DeleteOutlineRounded,
  EditRounded,
  HubRounded,
  LanRounded,
  RefreshRounded,
  WorkspacesRounded,
} from '@mui/icons-material'
import {
  Alert,
  Box,
  Button,
  Chip,
  CircularProgress,
  Paper,
  Stack,
  Switch,
  Typography,
} from '@mui/material'
import { useCallback, useEffect, useMemo, useState } from 'react'
import { useNavigate } from 'react-router'

import { getProcessConnections } from '@/services/cmds'

import { actionLabel } from './action-label'
import {
  makeProject,
  resolveActionPolicy,
  type DiversionConfig,
  type DiversionProject,
} from './model'
import ProjectEditorDialog from './project-editor-dialog'

interface ProjectPanelProps {
  config: DiversionConfig
  focusProjectId?: string | null
  onChange: (patch: Partial<DiversionConfig>) => void
}

interface DiscoveredProgram {
  key: string
  name: string
  path: string
  pids: number[]
  connectionCount: number
  protocols: string[]
  remoteAddresses: string[]
}

const conditionCount = (project: DiversionProject) =>
  project.processNames.length +
  project.processPaths.length +
  project.domains.length +
  project.ipCidrs.length +
  project.destinationPorts.length

export const ProjectPanel = ({
  config,
  focusProjectId,
  onChange,
}: ProjectPanelProps) => {
  const navigate = useNavigate()
  const [manualEditorOpen, setManualEditorOpen] = useState(false)
  const [editingProject, setEditingProject] = useState<DiversionProject | null>(
    null,
  )
  const [processSnapshot, setProcessSnapshot] = useState<
    Awaited<ReturnType<typeof getProcessConnections>> | undefined
  >()
  const [processLoading, setProcessLoading] = useState(false)
  const [processError, setProcessError] = useState('')
  const [dismissedFocusProjectId, setDismissedFocusProjectId] = useState<
    string | null
  >(null)
  const focusedProject =
    focusProjectId && dismissedFocusProjectId !== focusProjectId
      ? (config.projects.find((item) => item.id === focusProjectId) ?? null)
      : null
  const editorOpen = manualEditorOpen || Boolean(focusedProject)
  const editorProject = manualEditorOpen ? editingProject : focusedProject

  const loadProcessConnections = useCallback(async () => {
    setProcessLoading(true)
    setProcessError('')
    try {
      const snapshot = await getProcessConnections()
      setProcessSnapshot(snapshot)
      if (snapshot.errors.length > 0) {
        setProcessError(snapshot.errors.join('；'))
      }
    } catch (error) {
      setProcessError(String(error))
    } finally {
      setProcessLoading(false)
    }
  }, [])

  useEffect(() => {
    void loadProcessConnections()
  }, [loadProcessConnections])

  const discoveredPrograms = useMemo(() => {
    const programs = new Map<string, DiscoveredProgram>()

    for (const connection of processSnapshot?.connections ?? []) {
      const pathKey = connection.processPath.trim().toLowerCase()
      const nameKey = connection.processName.trim().toLowerCase()
      const key = pathKey || nameKey || `pid:${connection.pid}`
      const current = programs.get(key) ?? {
        key,
        name: connection.processName || `PID ${connection.pid}`,
        path: connection.processPath,
        pids: [],
        connectionCount: 0,
        protocols: [],
        remoteAddresses: [],
      }

      current.connectionCount += 1
      if (!current.pids.includes(connection.pid)) current.pids.push(connection.pid)
      if (!current.protocols.includes(connection.protocol)) {
        current.protocols.push(connection.protocol)
      }
      if (
        connection.remoteAddress &&
        !current.remoteAddresses.includes(connection.remoteAddress)
      ) {
        current.remoteAddresses.push(connection.remoteAddress)
      }
      programs.set(key, current)
    }

    return [...programs.values()]
      .sort(
        (left, right) =>
          right.connectionCount - left.connectionCount ||
          left.name.localeCompare(right.name),
      )
      .slice(0, 40)
  }, [processSnapshot])

  const registeredPaths = useMemo(
    () =>
      new Set(
        config.projects.flatMap((project) =>
          project.processPaths.map((path) => path.trim().toLowerCase()),
        ),
      ),
    [config.projects],
  )
  const registeredNames = useMemo(
    () =>
      new Set(
        config.projects.flatMap((project) =>
          project.processNames.map((name) => name.trim().toLowerCase()),
        ),
      ),
    [config.projects],
  )

  const openCreate = () => {
    setEditingProject(null)
    setManualEditorOpen(true)
  }

  const openEdit = (project: DiversionProject) => {
    setEditingProject(project)
    setManualEditorOpen(true)
  }

  const importDetectedProgram = (program: DiscoveredProgram) => {
    const processName = program.name.trim()
    const processPath = program.path.trim()
    const project = makeProject(config.projects.length, {
      kind: 'program',
      name: processName.replace(/\.exe$/i, '') || processName,
      description: `由系统连接发现；PID：${program.pids.join(', ')}；当前连接：${program.connectionCount}`,
      processNames: processName ? [processName] : [],
      processPaths: processPath ? [processPath] : [],
    })
    setEditingProject(project)
    setManualEditorOpen(true)
  }

  const saveProject = (project: DiversionProject) => {
    const exists = config.projects.some((item) => item.id === project.id)
    const projects = exists
      ? config.projects.map((item) => (item.id === project.id ? project : item))
      : [...config.projects, project]
    onChange({ enabled: true, projects })
    setManualEditorOpen(false)
    setEditingProject(null)
    setDismissedFocusProjectId(focusProjectId ?? null)
  }

  const deleteProject = (project: DiversionProject) => {
    onChange({
      projects: config.projects.filter((item) => item.id !== project.id),
    })
  }

  const toggleProject = (project: DiversionProject, enabled: boolean) => {
    onChange({
      projects: config.projects.map((item) =>
        item.id === project.id ? { ...item, enabled } : item,
      ),
    })
  }

  return (
    <Box>
      <Paper variant="outlined" sx={{ p: 1.5, mb: 2, borderRadius: 2 }}>
        <Stack
          direction={{ xs: 'column', sm: 'row' }}
          spacing={1}
          sx={{ alignItems: { sm: 'center' } }}
        >
          <Box sx={{ flex: 1 }}>
            <Typography variant="subtitle1" sx={{ fontWeight: 700 }}>
              正在联网的程序
            </Typography>
            <Typography variant="caption" color="text.secondary">
              直接从 Windows 系统连接表读取 PID、进程名称与完整 exe
              路径；选中后会进入同一套程序档案、规则组和出口策略链。
            </Typography>
          </Box>
          <Button
            size="small"
            startIcon={
              processLoading ? <CircularProgress size={16} /> : <RefreshRounded />
            }
            onClick={() => void loadProcessConnections()}
            disabled={processLoading}
          >
            刷新连接
          </Button>
        </Stack>

        {processSnapshot && !processSnapshot.supported && (
          <Alert severity="info" sx={{ mt: 1 }}>
            {processSnapshot.source}
          </Alert>
        )}
        {processError && (
          <Alert severity="warning" sx={{ mt: 1 }}>
            已取得可用结果，但部分连接表读取失败：{processError}
          </Alert>
        )}
        {processLoading && !processSnapshot ? (
          <Box sx={{ display: 'grid', placeItems: 'center', py: 3 }}>
            <CircularProgress size={24} />
          </Box>
        ) : processSnapshot?.supported && discoveredPrograms.length === 0 ? (
          <Alert severity="info" sx={{ mt: 1 }}>
            当前没有发现可归因的系统连接。启动目标程序后点击“刷新连接”。
          </Alert>
        ) : (
          <Stack spacing={1} sx={{ mt: discoveredPrograms.length ? 1.5 : 0 }}>
            {discoveredPrograms.map((program) => {
              const registered = program.path
                ? registeredPaths.has(program.path.toLowerCase())
                : registeredNames.has(program.name.toLowerCase())
              return (
                <Paper
                  key={program.key}
                  variant="outlined"
                  sx={{ p: 1.25, borderRadius: 2 }}
                >
                  <Stack
                    direction={{ xs: 'column', md: 'row' }}
                    spacing={1}
                    sx={{ alignItems: { md: 'center' } }}
                  >
                    <Box sx={{ flex: 1, minWidth: 0 }}>
                      <Typography sx={{ fontWeight: 700 }}>
                        {program.name}
                      </Typography>
                      <Typography
                        variant="caption"
                        color="text.secondary"
                        sx={{ display: 'block', wordBreak: 'break-all' }}
                      >
                        {program.path || '系统进程路径受保护，仍可按进程名称建立规则'}
                      </Typography>
                      <Stack
                        direction="row"
                        spacing={0.75}
                        sx={{ mt: 0.75, flexWrap: 'wrap' }}
                      >
                        <Chip size="small" label={`PID ${program.pids.join(', ')}`} />
                        <Chip
                          size="small"
                          label={`${program.connectionCount} 条系统连接`}
                        />
                        {program.protocols.map((protocol) => (
                          <Chip key={protocol} size="small" label={protocol} />
                        ))}
                        {program.remoteAddresses.slice(0, 3).map((address) => (
                          <Chip
                            key={address}
                            size="small"
                            variant="outlined"
                            label={address}
                          />
                        ))}
                      </Stack>
                    </Box>
                    <Button
                      size="small"
                      variant={registered ? 'text' : 'outlined'}
                      disabled={registered}
                      onClick={() => importDetectedProgram(program)}
                    >
                      {registered ? '已加入档案' : '加入分流档案'}
                    </Button>
                  </Stack>
                </Paper>
              )
            })}
          </Stack>
        )}
      </Paper>

      <Stack
        direction={{ xs: 'column', sm: 'row' }}
        spacing={1}
        sx={{ mb: 1, alignItems: { sm: 'center' } }}
      >
        <Box sx={{ flex: 1 }}>
          <Typography variant="subtitle1" sx={{ fontWeight: 700 }}>
            程序与项目档案
          </Typography>
          <Typography variant="caption" color="text.secondary">
            将程序路径、域名、IP
            和端口绑定到同一个规则组与出口；连接、规则和代理组页面会共享这份关系。
          </Typography>
        </Box>
        <Button startIcon={<AddRounded />} onClick={openCreate}>
          添加程序或项目
        </Button>
      </Stack>

      {config.projects.length === 0 ? (
        <Alert severity="info">
          还没有程序或项目档案。可从上方系统连接直接导入，也可手工添加域名、IP
          或端口特征。
        </Alert>
      ) : (
        <Stack spacing={1}>
          {config.projects.map((project) => {
            const policy = resolveActionPolicy(
              config,
              project.action,
              project.policy,
            )
            const focused = project.id === focusProjectId
            return (
              <Paper
                key={project.id}
                variant="outlined"
                sx={{
                  p: 1.5,
                  borderRadius: 2,
                  borderColor: focused ? 'primary.main' : 'divider',
                  bgcolor: focused ? 'action.selected' : undefined,
                }}
              >
                <Stack
                  direction={{ xs: 'column', md: 'row' }}
                  spacing={1.5}
                  sx={{ alignItems: { md: 'center' } }}
                >
                  <Box
                    sx={{
                      width: 42,
                      height: 42,
                      display: 'grid',
                      placeItems: 'center',
                      borderRadius: 2,
                      bgcolor: project.enabled
                        ? 'primary.main'
                        : 'action.hover',
                      color: project.enabled
                        ? 'primary.contrastText'
                        : 'text.secondary',
                    }}
                  >
                    {project.kind === 'program' ? (
                      <AppsRounded />
                    ) : (
                      <WorkspacesRounded />
                    )}
                  </Box>

                  <Box sx={{ flex: 1, minWidth: 0 }}>
                    <Typography sx={{ fontWeight: 700 }}>
                      {project.name}
                    </Typography>
                    {project.description && (
                      <Typography
                        variant="body2"
                        color="text.secondary"
                        sx={{ wordBreak: 'break-word' }}
                      >
                        {project.description}
                      </Typography>
                    )}
                    <Stack
                      direction="row"
                      spacing={0.75}
                      sx={{ mt: 0.75, flexWrap: 'wrap' }}
                    >
                      <Chip
                        size="small"
                        label={`${conditionCount(project)} 个识别条件`}
                      />
                      <Chip
                        size="small"
                        color="primary"
                        variant="outlined"
                        label={actionLabel(project.action, project.policy)}
                      />
                      <Chip
                        size="small"
                        icon={<HubRounded />}
                        label={`规则组：${project.groupId}`}
                      />
                      {policy && (
                        <Chip
                          size="small"
                          icon={<LanRounded />}
                          label={`出口：${policy}`}
                        />
                      )}
                    </Stack>
                  </Box>

                  <Switch
                    checked={project.enabled}
                    onChange={(_, checked) => toggleProject(project, checked)}
                    slotProps={{
                      input: { 'aria-label': `启用 ${project.name}` },
                    }}
                  />

                  <Stack
                    direction="row"
                    spacing={0.5}
                    sx={{ flexWrap: 'wrap' }}
                  >
                    <Button
                      size="small"
                      onClick={() =>
                        navigate(
                          `/connections?project=${encodeURIComponent(project.id)}`,
                        )
                      }
                    >
                      查看连接
                    </Button>
                    {policy && (
                      <Button
                        size="small"
                        onClick={() =>
                          navigate(
                            `/proxies?policy=${encodeURIComponent(policy)}`,
                          )
                        }
                      >
                        查看代理组
                      </Button>
                    )}
                    <Button
                      size="small"
                      startIcon={<EditRounded />}
                      onClick={() => openEdit(project)}
                    >
                      编辑
                    </Button>
                    <Button
                      size="small"
                      color="error"
                      startIcon={<DeleteOutlineRounded />}
                      onClick={() => deleteProject(project)}
                    >
                      删除
                    </Button>
                  </Stack>
                </Stack>
              </Paper>
            )
          })}
        </Stack>
      )}

      {editorOpen && (
        <ProjectEditorDialog
          open
          project={editorProject}
          projectIndex={config.projects.length}
          onClose={() => {
            setManualEditorOpen(false)
            setEditingProject(null)
            if (focusedProject) setDismissedFocusProjectId(focusedProject.id)
          }}
          onSave={saveProject}
        />
      )}
    </Box>
  )
}

