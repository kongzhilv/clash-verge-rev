name: 重试 Karing v7 程序识别与抽屉修复

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/apply-karing-v7-fix-retry.yml'

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: 应用修复脚本
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py

      - name: 格式化并运行专项回归
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec biome format --write src/services/process-connections.ts src/components/connection/connection-detail.tsx scripts/check-karing-process-attribution.mjs package.json src-tauri/tauri.conf.json
          cargo fmt --all
          node scripts/check-karing-process-attribution.mjs

      - name: 推送功能分支
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/process-connections.ts src-tauri/src/cmd/process_connections.rs src/components/connection/connection-detail.tsx scripts/check-karing-process-attribution.mjs package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml Cargo.lock
          git commit --no-verify -m 'fix: resolve program identity and clipped connection details'
          git push origin HEAD:feature/karing-style-diversion
