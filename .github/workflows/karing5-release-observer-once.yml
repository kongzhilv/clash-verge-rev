name: Karing 5 发行运行观察器
run-name: 记录 Karing 5 固定候选发行运行

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/karing5-release-observer-once.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: 获取固定候选发行运行
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/karing5-audited-release.yml/runs?event=push&branch=dev&per_page=10" \
              --jq '[.workflow_runs[] | select(.head_sha == "4e420cc6b8b21efac882cc77e7410139274653eb")][0]')
            if [ "$run_json" != 'null' ] && [ -n "$run_json" ]; then
              break
            fi
            sleep 3
          done
          test "$run_json" != 'null'
          run_id=$(jq -r '.id' <<< "$run_json")
          run_url=$(jq -r '.html_url' <<< "$run_json")
          status=$(jq -r '.status' <<< "$run_json")
          conclusion=$(jq -r '.conclusion // ""' <<< "$run_json")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          content=$(jq -n \
            --arg run_id "$run_id" \
            --arg url "$run_url" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --arg candidate '88ab1f14633fbf93ea87437ab7f465363b7f82a6' \
            '{run_id:$run_id,url:$url,status:$status,conclusion:$conclusion,candidate:$candidate}')
          encoded=$(printf '%s\n' "$content" | base64 -w0)
          path='.ci/karing5-release-run.json'
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=dev" --jq '.sha' 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message='ci: record Karing 5 release run' -f content="$encoded" -f branch=dev)
          if [ -n "$current" ]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null
          echo "运行：$run_url"

      - name: 回报发行运行
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        shell: bash
        run: |
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body "<!-- karing5-release-run -->
          ## Karing 5 固定候选发行已启动

          - 固定候选：\`88ab1f14633fbf93ea87437ab7f465363b7f82a6\`
          - Action：https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"

      - name: 删除观察器自身
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          path='.github/workflows/karing5-release-observer-once.yml'
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=dev" --jq '.sha')
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='chore: remove Karing 5 release observer' \
            -f sha="$sha" \
            -f branch=dev >/dev/null
