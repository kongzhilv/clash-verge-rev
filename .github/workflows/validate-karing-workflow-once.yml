name: Validate Karing release workflow once

on:
  push:
    branches:
      - fix/karing-release-workflow-validation
    paths:
      - '.github/workflows/validate-karing-workflow-once.yml'
      - '.github/workflows/karing-diagnostics-once.yml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-release-workflow-validation
      - name: Apply release workflow quality fixes in working tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/karing-diagnostics-once.yml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''          echo "version=$version" >> "$GITHUB_OUTPUT"\n          echo "commit=$commit" >> "$GITHUB_OUTPUT"\n          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"\n''',
              '''          {\n            echo "version=$version"\n            echo "commit=$commit"\n            echo "release_tag=$release_tag"\n          } >> "$GITHUB_OUTPUT"\n''',
              'group GITHUB_OUTPUT writes',
          )

          count = text.count('          cache-workspace-crates: true\n')
          if count != 3:
              raise SystemExit(f'cache-workspace-crates: expected 3 matches, found {count}')
          text = text.replace('          cache-workspace-crates: true\n', '')

          step_start = text.index('      - name: 安装交叉编译器\n')
          step_end = text.index('      - name: 安装 pnpm\n', step_start)
          block = text[step_start:step_end]
          lines = block.splitlines(keepends=True)
          rewritten = []
          group_open = False
          for line in lines:
              stripped = line.strip()
              if stripped == "echo 'PKG_CONFIG_ALLOW_CROSS=1' >> \"$GITHUB_ENV\"":
                  continue
              if stripped.startswith('sudo apt-get install -y gcc-'):
                  rewritten.append(line)
                  rewritten.append('            {\n')
                  group_open = True
                  continue
              if group_open and stripped.startswith("echo '") and line.rstrip().endswith('>> "$GITHUB_ENV"'):
                  rewritten.append(line.replace(' >> "$GITHUB_ENV"', ''))
                  continue
              if group_open and stripped in {'else', 'fi'}:
                  rewritten.append("              echo 'PKG_CONFIG_ALLOW_CROSS=1'\n")
                  rewritten.append('            } >> "$GITHUB_ENV"\n')
                  group_open = False
                  rewritten.append(line)
                  continue
              rewritten.append(line)
          if group_open:
              raise SystemExit('GITHUB_ENV group remained open')
          new_block = ''.join(rewritten)
          if new_block == block:
              raise SystemExit('cross compiler block was not transformed')
          text = text[:step_start] + new_block + text[step_end:]

          replace_once(
              '            sha256sum * > SHA256SUMS.txt\n',
              '            sha256sum -- * > SHA256SUMS.txt\n',
              'safe checksum glob',
          )

          replace_once(
              '          cat > release-assets/release-notes.md <<EOF\n',
              "          cat > release-assets/release-notes.md <<'EOF'\n",
              'literal release notes heredoc',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate workflow semantics with actionlint
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -oneline .github/workflows/karing-diagnostics-once.yml
          git diff --check
          git diff -- .github/workflows/karing-diagnostics-once.yml

      - name: Export validated workflow
        uses: actions/upload-artifact@v7
        with:
          name: validated-karing-release-workflow
          path: .github/workflows/karing-diagnostics-once.yml
          if-no-files-found: error
          retention-days: 1
