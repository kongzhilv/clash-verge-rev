name: Validate Karing release workflow once

on:
  push:
    branches:
      - fix/karing-release-workflow-validation
    paths:
      - '.github/workflows/validate-karing-workflow-once.yml'
      - '.github/workflows/karing-diagnostics-once.yml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-release-workflow-validation
      - name: Apply release workflow quality fixes in working tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/karing-diagnostics-once.yml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''          echo "version=$version" >> "$GITHUB_OUTPUT"\n          echo "commit=$commit" >> "$GITHUB_OUTPUT"\n          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"\n''',
              '''          {\n            echo "version=$version"\n            echo "commit=$commit"\n            echo "release_tag=$release_tag"\n          } >> "$GITHUB_OUTPUT"\n''',
              'group GITHUB_OUTPUT writes',
          )

          count = text.count('          cache-workspace-crates: true\n')
          if count != 3:
              raise SystemExit(f'cache-workspace-crates: expected 3 matches, found {count}')
          text = text.replace('          cache-workspace-crates: true\n', '')

          replace_once(
              '''          if [ '${{ matrix.target }}' = 'aarch64-unknown-linux-gnu' ]; then\n            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu\n            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"\n            echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"\n            echo 'CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++' >> "$GITHUB_ENV"\n            echo 'PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/' >> "$GITHUB_ENV"\n            echo 'PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/' >> "$GITHUB_ENV"\n          else\n            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf\n            echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"\n            echo 'CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"\n            echo 'CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++' >> "$GITHUB_ENV"\n            echo 'PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig/' >> "$GITHUB_ENV"\n            echo 'PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/' >> "$GITHUB_ENV"\n          fi\n          echo 'PKG_CONFIG_ALLOW_CROSS=1' >> "$GITHUB_ENV"\n''',
              '''          if [ '${{ matrix.target }}' = 'aarch64-unknown-linux-gnu' ]; then\n            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu\n            {\n              echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc'\n              echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc'\n              echo 'CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++'\n              echo 'PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/'\n              echo 'PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/'\n              echo 'PKG_CONFIG_ALLOW_CROSS=1'\n            } >> "$GITHUB_ENV"\n          else\n            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf\n            {\n              echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc'\n              echo 'CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc'\n              echo 'CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++'\n              echo 'PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig/'\n              echo 'PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/'\n              echo 'PKG_CONFIG_ALLOW_CROSS=1'\n            } >> "$GITHUB_ENV"\n          fi\n''',
              'group GITHUB_ENV writes',
          )

          replace_once(
              '            sha256sum * > SHA256SUMS.txt\n',
              '            sha256sum -- * > SHA256SUMS.txt\n',
              'safe checksum glob',
          )

          replace_once(
              '          cat > release-assets/release-notes.md <<EOF\n',
              "          cat > release-assets/release-notes.md <<'EOF'\n",
              'literal release notes heredoc',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate workflow semantics with actionlint
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -oneline .github/workflows/karing-diagnostics-once.yml
          git diff --check
          git diff -- .github/workflows/karing-diagnostics-once.yml

      - name: Export validated workflow
        uses: actions/upload-artifact@v7
        with:
          name: validated-karing-release-workflow
          path: .github/workflows/karing-diagnostics-once.yml
          if-no-files-found: error
          retention-days: 1
