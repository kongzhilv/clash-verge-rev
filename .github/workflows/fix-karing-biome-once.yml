name: Fix Karing Biome Once

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/fix-karing-biome-once.yml'

permissions:
  contents: write

# One-shot repository formatter using the project's checked-in Biome config.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository with project Biome config
        run: pnpm format

      - name: Commit formatting and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-karing-biome-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply repository Biome formatting'
          git push origin HEAD:feature/karing-style-diversion
