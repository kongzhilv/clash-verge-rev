name: v17 format once

on:
  push:
    branches:
      - fix/windows-hotspot-self-capture-v17

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/windows-hotspot-self-capture-v17
          fetch-depth: 0

      - name: Install Rust formatter
        run: rustup component add rustfmt

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format release gate
        run: pnpm exec biome format --write scripts/check-windows-tun-safety.mjs

      - name: Remove one-shot workflow and commit formatting
        run: |
          rm .github/workflows/v17-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/core/windows_network_diagnostics.rs src-tauri/src/utils/windows_network.rs scripts/check-windows-tun-safety.mjs .github/workflows/v17-format-once.yml
          git diff --cached --check
          git commit -m "style: format Windows hotspot v17 changes"
          git push origin HEAD:fix/windows-hotspot-self-capture-v17
