name: Format Karing UI maturity once

on:
  push:
    branches:
      - feature/karing-style-diversion
    paths:
      - '.github/workflows/format-karing-ui-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 11.3.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatter
        run: pnpm format

      - name: Stage formatted permanent workflow outside .github
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .github/workflows/karing-diagnostics-once.yml; then
            cp .github/workflows/karing-diagnostics-once.yml scripts/karing-diagnostics-formatted.yml
            git checkout -- .github/workflows/karing-diagnostics-once.yml
          fi
          git checkout -- .github/workflows/format-karing-ui-once.yml

      - name: Verify formatting
        run: pnpm format:check

      - name: Commit formatted source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts
          if git diff --cached --quiet; then
            echo 'No source formatting changes were needed.'
            exit 0
          fi
          git commit -m 'style(ui): apply repository formatter'
          git push origin HEAD:feature/karing-style-diversion
