name: v17 one-time release finalizer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

env:
  TARGET_BRANCH: feature/karing-style-diversion
  TARGET_WORKFLOW: karing-diagnostics-once.yml
  TARGET_TAG: v2.5.4-karing.17

jobs:
  finalize:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 9 &&
      github.actor == 'kongzhilv' &&
      github.event.comment.body == '/v17-finalize-release-1f9726c7'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize v17 release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/karing-diagnostics-once.yml')
          text = path.read_text(encoding='utf-8')
          old_title = 'Clash Verge Rev Karing v${{ needs.review.outputs.version }} · Control Readiness + Mode Consistency'
          new_title = 'Clash Verge Rev Karing v${{ needs.review.outputs.version }} · Windows Hotspot Stability + Self-Capture Guard'
          if old_title in text:
              text = text.replace(old_title, new_title)

          pattern = re.compile(r"          cat > release-assets/release-notes\.md <<'EOF'\n.*?\n          EOF\n", re.S)
          block = """          cat > release-assets/release-notes.md <<'EOF'
          # Clash Verge Rev Karing v${{ needs.review.outputs.version }}

          本轮聚焦 Windows TUN + 移动热点运行期稳定性和 Mihomo 自身出站防回环：

          - 将 Windows 移动热点状态明确分成 Off / Starting / Ready；Wi-Fi Direct 适配器刚 Up、ICS 私网 IPv4/CIDR 尚未出现时只记录 Starting，禁止任何 topology-driven Runtime reload。
          - Ready / Off 必须经过连续稳定采样确认后才允许重生成并应用 Runtime，避免 Windows ICS 初始化过程中的瞬态拓扑触发 TUN 重建竞态。
          - 未显式绑定的 inline proxy 与 proxy-provider 使用 Mihomo 原生 per-proxy `interface-name` / provider `override.interface-name` 动态绑定当前稳定物理 NIC，从源头降低 `verge-mihomo.exe` 自身代理 socket 被 TUN 再捕获的风险。
          - 用户显式 node/provider `interface-name`、顶层显式 interface 选择与 `include-interface` 始终优先；程序不会覆盖用户权威配置。
          - 顶层 TUN 继续保持 `auto-detect-interface=true`，不把所有 DIRECT/普通流量写死到启动时网卡。
          - 热点接口、ICS CIDR、物理出口、proxy endpoint/provider 域名均由运行期状态派生，不写死常见 `192.168.137.0/24`、固定网卡名或单一机场地址。
          - 保留单一 Windows IP Helper topology watcher，并继续过滤 WFP/QoS/Native WiFi 派生组件；热点私网地址不错误套用物理出口 `SkipAsSource` 条件。
          - Windows TUN/self-capture 专项门禁、Rust strict Clippy/Logging Check、前端格式/ESLint/TypeScript/Knip 和全平台安装包发行链继续作为正式 Release gate。

          发行范围：Windows x64/ARM64（含固定 WebView2 变体）、macOS Intel/Apple Silicon、Linux x64/ARM64/ARMv7。Android 不在本次桌面发行范围内。
          EOF
"""
          text2, count = pattern.subn(block, text, count=1)
          if count != 1:
              raise SystemExit(f'release notes block replacement count={count}')
          path.write_text(text2, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/karing-diagnostics-once.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(release): finalize v2.5.4-karing.17 metadata'
            git push origin HEAD:${TARGET_BRANCH}
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for audited desktop release run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 140); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=${TARGET_BRANCH}&event=push&per_page=20")
            run_id=$(jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // empty' <<<"$runs")
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 15
          done
          if [ -z "$run_id" ]; then
            echo 'Unable to find push-triggered desktop release run' >&2
            exit 1
          fi
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"

          for attempt in $(seq 1 140); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            status=$(jq -r '.status' <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            echo "release run ${run_id}: status=${status} conclusion=${conclusion}"
            if [ "$status" = completed ]; then
              if [ "$conclusion" != success ]; then
                jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")
                failed=$(jq -r '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "- \(.name) (job \(.id)): \(.conclusion)"] | join("\n")' <<<"$jobs")
                gh pr comment 9 --repo "$GITHUB_REPOSITORY" --body "v2.5.4-karing.17 release run **${run_id}** failed.\n\n${failed}"
                exit 1
              fi
              exit 0
            fi
            sleep 30
          done
          echo "Release run ${run_id} did not finish inside observer window" >&2
          exit 1

      - name: Verify public v17 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(tr -d '\r\n' < .release/karing-release-tag.txt)
          test "$tag" = "$TARGET_TAG"
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
          target=$(jq -r '.target_commitish' <<<"$release")
          draft=$(jq -r '.draft' <<<"$release")
          prerelease=$(jq -r '.prerelease' <<<"$release")
          asset_count=$(jq '.assets | length' <<<"$release")
          release_id=$(jq -r '.id' <<<"$release")
          latest_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')

          test "$target" = "$RELEASE_SHA"
          test "$draft" = false
          test "$prerelease" = false
          test "$asset_count" -eq 14
          test "$release_id" = "$latest_id"
          jq -e '[.assets[].name] | index("SHA256SUMS.txt") != null and index("BUILD_INFO.txt") != null' <<<"$release" >/dev/null

          rm -rf .release-verify
          mkdir .release-verify
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p 'SHA256SUMS.txt' -p 'BUILD_INFO.txt' -D .release-verify
          checksum_count=$(grep -Ec '^[0-9a-fA-F]{64}  .+' .release-verify/SHA256SUMS.txt)
          test "$checksum_count" -eq 12
          grep -Fq "$RELEASE_SHA" .release-verify/BUILD_INFO.txt

          while IFS= read -r file; do
            jq -e --arg file "$file" '.assets | any(.name == $file)' <<<"$release" >/dev/null
          done < <(awk '{sub(/^\*/, "", $2); print $2}' .release-verify/SHA256SUMS.txt)

          gh pr comment 9 --repo "$GITHUB_REPOSITORY" --body "✅ **v2.5.4-karing.17 fully released and audited**\n\n- release run: ${RUN_ID} (success)\n- target commit: \`${RELEASE_SHA}\`\n- Latest: yes\n- draft/prerelease: false/false\n- public assets: 14\n- installer checksum entries: 12\n- SHA256SUMS + BUILD_INFO: verified"
