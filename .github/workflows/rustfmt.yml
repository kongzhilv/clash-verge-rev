name: Check Formatting

on:
  pull_request:
  push:
    branches:
      - fix/windows-hotspot-self-capture-v17
    paths:
      - '.github/workflows/rustfmt.yml'

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  rustfmt:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Rust changes
        id: check_rust
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '**/*.rs'

      - name: Skip if no Rust changes
        if: steps.check_rust.outputs.rust != 'true'
        run: echo "No Rust changes, skipping rustfmt."

      - name: install Rust stable and rustfmt
        if: steps.check_rust.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: run cargo fmt
        if: steps.check_rust.outputs.rust == 'true'
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all -- --check

  v17-repair:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/windows-hotspot-self-capture-v17
          fetch-depth: 0

      - name: Apply exact Clippy repair
        shell: pwsh
        run: |
          $path = 'src-tauri/src/utils/windows_network.rs'
          $text = [System.IO.File]::ReadAllText($path)
          $openCount = ([regex]::Matches($text, [regex]::Escape('r#"'))).Count
          $closeCount = ([regex]::Matches($text, [regex]::Escape('"#,'))).Count
          if ($openCount -ne 2 -or $closeCount -ne 2) {
            throw "Expected exactly two needless raw-string hashes; found opens=$openCount closes=$closeCount"
          }
          $text = $text.Replace('r#"', 'r"').Replace('"#,', '",')
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Format repository with pinned toolchain
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all

      - name: Restrict formatter changes
        shell: pwsh
        run: |
          if (Select-String -Path src-tauri/src/utils/windows_network.rs -SimpleMatch 'r#"' -Quiet) {
            throw 'needless raw-string hashes remain'
          }
          $changed = @(git diff --name-only)
          $allowed = @(
            'src-tauri/src/core/windows_network_diagnostics.rs',
            'src-tauri/src/utils/windows_network.rs'
          )
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected formatter changes: $($unexpected -join ', ')"
          }
          git diff --check

      - name: Verify Windows Clippy
        run: cargo clippy-all

      - name: Verify Windows TUN safety gate
        run: node scripts/check-windows-tun-safety.mjs

      - name: Commit only verified repair and restore workflows
        shell: pwsh
        run: |
          git fetch origin feature/karing-style-diversion --depth=1
          git show FETCH_HEAD:.github/workflows/rustfmt.yml | Set-Content -Encoding utf8NoBOM .github/workflows/rustfmt.yml
          if (Test-Path .github/workflows/v17-self-heal.yml) {
            git rm .github/workflows/v17-self-heal.yml
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rustfmt.yml src-tauri/src/core/windows_network_diagnostics.rs src-tauri/src/utils/windows_network.rs
          git diff --cached --check
          git commit -m 'fix(windows): apply runner-verified v17 formatting and clippy repair'
          git push origin HEAD:fix/windows-hotspot-self-capture-v17

