name: Check Formatting

on:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Rust changes
        id: check_rust
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '**/*.rs'

      - name: Skip if no Rust changes
        if: steps.check_rust.outputs.rust != 'true'
        run: echo "No Rust changes, skipping rustfmt."

      - name: install Rust stable and rustfmt
        if: steps.check_rust.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: run cargo fmt
        if: steps.check_rust.outputs.rust == 'true'
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all -- --check

  v17-format-artifact:
    if: github.event.pull_request.head.ref == 'fix/windows-hotspot-self-capture-v17'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: install Rust stable and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: format v17 Rust files
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all

      - name: upload formatted v17 Rust files
        uses: actions/upload-artifact@v7
        with:
          name: v17-rustfmt-output
          path: |
            src-tauri/src/core/windows_network_diagnostics.rs
            src-tauri/src/utils/windows_network.rs
          if-no-files-found: error
          retention-days: 1

