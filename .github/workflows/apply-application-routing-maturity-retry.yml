name: Retry application routing maturity patch

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-application-routing-maturity-retry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/karing-style-diversion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, content):
              Path(path).write_text(content, encoding='utf-8')

          hook_path = 'src/hooks/use-connection-data.ts'
          hook = load(hook_path)
          old_import = (
              "import {\n"
              "  enrichConnectionsWithProcesses,\n"
              "  getSystemProcessConnections,\n"
              "  type ProcessConnectionSnapshot,\n"
              "} from '@/services/process-connections'\n"
          )
          new_import = (
              "import {\n"
              "  enrichConnectionsWithProcesses,\n"
              "  getProcessAttributionSnapshot,\n"
              "  getSystemProcessConnections,\n"
              "  subscribeProcessAttribution,\n"
              "  type ProcessConnectionSnapshot,\n"
              "} from '@/services/process-connections'\n"
          )
          if old_import not in hook:
              raise SystemExit('current process-connections import block not found')
          hook = hook.replace(old_import, new_import, 1)
          if 'export const useConnectionProcessAttribution' not in hook:
              hook += (
                  "\nexport const useConnectionProcessAttribution = (\n"
                  "  connectionId?: string | null,\n"
                  ") => {\n"
                  "  const snapshot = useSyncExternalStore(\n"
                  "    subscribeProcessAttribution,\n"
                  "    getProcessAttributionSnapshot,\n"
                  "    getProcessAttributionSnapshot,\n"
                  "  )\n"
                  "  return connectionId ? snapshot.items.get(connectionId) : undefined\n"
                  "}\n"
              )
          save(hook_path, hook)

          source_paths = [
              'src/components/rule/diversion-manager/manager.tsx',
              'src/components/rule/diversion-manager/project-panel.tsx',
              'src/components/rule/diversion-manager/detected-programs-panel.tsx',
              'src/components/rule/diversion-manager/model.ts',
              'src/components/routing/routing-relations-panel.tsx',
              'src/components/routing/connection-project.ts',
              'src/components/connection/connection-row-item.tsx',
              'src/components/connection/connection-rule-assistant.tsx',
              'src/pages/connections.tsx',
          ]
          phrases = [
              ('程序与项目', '应用分流'),
              ('程序或项目档案', '应用规则'),
              ('程序/项目档案', '应用规则'),
              ('程序或项目', '应用规则'),
              ('程序/项目', '应用规则'),
              ('程序项目', '应用规则'),
              ('项目档案', '应用规则'),
              ('程序档案', '应用规则'),
              ('程序发现', '联网应用'),
              ('Windows 当前联网程序，可直接加入分流', '识别当前联网应用，并为其设置出口策略'),
              ('项目规则', '应用规则'),
              ('项目分流', '应用分流'),
              ('程序分流', '应用分流'),
              ('项目连接', '规则连接'),
              ('添加档案', '创建应用规则'),
              ('保存档案', '保存应用规则'),
              ('编辑档案', '编辑应用规则'),
          ]
          cleanup = [
              ('应用或应用规则', '应用规则'),
              ('应用/应用规则', '应用规则'),
              ('应用规则档案', '应用规则'),
              ('应用规则应用规则', '应用规则'),
              ('应用规则规则', '应用规则'),
              ('应用规则分流', '应用分流'),
              ('应用规则连接', '规则连接'),
              ('连接应用规则', '应用规则'),
              ('应用发现', '联网应用'),
          ]

          for path in source_paths:
              text = load(path)
              if path.endswith('/model.ts'):
                  text = text.replace(
                      "`${project.kind === 'program' ? '程序' : '项目'} · ${project.name}`",
                      "`应用 · ${project.name}`",
                  )
              for old, new in phrases:
                  text = text.replace(old, new)
              text = text.replace('程序', '应用').replace('项目', '应用规则')
              for old, new in cleanup:
                  text = text.replace(old, new)
              save(path, text)

          project_panel_path = 'src/components/rule/diversion-manager/project-panel.tsx'
          text = load(project_panel_path)
          text = text.replace('  WorkspacesRounded,\n', '')
          text = text.replace('<WorkspacesRounded fontSize="small" />', '<AppsRounded fontSize="small" />')
          text = re.sub(
              r"\{project\.kind === 'program' \? \(\s*<AppsRounded fontSize=\"small\" />\s*\) : \(\s*<AppsRounded fontSize=\"small\" />\s*\)\}",
              '<AppsRounded fontSize="small" />',
              text,
          )
          text = text.replace(
              '一条应用规则对应一组识别条件和一个出口。',
              '按应用、域名、IP 或端口识别流量，并指定出口策略。',
          )
          text = text.replace(
              '从上方选择应用，或新建一个应用规则。',
              '从上方选择联网应用，或新建一条应用规则。',
          )
          save(project_panel_path, text)

          assistant_path = 'src/components/connection/connection-rule-assistant.tsx'
          text = load(assistant_path)
          text = text.replace('  WorkspacesRounded,\n', '')
          text = text.replace('<WorkspacesRounded />', '<AppsRounded />')
          text = text.replace('应用文件名', '应用名称')
          text = text.replace('完整应用路径', '应用完整路径')
          text = text.replace(
              '由连接详情创建，可继续补充同一应用规则使用的其他域名、IP 和端口。',
              '由连接详情创建，可继续补充此应用使用的域名、IP 和端口。',
          )
          save(assistant_path, text)

          detected_path = 'src/components/rule/diversion-manager/detected-programs-panel.tsx'
          text = load(detected_path)
          text = text.replace('系统应用', '联网应用').replace('创建应用规则规则', '创建应用规则')
          save(detected_path, text)

          action_picker_path = 'src/components/rule/diversion-manager/action-picker.tsx'
          save(
              action_picker_path,
              load(action_picker_path).replace(
                  '对应 Karing 服务器选择页中的测速组和自定义组。',
                  '选择现有代理组，或手动填写一个出口名称。',
              ),
          )

          docs_phrases = [
              ('程序/项目档案', '应用规则'),
              ('程序与项目', '应用分流'),
              ('程序项目', '应用规则'),
              ('程序或项目', '应用规则'),
              ('项目档案', '应用规则'),
              ('程序档案', '应用规则'),
              ('保存档案', '保存应用规则'),
              ('添加档案', '创建应用规则'),
              ('程序名称', '应用名称'),
              ('程序完整路径', '应用完整路径'),
              ('程序路径', '应用路径'),
              ('程序名', '应用名称'),
              ('程序发现', '联网应用'),
              ('项目卡片', '应用规则卡片'),
              ('项目指定代理组', '应用规则指定出口策略'),
              ('项目关联', '应用规则关联'),
              ('对应项目', '对应应用规则'),
              ('点击项目', '点击应用规则'),
          ]
          for path in ['README.md', 'THIRD_PARTY_NOTICES.md']:
              text = load(path)
              for old, new in docs_phrases:
                  text = text.replace(old, new)
              text = text.replace('程序', '应用')
              save(path, text)

          audit_paths = source_paths + [
              'src/components/connection/connection-detail.tsx',
              'src/components/routing/connection-project-card.tsx',
              'src/components/rule/diversion-manager/project-editor-dialog.tsx',
          ]
          banned = ['程序项目', '程序与项目', '程序或项目', '程序/项目', '项目档案', '程序档案', '添加档案', '保存档案', '程序发现']
          for path in audit_paths:
              text = load(path)
              for phrase in banned:
                  if phrase in text:
                      raise SystemExit(f'forbidden UI phrase {phrase!r} remains in {path}')
              for match in re.finditer(r"['\"`]([^'\"`\n]*(?:程序|项目)[^'\"`\n]*)['\"`]", text):
                  raise SystemExit(f'legacy visible term remains in {path}: {match.group(1)!r}')

          if 'useConnectionProcessAttribution' not in load(hook_path):
              raise SystemExit('live attribution hook missing')
          print('[ok] patch applied')
          PY

      - name: Format files
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec biome check --write src README.md THIRD_PARTY_NOTICES.md

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src README.md THIRD_PARTY_NOTICES.md
          git diff --cached --check
          git commit -m "refactor: mature application routing and live attribution"
          git push origin HEAD:feature/karing-style-diversion

      - name: Remove patch workflows
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout -B dev origin/dev
          rm -f .github/workflows/apply-application-routing-maturity-once.yml
          rm -f .github/workflows/apply-application-routing-maturity-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          git commit -m "chore: remove application routing patch workflows"
          git push origin dev
