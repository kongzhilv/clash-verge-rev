name: v20 Windows native ICS probe

on:
  push:
    branches:
      - fix/karing-windows-hotspot-ics-v20

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-ics-v20
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          components: rustfmt,clippy
      - name: Apply rustfmt before compile
        shell: pwsh
        run: |
          cargo fmt --all
          if (-not (git diff --quiet)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.rs'
            git diff --cached --check
            git commit -m 'style(v20): apply rustfmt to native ICS work'
            git push origin HEAD:fix/karing-windows-hotspot-ics-v20
          }
      - name: Compile Windows native code and capture diagnostics
        id: check
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo check -p clash-verge --features clippy 2>&1 | Tee-Object -FilePath v20-cargo-check.txt
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Publish exact compiler diagnostics to PR
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $code = '${{ steps.check.outputs.exit_code }}'
          $tail = Get-Content v20-cargo-check.txt -Tail 180 -ErrorAction SilentlyContinue
          @(
            '### v20 Windows native ICS compile probe',
            '',
            "Exit code: **$code**",
            '',
            '```text',
            $tail,
            '```'
          ) | Set-Content v20-pr-comment.md
          gh pr comment 12 --body-file v20-pr-comment.md
          if ($code -ne '0') { exit 1 }
