name: 启动 Karing 2.5.4 审查发行

on:
  schedule:
    - cron: '25 10 4 8 *'
    - cron: '40 10 4 8 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: launch-karing-v254-release
  cancel-in-progress: false

jobs:
  launch:
    name: 注册、派发并监督完整发行流水线
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 2fb7a8bc69ce59ba3d5770b848ae1135f2b4e976
      FEATURE_BRANCH: feature/karing-style-diversion
      RELEASE_TAG: v2.5.4-karing.6
      WORKFLOW_PATH: .github/workflows/karing-diagnostics-once.yml
      WORKFLOW_ID: karing-diagnostics-once.yml
      LAUNCHER_PATH: .github/workflows/launch-karing-v254-release.yml
      STATUS_MARKER: '<!-- karing-v254-launcher -->'
    steps:
      - name: 注册、派发、监督并核验正式发行
        shell: bash
        run: |
          set -euo pipefail

          update_comment() {
            local body="$1"
            local comment_id
            comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" --paginate \
              --jq ".[] | select(.body | contains(\"${STATUS_MARKER}\")) | .id" | head -n1 || true)
            if [ -n "$comment_id" ]; then
              jq -n --arg body "$body" '{body: $body}' | \
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input - >/dev/null
            else
              jq -n --arg body "$body" '{body: $body}' | \
                gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" --input - >/dev/null
            fi
          }

          validate_release() {
            local quiet="${1:-false}"
            local release_json target draft prerelease latest asset_count tag_sha
            if ! release_json=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json url,tagName,targetCommitish,isDraft,isPrerelease,isLatest,assets 2>/dev/null); then
              return 1
            fi
            target=$(jq -r '.targetCommitish' <<<"$release_json")
            draft=$(jq -r '.isDraft' <<<"$release_json")
            prerelease=$(jq -r '.isPrerelease' <<<"$release_json")
            latest=$(jq -r '.isLatest' <<<"$release_json")
            asset_count=$(jq '.assets | length' <<<"$release_json")
            tag_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/${RELEASE_TAG}" | awk '{print $1}')

            [ "$target" = "$EXPECTED_SHA" ] && \
              [ "$tag_sha" = "$EXPECTED_SHA" ] && \
              [ "$draft" = false ] && \
              [ "$prerelease" = false ] && \
              [ "$latest" = true ] && \
              [ "$asset_count" -eq 14 ] || return 1

            if [ "$quiet" != true ]; then
              mkdir -p release-audit
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern SHA256SUMS.txt --pattern BUILD_INFO.txt --dir release-audit
              grep -Fq "Commit: ${EXPECTED_SHA}" release-audit/BUILD_INFO.txt
              test "$(grep -cve '^$' release-audit/SHA256SUMS.txt)" -eq 12
              RELEASE_URL=$(jq -r '.url' <<<"$release_json")
            fi
            return 0
          }

          if validate_release true; then
            release_url=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')
            update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ✅ 目标 Release 已存在并通过快速校验

          - 最终候选：\`${EXPECTED_SHA}\`
          - Release：${release_url}
          - 标签：\`${RELEASE_TAG}\`
          - Release 资产：14 个"
            exit 0
          fi

          feature_ref=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('feature/karing-style-diversion', safe=''))
          PY
          )
          actual_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${feature_ref}" --jq '.object.sha')
          test "$actual_sha" = "$EXPECTED_SHA"

          source_json=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}?ref=${feature_ref}")
          source_content=$(jq -r '.content' <<<"$source_json" | tr -d '\n')
          test -n "$source_content"

          destination_json=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}?ref=dev" 2>/dev/null || true)
          destination_sha=$(jq -r '.sha // empty' <<<"${destination_json:-{}}")
          if [ -n "$destination_sha" ]; then
            jq -n \
              --arg message 'ci: register audited Karing 2.5.4 release workflow' \
              --arg content "$source_content" \
              --arg sha "$destination_sha" \
              --arg branch dev \
              '{message: $message, content: $content, sha: $sha, branch: $branch}' | \
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}" --input - >/dev/null
          else
            jq -n \
              --arg message 'ci: register audited Karing 2.5.4 release workflow' \
              --arg content "$source_content" \
              --arg branch dev \
              '{message: $message, content: $content, branch: $branch}' | \
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}" --input - >/dev/null
          fi

          for attempt in $(seq 1 60); do
            if gh workflow view "$WORKFLOW_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          gh workflow view "$WORKFLOW_ID" --repo "$GITHUB_REPOSITORY" >/dev/null

          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?branch=${feature_ref}&event=workflow_dispatch&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"${EXPECTED_SHA}\" and (.status == \"queued\" or .status == \"in_progress\")) | .id" | head -n1 || true)

          if [ -z "$run_id" ]; then
            gh workflow run "$WORKFLOW_ID" --repo "$GITHUB_REPOSITORY" --ref "$FEATURE_BRANCH"
            for attempt in $(seq 1 60); do
              run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?branch=${feature_ref}&event=workflow_dispatch&per_page=100" \
                --jq ".workflow_runs[] | select(.head_sha == \"${EXPECTED_SHA}\") | .id" | head -n1 || true)
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 5
            done
          fi
          test -n "$run_id"

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ⏳ 完整源码审查与 12 安装包构建已经启动

          - 最终候选：\`${EXPECTED_SHA}\`
          - 主发行运行：${run_url}
          - 预期标签：\`${RELEASE_TAG}\`"

          launcher_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${LAUNCHER_PATH}?ref=dev" --jq '.sha' || true)
          if [ -n "$launcher_sha" ]; then
            jq -n \
              --arg message 'chore: remove one-time Karing 2.5.4 release launcher' \
              --arg sha "$launcher_sha" \
              --arg branch dev \
              '{message: $message, sha: $sha, branch: $branch}' | \
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${LAUNCHER_PATH}" --input - >/dev/null
          fi

          status=''
          conclusion=''
          for attempt in $(seq 1 350); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
            if [ "$status" = completed ]; then
              break
            fi
            sleep 60
          done

          if [ "$status" != completed ]; then
            update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ❌ 主发行运行等待超时

          - 最终候选：\`${EXPECTED_SHA}\`
          - 主发行运行：${run_url}"
            exit 1
          fi

          if [ "$conclusion" != success ]; then
            failed_jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | (.name + ": " + (.conclusion // "unknown"))] | join("；")')
            update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ❌ 审查或构建失败

          - 最终候选：\`${EXPECTED_SHA}\`
          - 主发行运行：${run_url}
          - 失败作业：${failed_jobs:-未取得作业信息}"
            exit 1
          fi

          validate_release false

          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}?ref=dev" --jq '.sha' || true)
          if [ -n "$main_sha" ]; then
            jq -n \
              --arg message 'chore: remove completed Karing 2.5.4 release workflow' \
              --arg sha "$main_sha" \
              --arg branch dev \
              '{message: $message, sha: $sha, branch: $branch}' | \
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}" --input - >/dev/null
          fi

          update_comment "${STATUS_MARKER}
          ## Karing 2.5.4 发行状态

          ✅ 源码审查、12 安装包构建和正式发行全部完成

          - 最终候选：\`${EXPECTED_SHA}\`
          - 主发行运行：${run_url}
          - Release：${RELEASE_URL}
          - 标签：\`${RELEASE_TAG}\`，精确指向最终候选
          - Release 资产：14 个
          - SHA256 安装文件记录：12 条
          - Draft：否；Pre-release：否；Latest：是"