name: Karing 2.5.4 发行监视器

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  issues: write
  pull-requests: read

jobs:
  inspect:
    name: 查询最新候选审查状态
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/inspect-karing-v254-latest'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MARKER: '<!-- karing-v254-monitor -->'
      RELEASE_TAG: v2.5.4-karing.6
    steps:
      - name: 查询并回写主发行状态
        shell: bash
        run: |
          set -euo pipefail
          expected_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1" --jq '.head.sha')
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/karing-diagnostics-once.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"${expected_sha}\")" | head -n1 || true)

          if [ -z "$run_json" ]; then
            summary='尚未找到最新候选对应的主发行运行。'
          else
            run_id=$(jq -r '.id' <<<"$run_json")
            status=$(jq -r '.status' <<<"$run_json")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run_json")
            run_url=$(jq -r '.html_url' <<<"$run_json")
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '[.jobs[] | {id, name, status, conclusion, failed_steps: [.steps[]? | select(.conclusion == "failure") | .name]}]')
            failed_log=''
            if [ "$status" = completed ] && [ "$conclusion" != success ]; then
              failed_log=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 160 || true)
            fi
            summary=$(cat <<EOF
          - Run：${run_url}
          - Run ID：\`${run_id}\`
          - 状态：\`${status}\`
          - 结论：\`${conclusion:-尚未结束}\`

          **作业状态**

          \`\`\`json
          ${jobs}
          \`\`\`

          **失败日志尾部**

          \`\`\`text
          ${failed_log}
          \`\`\`
          EOF
          )
          fi

          release_summary='尚未发现目标 Release。'
          if release_json=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,targetCommitish,isDraft,isPrerelease,isLatest,assets 2>/dev/null); then
            release_summary=$(jq -r '"Release：" + .url + "；target=" + .targetCommitish + "；assets=" + ((.assets | length) | tostring) + "；draft=" + (.isDraft | tostring) + "；prerelease=" + (.isPrerelease | tostring) + "；latest=" + (.isLatest | tostring)' <<<"$release_json")
          fi

          body=$(cat <<EOF
          ${MARKER}
          ## Karing 2.5.4 最终候选实时状态

          - 候选：\`${expected_sha}\`
          - ${release_summary}
          ${summary}
          EOF
          )
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1 || true)
          if [ -n "$comment_id" ]; then
            jq -n --arg body "$body" '{body: $body}' | \
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input - >/dev/null
          else
            jq -n --arg body "$body" '{body: $body}' | \
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" --input - >/dev/null
          fi