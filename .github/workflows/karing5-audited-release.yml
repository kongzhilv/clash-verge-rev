name: Karing 5 固定候选审查与发行
run-name: 审查并发行 v2.5.3-karing.5 (88ab1f1)

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/karing5-audited-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  NODE_OPTIONS: --max_old_space_size=4096
  RELEASE_TAG: v2.5.3-karing.5
  CANDIDATE_SHA: 88ab1f14633fbf93ea87437ab7f465363b7f82a6

concurrency:
  group: karing5-fixed-candidate-release
  cancel-in-progress: false

jobs:
  review:
    name: 审查固定候选源码
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 检出固定候选
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 验证候选与版本
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          version=$(jq -r .version package.json)
          test "$commit" = "$CANDIDATE_SHA"
          test "$version" = '2.5.3'
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 运行诊断包回归
        run: node scripts/check-karing-process-attribution.mjs

      - name: 运行前端质量门禁
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm knip:report
          pnpm run web:build

      - name: 运行 Rust Clippy
        run: cargo clippy --workspace --all-targets --features clippy -- -D warnings

      - name: 审查应用分流、归因与界面职责
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          required = [
              ('实时详情订阅', 'src/components/connection/connection-detail.tsx', 'useConnectionData({ enabled: open })'),
              ('按连接 ID 跟随活动连接', 'src/components/connection/connection-detail.tsx', 'activeConnections.find'),
              ('技术详情折叠', 'src/components/connection/connection-detail.tsx', '技术详情'),
              ('单一分流入口', 'src/components/connection/connection-detail.tsx', '调整分流'),
              ('应用优先列表', 'src/components/connection/connection-row-item.tsx', 'identifiedApplication ? application : row.host'),
              ('应用规则流程', 'src/components/routing/connection-project-card.tsx', '应用规则'),
              ('当前出口流程', 'src/components/routing/connection-project-card.tsx', '当前出口'),
              ('本地端点归因', 'src/services/process-connections.ts', "'local-endpoint'"),
              ('短连接端点归因', 'src/services/process-connections.ts', "'recent-local-endpoint'"),
              ('短连接 TTL', 'src/services/process-connections.ts', 'RECENT_ENDPOINT_TTL_MS'),
              ('有界归因存储', 'src/services/process-connections.ts', 'MAX_ATTRIBUTION_ITEMS'),
              ('新连接快速采样', 'src/hooks/use-connection-data.ts', 'PROCESS_CONNECTION_NEW_DELAY_MS'),
              ('新连接二次采样', 'src/hooks/use-connection-data.ts', 'PROCESS_CONNECTION_RETRY_DELAY_MS'),
              ('活动连接原生补全', 'src/hooks/use-connection-data.ts', 'activeConnections = enrichConnectionsWithProcesses'),
              ('Fake-IP 规则保护', 'src/components/connection/connection-rule-assistant.tsx', 'isMihomoFakeIp'),
              ('TCP 所属 PID API', 'src-tauri/src/cmd/process_connections.rs', 'GetExtendedTcpTable'),
              ('UDP 所属 PID API', 'src-tauri/src/cmd/process_connections.rs', 'GetExtendedUdpTable'),
              ('程序完整路径 API', 'src-tauri/src/cmd/process_connections.rs', 'QueryFullProcessImageNameW'),
              ('后端原生分发', 'src-tauri/src/cmd/network.rs', 'process_connections::get_process_connections()'),
          ]
          for label, path, needle in required:
              text = Path(path).read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'[失败] {label}: {needle!r} missing from {path}')
              print(f'[通过] {label}')

          route = Path('src/components/routing/connection-project-card.tsx').read_text(encoding='utf-8')
          for forbidden in ('useNavigate', '<Button', 'Windows TUN', '精确识别', '源端口识别'):
              if forbidden in route:
                  raise SystemExit(f'[失败] 普通路由摘要仍含 {forbidden!r}')

          roots = [
              Path('src/components/connection'),
              Path('src/components/routing'),
              Path('src/components/rule/diversion-manager'),
              Path('src/pages'),
          ]
          forbidden_ui = [
              'Mihomo 进程元数据',
              '未返回程序信息',
              '程序项目',
              '项目档案',
              '程序档案',
          ]
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for value in forbidden_ui:
                      if value in text:
                          raise SystemExit(f'[失败] 旧界面术语 {value!r} in {path}')
          print('[通过] 普通界面只呈现应用、规则、出口和单一分流操作')
          PY

  build:
    name: 构建 ${{ matrix.name }}
    needs: review
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            kind: desktop
          - id: windows-arm64
            name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            kind: desktop
          - id: windows-fixed-x64
            name: Windows fixed WebView2 x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            kind: fixed
            webview_arch: x64
          - id: windows-fixed-arm64
            name: Windows fixed WebView2 ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            kind: fixed
            webview_arch: arm64
          - id: macos-arm64
            name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            kind: desktop
          - id: macos-x64
            name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            kind: desktop
          - id: linux-x64
            name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            kind: desktop
          - id: linux-arm64
            name: Linux ARM64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux
            kind: cross
            deb_arch: arm64
          - id: linux-armv7
            name: Linux ARMv7
            os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            platform: linux
            kind: cross
            deb_arch: armhf
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出固定候选
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: 安装 Rust 目标
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: ${{ matrix.target }}

      - name: 安装 Linux x64 依赖
        if: matrix.platform == 'linux' && matrix.kind == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: 配置 Linux ARM 多架构源
        if: matrix.kind == 'cross'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sources.list <<'EOF'
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF
          if [ -f /etc/apt/sources.list ]; then
            sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          fi
          sudo mv /tmp/sources.list /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.deb_arch }}
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1:${{ matrix.deb_arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.deb_arch }} \
            libayatana-appindicator3-dev:${{ matrix.deb_arch }} \
            libssl-dev:${{ matrix.deb_arch }} \
            librsvg2-dev:${{ matrix.deb_arch }} \
            patchelf

      - name: 安装 Linux ARM 交叉编译器
        if: matrix.kind == 'cross'
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.target }}' = 'aarch64-unknown-linux-gnu' ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
            echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
            echo 'CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/' >> "$GITHUB_ENV"
          else
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"
            echo 'CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"
            echo 'CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig/' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/' >> "$GITHUB_ENV"
          fi
          echo 'PKG_CONFIG_ALLOW_CROSS=1' >> "$GITHUB_ENV"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 构建匹配服务
        run: node scripts/build-matching-service.mjs ${{ matrix.target }}

      - name: 准备 Mihomo 与运行资源
        run: pnpm run prebuild ${{ matrix.target }}

      - name: 下载固定 WebView2 运行库
        if: matrix.kind == 'fixed'
        shell: pwsh
        run: |
          $version = '133.0.3065.92'
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$version.${{ matrix.webview_arch }}.cab"
          Invoke-WebRequest -Uri "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/$cab" -OutFile $cab
          Expand.exe $cab -F:* ./src-tauri
          Remove-Item ./src-tauri/tauri.windows.conf.json
          Rename-Item ./src-tauri/webview2.${{ matrix.webview_arch }}.json tauri.windows.conf.json

      - name: 生成无更新签名配置
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .ci/tauri-release.conf.json

      - name: 构建桌面安装包
        run: pnpm tauri build --target ${{ matrix.target }} --config .ci/tauri-release.conf.json

      - name: 重命名固定 WebView2 安装包
        if: matrix.kind == 'fixed'
        shell: pwsh
        run: |
          $files = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe"
          if (-not $files) { throw 'No fixed WebView2 installer was produced' }
          foreach ($file in $files) {
            $newName = $file.Name -replace '-setup\.exe$', '_fixed_webview2-setup.exe'
            Rename-Item $file.FullName $newName
          }

      - name: 收集 Windows 安装包
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bundle/nsis/*.exe" dist/

      - name: 收集 macOS 镜像
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/

      - name: 收集 Linux 安装包
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb dist/
          cp target/${{ matrix.target }}/release/bundle/rpm/*.rpm dist/

      - name: 上传平台安装包
        uses: actions/upload-artifact@v7
        with:
          name: karing5-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package-release:
    name: 汇总并验证 12 个安装文件
    needs:
      - review
      - build
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v8
        with:
          pattern: karing5-*
          path: downloaded-assets
          merge-multiple: true

      - name: 校验并整理发行资产
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-assets -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            -exec cp '{}' release-assets/ \;

          installer_count=$(find release-assets -maxdepth 1 -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            | wc -l)
          if [ "$installer_count" -ne 12 ]; then
            echo "[失败] 应有 12 个安装文件，实际为 $installer_count 个"
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          (
            cd release-assets
            sha256sum *.exe *.dmg *.deb *.rpm > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

          cat > release-assets/BUILD_INFO.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${{ needs.review.outputs.commit }}
          Version: ${{ needs.review.outputs.version }}
          Release tag: ${RELEASE_TAG}
          Platforms: Windows x64/ARM64, macOS Intel/Apple Silicon, Linux x64/ARM64/ARMv7
          Installers: 12
          Signing: unsigned fork build; no upstream Apple notarization or updater signature
          Android: intentionally not included
          EOF

          cat > release-assets/release-notes.md <<EOF
          # Clash Verge Rev Karing v2.5.3-karing.5

          本版本继续把连接页收敛为面向用户的应用分流视图，同时保留可展开的技术诊断。

          ## 应用优先连接视图
          - 识别到应用时，以应用名称作为连接主标题，目标域名或 IP 作为次要信息
          - 普通视图只显示应用、应用规则和当前出口
          - 删除路由摘要中的重复编辑与跳转按钮，统一使用“调整分流”入口
          - 断开连接降为次级危险操作，减少误触和视觉干扰
          - PID、程序路径、原始命中规则、完整出口链和识别原因继续收进技术详情

          ## TUN / Fake-IP 归因回归
          - 固化用户诊断包中的 IPv6 Fake-IP TCP 本地端点场景
          - 固化 UDP 地址变化后按唯一源端口归因的场景
          - 同一端口存在多个应用候选时继续停止猜测
          - 已打开的详情持续按连接 ID 获取最新流量和归因结果

          ## 安装包
          - Windows x64 与 ARM64
          - Windows x64 与 ARM64 固定 WebView2 版本
          - macOS Apple Silicon 与 Intel
          - Linux x64、ARM64 与 ARMv7 的 DEB/RPM

          本分支安装包没有上游官方签名或 Apple 公证，请使用 SHA256SUMS.txt 校验下载文件。

          Commit: ${{ needs.review.outputs.commit }}
          EOF

          echo '[通过] 12 个安装文件与 SHA256 已验证'
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 上传已审查的完整发行资产
        uses: actions/upload-artifact@v7
        with:
          name: karing5-release-assets
          path: release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    name: 发布并验证 v2.5.3-karing.5
    needs:
      - review
      - package-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载已审查资产
        uses: actions/download-artifact@v8
        with:
          name: karing5-release-assets
          path: release-assets

      - name: 发布并复核 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_commit='${{ needs.review.outputs.commit }}'

          installer_count=$(find release-assets -maxdepth 1 -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            | wc -l)
          test "$installer_count" -eq 12
          test -f release-assets/SHA256SUMS.txt
          test -f release-assets/BUILD_INFO.txt
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" \
            release-assets/*.exe \
            release-assets/*.dmg \
            release-assets/*.deb \
            release-assets/*.rpm \
            release-assets/SHA256SUMS.txt \
            release-assets/BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$expected_commit" \
            --title 'Clash Verge Rev Karing v2.5.3-karing.5' \
            --notes-file release-assets/release-notes.md \
            --latest

          release_json=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isDraft,isPrerelease,targetCommitish,assets)
          asset_count=$(jq '.assets | length' <<< "$release_json")
          installer_assets=$(jq '[.assets[].name | select(test("\\.(exe|dmg|deb|rpm)$"; "i"))] | length' <<< "$release_json")
          metadata_assets=$(jq '[.assets[].name | select(. == "SHA256SUMS.txt" or . == "BUILD_INFO.txt")] | length' <<< "$release_json")
          test "$asset_count" -eq 14
          test "$installer_assets" -eq 12
          test "$metadata_assets" -eq 2
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$expected_commit" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and .targetCommitish == $commit' \
            <<< "$release_json" >/dev/null

          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_sha" = "$expected_commit"
          echo '[通过] Release 标签、最终提交与 14 个资产完全一致'
          jq '{url, tagName, targetCommitish, assets: [.assets[].name]}' <<< "$release_json"

  report:
    name: 回报最终审查与发行状态
    if: always()
    needs:
      - review
      - build
      - package-release
      - publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: 更新 PR 状态
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ needs.review.result }}
          BUILD: ${{ needs.build.result }}
          PACKAGE: ${{ needs.package-release.result }}
          RELEASE: ${{ needs.publish-release.result }}
        shell: bash
        run: |
          set -euo pipefail
          status='❌ v2.5.3-karing.5 发行未完成'
          if [ "$REVIEW" = success ] && \
             [ "$BUILD" = success ] && \
             [ "$PACKAGE" = success ] && \
             [ "$RELEASE" = success ]; then
            status='✅ v2.5.3-karing.5 正式发行成功'
          fi

          cat > /tmp/release-status.md <<EOF
          <!-- karing5-release-status -->
          ## Karing 5 最终审查与发行状态

          ${status}

          - 固定候选：${CANDIDATE_SHA}
          - Action：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 源码、Fake-IP 回归与 Rust 审查：${REVIEW}
          - 九个平台任务 / 12 个安装文件：${BUILD}
          - 汇总与 SHA256：${PACKAGE}
          - Release 与 14 资产验证：${RELEASE}
          - Release：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}
          EOF
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/release-status.md

  cleanup:
    name: 清理一次性发行文件
    if: needs.publish-release.result == 'success'
    needs:
      - publish-release
      - report
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 删除一次性 workflow 与状态文件
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          delete_path() {
            local path="$1"
            local sha
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=dev" --jq '.sha' 2>/dev/null || true)
            if [ -z "$sha" ]; then
              return
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="chore: remove $path after Karing 5 release" \
              -f sha="$sha" \
              -f branch=dev >/dev/null
          }
          delete_path '.ci/karing5-format-review-status.json'
          delete_path '.github/workflows/karing5-format-review-once.yml'
          delete_path '.github/workflows/karing5-audited-release.yml'
