name: Patch staged release pipeline once

on:
  push:
    branches:
      - fix/mihomo-control-readiness
    paths:
      - '.github/temporary/patch_release_pipeline.py'
      - '.github/workflows/patch-release-pipeline-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mihomo-control-readiness
          fetch-depth: 0
      - name: Apply permanent release-pipeline patch
        run: python3 .github/temporary/patch_release_pipeline.py
      - name: Validate YAML text and diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/karing-diagnostics-once.yml').read_text(encoding='utf-8')
          required = [
              '.release/karing-release-tag.txt',
              'release_tag: ${{ steps.meta.outputs.release_tag }}',
              'MIHOMO_CONTROL_MAX_ATTEMPTS',
              'control-read-retry',
              'ui-get-clash-mode',
              'RELEASE_TAG: ${{ needs.review.outputs.release_tag }}',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'missing expected release pipeline marker: {item}')
          if 'RELEASE_TAG: v2.5.4-karing.11' in text:
              raise SystemExit('stale hardcoded release tag remains')
          PY
          git diff --check
          git diff -- .github/workflows/karing-diagnostics-once.yml
      - name: Commit permanent workflow change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/karing-diagnostics-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'ci: stage Karing release tag from repository state'
          git pull --rebase origin fix/mihomo-control-readiness
          git push origin HEAD:fix/mihomo-control-readiness
