name: Karing v22 final release-candidate normalization

on:
  push:
    branches:
      - fix/karing-windows-hotspot-v22
    paths:
      - '.github/workflows/karing-v22-finalize.yml'

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-v22
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collapse to one persistent WinRT hotspot controller
        shell: bash
        run: |
          set -euo pipefail
          git checkout 48ade4fc3ac51e75a99764783f1d98bf4f332058 -- src-tauri/src/core/manager/mod.rs src-tauri/src/feat/window.rs
          rm -f src-tauri/src/core/windows_hotspot_winrt.rs
          python <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # The persistent-snapshot implementation is the only hotspot mutator.
          p = Path('src-tauri/src/core/mod.rs')
          text = p.read_text(encoding='utf-8')
          text = text.replace('#[cfg(target_os = "windows")]\npub mod windows_hotspot_winrt;\n', '')
          if 'pub mod windows_hotspot_ics;' not in text:
              anchor = '#[cfg(target_os = "windows")]\npub mod windows_deep_network_diagnostics;\n'
              text = text.replace(anchor, anchor + '#[cfg(target_os = "windows")]\npub mod windows_hotspot_ics;\n')
          p.write_text(text, encoding='utf-8')

          hotspot = 'src-tauri/src/core/windows_hotspot_ics.rs'
          replace_exact(
              hotspot,
              '''    if state == TetheringOperationalState::InTransition {\n        return Ok("hotspot-transition-no-action");\n    }\n\n    let original = find_original_public_profile(&items, tun.guid)?;''',
              '''    if state == TetheringOperationalState::InTransition {\n        return Ok("hotspot-transition-no-action");\n    }\n    if state != TetheringOperationalState::On {\n        diagnostics::warn(\n            "windows-hotspot-winrt",\n            "hotspot-operational-state-unknown",\n            json!({\n                "operational_state": format!("{state:?}"),\n                "action": "fail-closed-preserve-current-hotspot",\n            }),\n        );\n        return Ok("hotspot-unknown-no-action");\n    }\n\n    let original = find_original_public_profile(&items, tun.guid)?;'''
          )

          manifest = Path('src-tauri/Cargo.toml')
          text = manifest.read_text(encoding='utf-8').replace('  "Win32_System_WinRT",\n', '')
          manifest.write_text(text, encoding='utf-8')

          gate = Path('scripts/check-windows-hotspot-v22.mjs')
          text = gate.read_text(encoding='utf-8')
          marker = "  'TetheringOperationalState::On',\n"
          if "  'hotspot-operational-state-unknown',\n" not in text:
              if marker not in text:
                  raise SystemExit('v22 gate On marker missing')
              text = text.replace(marker, marker + "  'hotspot-operational-state-unknown',\n  'hotspot-unknown-no-action',\n")
          gate.write_text(text, encoding='utf-8')

          main = '.github/workflows/karing-diagnostics-once.yml'
          replace_exact(main, '运行 Windows Mobile Hotspot v20 安全回归', '运行 Windows Mobile Hotspot v22 WinRT 安全回归')
          replace_exact(main, 'node scripts/check-windows-hotspot-v20.mjs', 'node scripts/check-windows-hotspot-v22.mjs')
          replace_exact(
              main,
              '          WFP semantics: ipv6:false blocks non-loopback IPv6 while preserving IPv6 loopback traffic\n',
              '          WFP semantics: ipv6:false blocks non-loopback IPv6 while preserving IPv6 loopback traffic\n          Windows Mobile Hotspot: WinRT NetworkOperatorTetheringManager / CreateFromConnectionProfile(Mihomo)\n'
          )
          replace_exact(
              main,
              '          本版针对 Windows 上 `ipv6:false` + StrictRoute/TUN 场景下的 IPv6 loopback 回归做根因修复。',
              '          本版在保留 `.21` IPv6 loopback WFP 根因修复的基础上，把 Windows Mobile Hotspot + Mihomo TUN 的上游绑定迁移到 WinRT 原生 tethering 控制面。'
          )
          replace_exact(
              main,
              '          - `.20` 已验证的原生 ICS topology lease、Windows TUN route guard、managed physical interface lease、完整网络诊断与其他旧回归全部继续保留，本版不撤销这些防线。',
              '          - `.22` 移除 Mobile Hotspot 主路径对经典 HNetCfg `EnableSharing/DisableSharing` 的依赖，改为 `NetworkOperatorTetheringManager::CreateFromConnectionProfile(Mihomo)`；先持久化原 public profile，再执行 Stop → Start，失败和退出均精确恢复原热点上游。\n          - 热点关闭、profile/GUID 识别歧义和未知 operational state 都采用 fail-closed；用户主动关闭热点不会被后台强制重新开启。\n          - `.20/.21` 已验证的 Windows TUN route guard、managed physical interface lease、完整网络诊断与 WFP loopback 修复继续保留；仅替换过时的热点 HNetCfg 写控制路径。'
          )
          replace_exact(
              main,
              'Clash Verge Rev Karing v${{ needs.review.outputs.version }} · Windows IPv6 Loopback WFP Fix',
              'Clash Verge Rev Karing v${{ needs.review.outputs.version }} · Windows Hotspot WinRT + IPv6 WFP'
          )

          Path('.release/karing-release-tag.txt').write_text('v2.5.4-karing.22\n', encoding='utf-8')

          observer = '.github/workflows/karing-release-observer.yml'
          replace_exact(observer, 'name: Karing .21 发行核验', 'name: Karing .22 发行核验')
          replace_exact(observer, 'name: 核验 v2.5.4-karing.21 正式发行', 'name: 核验 v2.5.4-karing.22 正式发行')
          replace_exact(observer, "PR_NUMBER: '13'", "PR_NUMBER: '15'")
          replace_exact(observer, "STATUS_MARKER: '<!-- karing-v254-karing21-release-audit -->'", "STATUS_MARKER: '<!-- karing-v254-karing22-release-audit -->'")
          replace_exact(observer, "test \"$release_tag\" = 'v2.5.4-karing.21'", "test \"$release_tag\" = 'v2.5.4-karing.22'")

          wfp = Path('.github/workflows/karing-windows-wfp-v21.yml')
          text = wfp.read_text(encoding='utf-8')
          marker = "      - '.release/karing-windows-mihomo-v21.json'"
          if "      - '.release/karing-release-tag.txt'" not in text:
              if marker not in text:
                  raise SystemExit('WFP release metadata marker missing')
              text = text.replace(marker, marker + "\n      - '.release/karing-release-tag.txt'")
              wfp.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary authoring workflows
        shell: bash
        run: |
          rm -f .github/workflows/karing-v22-autofmt.yml
          rm -f .github/workflows/karing-v22-release-prep.yml
          rm -f .github/workflows/karing-v22-finalize.yml
      - name: Normalize final candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
          pnpm exec biome format --write \
            scripts/check-windows-hotspot-v22.mjs \
            .github/workflows/karing-windows-hotspot-v22.yml \
            .github/workflows/karing-diagnostics-once.yml \
            .github/workflows/karing-release-observer.yml \
            .github/workflows/karing-windows-wfp-v21.yml
      - name: Run release-critical static gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-windows-hotspot-v22.mjs
          node scripts/check-windows-tun-safety.mjs
          node scripts/check-windows-wfp-v21.mjs
          grep -Fqx 'v2.5.4-karing.22' .release/karing-release-tag.txt
          test ! -e src-tauri/src/core/windows_hotspot_winrt.rs
          ! grep -Fq 'windows_hotspot_winrt' src-tauri/src/core/mod.rs
          ! grep -Fq 'windows_hotspot_winrt' src-tauri/src/core/manager/mod.rs
          ! grep -Fq 'windows_hotspot_winrt' src-tauri/src/feat/window.rs
          grep -Fq 'windows_hotspot_ics::ensure_monitor_running' src-tauri/src/core/manager/mod.rs
          grep -Fq 'windows_hotspot_ics::restore_now("shutdown")' src-tauri/src/feat/window.rs
          grep -Fq 'hotspot-operational-state-unknown' src-tauri/src/core/windows_hotspot_ics.rs
          ! grep -Fq 'check-windows-hotspot-v20.mjs' .github/workflows/karing-diagnostics-once.yml
          grep -Fq 'check-windows-hotspot-v22.mjs' .github/workflows/karing-diagnostics-once.yml
          grep -Fq "PR_NUMBER: '15'" .github/workflows/karing-release-observer.yml
          grep -Fq 'v2.5.4-karing.22' .github/workflows/karing-release-observer.yml
      - name: Commit final release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes needed.'
            exit 0
          fi
          git commit -m 'chore(release): finalize karing.22 WinRT hotspot candidate'
          git push origin HEAD:fix/karing-windows-hotspot-v22