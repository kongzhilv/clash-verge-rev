name: Karing v22 final release-candidate normalization

on:
  push:
    branches:
      - fix/karing-windows-hotspot-v22
    paths:
      - '.github/workflows/karing-v22-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HUSKY: 0

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-v22
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden persistent WinRT hotspot controller and release gates
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          hotspot = Path('src-tauri/src/core/windows_hotspot_ics.rs')
          text = hotspot.read_text(encoding='utf-8')

          old_import = '        System::Com::{COINIT_MULTITHREADED, CoInitializeEx, CoUninitialize},\n'
          new_import = '        System::WinRT::{RO_INIT_MULTITHREADED, RoInitialize, RoUninitialize},\n'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('hotspot controller: WinRT apartment import anchor missing')

          old_apartment = '''struct ComApartment;\n\nimpl ComApartment {\n    fn init() -> Result<Self> {\n        unsafe { CoInitializeEx(None, COINIT_MULTITHREADED) }\n            .ok()\n            .context("CoInitializeEx(COINIT_MULTITHREADED) failed")?;\n        Ok(Self)\n    }\n}\n\nimpl Drop for ComApartment {\n    fn drop(&mut self) {\n        unsafe { CoUninitialize() };\n    }\n}\n'''
          new_apartment = '''struct WinRtApartment;\n\nimpl WinRtApartment {\n    fn init() -> Result<Self> {\n        unsafe { RoInitialize(RO_INIT_MULTITHREADED) }\n            .context("RoInitialize(RO_INIT_MULTITHREADED) failed")?;\n        Ok(Self)\n    }\n}\n\nimpl Drop for WinRtApartment {\n    fn drop(&mut self) {\n        unsafe { RoUninitialize() };\n    }\n}\n'''
          if old_apartment in text:
              text = text.replace(old_apartment, new_apartment, 1)
          elif new_apartment not in text:
              raise SystemExit('hotspot controller: apartment implementation anchor missing')
          text = text.replace('ComApartment::init()', 'WinRtApartment::init()')

          in_transition = '''    if state == TetheringOperationalState::InTransition {\n        return Ok("hotspot-transition-no-action");\n    }\n'''
          unknown_guard = '''    if state != TetheringOperationalState::On {\n        diagnostics::warn(\n            "windows-hotspot-winrt",\n            "hotspot-operational-state-unknown",\n            json!({\n                "operational_state": format!("{state:?}"),\n                "action": "fail-closed-preserve-current-hotspot",\n            }),\n        );\n        return Ok("hotspot-unknown-no-action");\n    }\n'''
          if 'hotspot-operational-state-unknown' not in text:
              if in_transition not in text:
                  raise SystemExit('hotspot controller: InTransition anchor missing')
              text = text.replace(in_transition, in_transition + unknown_guard, 1)

          old_probe = '''fn active_snapshot_state(snapshot: &SavedTetheringState) -> Result<TetheringOperationalState> {\n    let _apartment = WinRtApartment::init()?;\n    let items = profiles()?;\n    let Some(tun_profile) = find_profile_by_saved_guid(&items, &snapshot.tun_guid)? else {\n        return Ok(TetheringOperationalState::Off);\n    };\n    Ok(manager_for(&tun_profile)?.TetheringOperationalState()?)\n}\n'''
          new_probe = '''fn active_snapshot_state(snapshot: &SavedTetheringState) -> Result<Option<TetheringOperationalState>> {\n    let _apartment = WinRtApartment::init()?;\n    let items = profiles()?;\n    let Some(tun_profile) = find_profile_by_saved_guid(&items, &snapshot.tun_guid)? else {\n        return Ok(None);\n    };\n    Ok(Some(manager_for(&tun_profile)?.TetheringOperationalState()?))\n}\n'''
          if old_probe in text:
              text = text.replace(old_probe, new_probe, 1)
          elif new_probe not in text:
              raise SystemExit('hotspot controller: active snapshot probe anchor missing')

          old_reconcile = '''        let state = active_snapshot_state(&snapshot)?;\n        if state == TetheringOperationalState::Off {\n            // Respect a user turning Mobile Hotspot off while TUN is still enabled.\n            // Clearing the snapshot prevents the monitor from immediately turning it\n            // back on. If the user later turns Hotspot on again, the next stable\n            // window will establish a fresh Mihomo-backed session.\n            remove_snapshot(path)?;\n            diagnostics::info(\n                "windows-hotspot-winrt",\n                "lease-cleared-user-hotspot-off",\n                json!({\n                    "hotspot_restarted": false,\n                    "user_intent_preserved": true,\n                }),\n            );\n            return Ok("lease-cleared-user-hotspot-off");\n        }\n        return Ok("lease-already-active");\n'''
          new_reconcile = '''        let Some(state) = active_snapshot_state(&snapshot)? else {\n            // A persisted lease can outlive the Mihomo adapter after a crash/restart.\n            // Missing TUN profile is not evidence that the user disabled Mobile Hotspot;\n            // restore the original physical source while recovery metadata is intact.\n            restore_snapshot_unlocked(path, &snapshot)?;\n            diagnostics::info(\n                "windows-hotspot-winrt",\n                "lease-restored-missing-tun-profile",\n                json!({\n                    "tun_guid": snapshot.tun_guid,\n                    "original_public_guid": snapshot.original_public_guid,\n                    "recovery_reason": "persisted-tun-profile-missing",\n                }),\n            );\n            return Ok("lease-restored-missing-tun-profile");\n        };\n        if state == TetheringOperationalState::Off {\n            // Only an explicit Off state from the saved TUN-backed manager is treated\n            // as user intent. Missing/unknown profile state keeps or restores the lease.\n            remove_snapshot(path)?;\n            diagnostics::info(\n                "windows-hotspot-winrt",\n                "lease-cleared-user-hotspot-off",\n                json!({\n                    "hotspot_restarted": false,\n                    "user_intent_preserved": true,\n                }),\n            );\n            return Ok("lease-cleared-user-hotspot-off");\n        }\n        if state == TetheringOperationalState::Unknown {\n            diagnostics::warn(\n                "windows-hotspot-winrt",\n                "active-lease-operational-state-unknown",\n                json!({\n                    "action": "fail-closed-preserve-persistent-lease",\n                    "snapshot_file_present": true,\n                }),\n            );\n            return Ok("lease-unknown-preserved");\n        }\n        return Ok("lease-already-active");\n'''
          if old_reconcile in text:
              text = text.replace(old_reconcile, new_reconcile, 1)
          elif 'lease-restored-missing-tun-profile' not in text:
              raise SystemExit('hotspot controller: reconcile persisted lease anchor missing')

          hotspot.write_text(text, encoding='utf-8')

          core_mod = Path('src-tauri/src/core/mod.rs')
          text = core_mod.read_text(encoding='utf-8')
          text = text.replace('#[cfg(target_os = "windows")]\npub mod windows_hotspot_winrt;\n', '')
          if 'pub mod windows_hotspot_ics;' not in text:
              anchor = '#[cfg(target_os = "windows")]\npub mod windows_deep_network_diagnostics;\n'
              if anchor not in text:
                  raise SystemExit('core/mod.rs: Windows diagnostics anchor missing')
              text = text.replace(anchor, anchor + '#[cfg(target_os = "windows")]\npub mod windows_hotspot_ics;\n')
          core_mod.write_text(text, encoding='utf-8')

          manifest = Path('src-tauri/Cargo.toml')
          text = manifest.read_text(encoding='utf-8')
          if '  "Win32_System_WinRT",\n' not in text:
              anchor = '  "Win32_System_Threading",\n'
              if anchor not in text:
                  raise SystemExit('Cargo.toml: Win32_System_Threading feature anchor missing')
              text = text.replace(anchor, anchor + '  "Win32_System_WinRT",\n', 1)
          manifest.write_text(text, encoding='utf-8')

          gate = Path('scripts/check-windows-hotspot-v22.mjs')
          text = gate.read_text(encoding='utf-8')
          if "workflow: '.github/workflows/karing-windows-hotspot-v22.yml'" not in text:
              text = text.replace(
                  "  manifest: 'src-tauri/Cargo.toml',\n",
                  "  manifest: 'src-tauri/Cargo.toml',\n  workflow: '.github/workflows/karing-windows-hotspot-v22.yml',\n",
                  1,
              )
          marker = "  'TetheringOperationalState::On',\n"
          additions = [
              "  'hotspot-operational-state-unknown',\n",
              "  'hotspot-unknown-no-action',\n",
              "  'lease-restored-missing-tun-profile',\n",
              "  'active-lease-operational-state-unknown',\n",
              "  'RoInitialize(RO_INIT_MULTITHREADED)',\n",
              "  'RoUninitialize()',\n",
              "  'fn windows_hotspot_guid_normalization_ignores_braces_case_and_space',\n",
              "  'fn windows_hotspot_saved_guid_matches_native_guid',\n",
              "  'fn windows_hotspot_snapshot_v22_preserves_original_public_and_user_state',\n",
          ]
          for addition in additions:
              if addition.strip() not in text:
                  if marker not in text:
                      raise SystemExit('v22 gate On marker missing')
                  text = text.replace(marker, marker + addition, 1)
          forbidden_anchor = "  'std::process::Command',\n"
          for forbidden in ["  'CoInitializeEx',\n", "  'CoUninitialize',\n"]:
              if forbidden.strip() not in text:
                  if forbidden_anchor not in text:
                      raise SystemExit('v22 gate forbidden marker anchor missing')
                  text = text.replace(forbidden_anchor, forbidden_anchor + forbidden, 1)
          feature_anchor = "  '\"Win32_System_Com\"',\n"
          if "  '\"Win32_System_WinRT\"',\n" not in text:
              if feature_anchor not in text:
                  raise SystemExit('v22 gate Win32_System_Com feature anchor missing')
              text = text.replace(feature_anchor, feature_anchor + "  '\"Win32_System_WinRT\"',\n", 1)
          if "requireText(\n  'workflow',\n  'cargo test --target x86_64-pc-windows-msvc --lib windows_hotspot_ --all-features'," not in text:
              text += '''\nrequireText(\n  'workflow',\n  'cargo test --target x86_64-pc-windows-msvc --lib windows_hotspot_ --all-features',\n  'Windows unit regression filter must execute the concrete hotspot tests',\n)\n'''
          gate.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/karing-windows-hotspot-v22.yml')
          text = workflow.read_text(encoding='utf-8')
          old_test = 'cargo test --target x86_64-pc-windows-msvc --lib physical_profile_score_prefers_real_internet_access --all-features'
          new_test = 'cargo test --target x86_64-pc-windows-msvc --lib windows_hotspot_ --all-features -- --nocapture'
          if old_test in text:
              text = text.replace(old_test, new_test, 1)
          elif new_test not in text:
              raise SystemExit('v22 workflow: unit-test command anchor missing')
          workflow.write_text(text, encoding='utf-8')

          main = Path('.github/workflows/karing-diagnostics-once.yml')
          text = main.read_text(encoding='utf-8')
          replacements = [
              ('运行 Windows Mobile Hotspot v20 安全回归', '运行 Windows Mobile Hotspot v22 WinRT 安全回归'),
              ('node scripts/check-windows-hotspot-v20.mjs', 'node scripts/check-windows-hotspot-v22.mjs'),
              ('Clash Verge Rev Karing v${{ needs.review.outputs.version }} · Windows IPv6 Loopback WFP Fix', 'Clash Verge Rev Karing v${{ needs.review.outputs.version }} · Windows Hotspot WinRT + IPv6 WFP'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          wfp_line = '          WFP semantics: ipv6:false blocks non-loopback IPv6 while preserving IPv6 loopback traffic\n'
          hotspot_line = '          Windows Mobile Hotspot: WinRT NetworkOperatorTetheringManager / CreateFromConnectionProfile(Mihomo)\n'
          if hotspot_line not in text:
              if wfp_line not in text:
                  raise SystemExit('main release workflow: WFP summary anchor missing')
              text = text.replace(wfp_line, wfp_line + hotspot_line, 1)
          old_intro = '          本版针对 Windows 上 `ipv6:false` + StrictRoute/TUN 场景下的 IPv6 loopback 回归做根因修复。'
          new_intro = '          本版在保留 `.21` IPv6 loopback WFP 根因修复的基础上，把 Windows Mobile Hotspot + Mihomo TUN 的上游绑定迁移到 WinRT 原生 tethering 控制面。'
          if old_intro in text:
              text = text.replace(old_intro, new_intro, 1)
          old_bullet = '          - `.20` 已验证的原生 ICS topology lease、Windows TUN route guard、managed physical interface lease、完整网络诊断与其他旧回归全部继续保留，本版不撤销这些防线。'
          new_bullet = '          - `.22` 移除 Mobile Hotspot 主路径对经典 HNetCfg `EnableSharing/DisableSharing` 的依赖，改为 `NetworkOperatorTetheringManager::CreateFromConnectionProfile(Mihomo)`；先持久化原 public profile，再执行 Stop → Start，失败、关闭 TUN、退出及崩溃后的缺失 TUN profile 都会恢复原热点上游。\n          - 热点关闭、profile/GUID 识别歧义和未知 operational state 都采用 fail-closed；只有明确读到 Hotspot=Off 才视为用户关闭并清 lease。\n          - `.20/.21` 已验证的 Windows TUN route guard、managed physical interface lease、完整网络诊断与 WFP loopback 修复继续保留；仅替换过时的热点 HNetCfg 写控制路径。'
          if old_bullet in text:
              text = text.replace(old_bullet, new_bullet, 1)
          main.write_text(text, encoding='utf-8')

          Path('.release/karing-release-tag.txt').write_text('v2.5.4-karing.22\n', encoding='utf-8')

          observer = Path('.github/workflows/karing-release-observer.yml')
          text = observer.read_text(encoding='utf-8')
          replacements = [
              ('name: Karing .21 发行核验', 'name: Karing .22 发行核验'),
              ('name: 核验 v2.5.4-karing.21 正式发行', 'name: 核验 v2.5.4-karing.22 正式发行'),
              ("PR_NUMBER: '13'", "PR_NUMBER: '15'"),
              ("STATUS_MARKER: '<!-- karing-v254-karing21-release-audit -->'", "STATUS_MARKER: '<!-- karing-v254-karing22-release-audit -->'"),
              ('test "$release_tag" = \'v2.5.4-karing.21\'', 'test "$release_tag" = \'v2.5.4-karing.22\''),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          observer.write_text(text, encoding='utf-8')

          wfp = Path('.github/workflows/karing-windows-wfp-v21.yml')
          text = wfp.read_text(encoding='utf-8')
          marker = "      - '.release/karing-windows-mihomo-v21.json'"
          if "      - '.release/karing-release-tag.txt'" not in text:
              if marker not in text:
                  raise SystemExit('WFP release metadata marker missing')
              text = text.replace(marker, marker + "\n      - '.release/karing-release-tag.txt'", 1)
          wfp.write_text(text, encoding='utf-8')
          PY
      - name: Remove obsolete authoring workflows
        shell: bash
        run: |
          rm -f .github/workflows/karing-v22-autofmt.yml
          rm -f .github/workflows/karing-v22-release-prep.yml
          rm -f .github/workflows/karing-v22-finalize-trigger.yml
          rm -f .github/workflows/karing-v22-finalize.yml
      - name: Normalize final candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
          pnpm exec biome format --write \
            scripts/check-windows-hotspot-v22.mjs \
            .github/workflows/karing-windows-hotspot-v22.yml \
            .github/workflows/karing-diagnostics-once.yml \
            .github/workflows/karing-release-observer.yml \
            .github/workflows/karing-windows-wfp-v21.yml
      - name: Run release-critical static gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-windows-hotspot-v22.mjs
          node scripts/check-windows-tun-safety.mjs
          node scripts/check-windows-wfp-v21.mjs
          grep -Fqx 'v2.5.4-karing.22' .release/karing-release-tag.txt
          test ! -e src-tauri/src/core/windows_hotspot_winrt.rs
          ! grep -Fq 'windows_hotspot_winrt' src-tauri/src/core/mod.rs
          ! grep -Fq 'windows_hotspot_winrt' src-tauri/src/core/manager/mod.rs
          ! grep -Fq 'windows_hotspot_winrt' src-tauri/src/feat/window.rs
          grep -Fq 'windows_hotspot_ics::ensure_monitor_running' src-tauri/src/core/manager/mod.rs
          grep -Fq 'windows_hotspot_ics::restore_now("shutdown")' src-tauri/src/feat/window.rs
          grep -Fq 'RoInitialize(RO_INIT_MULTITHREADED)' src-tauri/src/core/windows_hotspot_ics.rs
          grep -Fq 'lease-restored-missing-tun-profile' src-tauri/src/core/windows_hotspot_ics.rs
          grep -Fq 'hotspot-operational-state-unknown' src-tauri/src/core/windows_hotspot_ics.rs
          ! grep -Fq 'CoInitializeEx' src-tauri/src/core/windows_hotspot_ics.rs
          ! grep -Fq 'check-windows-hotspot-v20.mjs' .github/workflows/karing-diagnostics-once.yml
          grep -Fq 'check-windows-hotspot-v22.mjs' .github/workflows/karing-diagnostics-once.yml
          grep -Fq 'windows_hotspot_ --all-features' .github/workflows/karing-windows-hotspot-v22.yml
          grep -Fq "PR_NUMBER: '15'" .github/workflows/karing-release-observer.yml
          grep -Fq 'v2.5.4-karing.22' .github/workflows/karing-release-observer.yml
      - name: Commit final release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes needed.'
            exit 0
          fi
          git commit -m 'chore(release): harden karing.22 WinRT hotspot candidate'
          git push origin HEAD:fix/karing-windows-hotspot-v22
