name: Format mode-state fix once

on:
  push:
    branches:
      - fix/mode-state-diagnostics
    paths:
      - '.github/workflows/format-mode-state-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mode-state-diagnostics
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Format touched Rust files
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
      - name: Commit formatted source only
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/src/cmd/clash.rs src-tauri/src/feat/clash.rs src-tauri/src/feat/window.rs
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format mode-state diagnostics changes'
          git push origin HEAD:fix/mode-state-diagnostics
