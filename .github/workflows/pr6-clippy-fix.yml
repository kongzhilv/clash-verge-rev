name: PR6 Clippy Fix Helper

on:
  push:
    branches:
      - fix/outbound-failure-diagnostics-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outbound-failure-diagnostics-ci
          fetch-depth: 0
      - name: Apply strict Clippy fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/core/outbound_diagnostics.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "fn network_marker<'a>(line: &'a str, dial: bool) -> Option<(&'static str, &'a str)> {":
                  "fn network_marker(line: &str, dial: bool) -> Option<(&'static str, &str)> {",
              'target_port.map_or(target_host.clone(), |port| format!("{target_host}:{port}"))':
                  'target_port.map_or_else(|| target_host.clone(), |port| format!("{target_host}:{port}"))',
              'let Some(next) = proxy.now.map(|value| value.to_string()) else {':
                  'let Some(next) = proxy.now else {',
              'super::compact_error(r#"requesting https://doh.pub:443/dns-query?dns=SECRET payload"#)':
                  'super::compact_error("requesting https://doh.pub:443/dns-query?dns=SECRET payload")',
              'let line = r#"[TCP] dial DIRECT (match DomainSuffix/cn) 198.18.0.1:52402(wpscloudsvr.exe) --> account.wps.cn:443 error: dns resolve failed: context deadline exceeded"#;':
                  'let line = "[TCP] dial DIRECT (match DomainSuffix/cn) 198.18.0.1:52402(wpscloudsvr.exe) --> account.wps.cn:443 error: dns resolve failed: context deadline exceeded";',
              'parse_route(r#"[TCP] 198.18.0.1:50696(twinkstar.exe) --> r.bing.com:443 match DomainKeyword(bing) using CVR-当前选择[🇹🇼台湾静态三网|家宽3]"#)':
                  'parse_route("[TCP] 198.18.0.1:50696(twinkstar.exe) --> r.bing.com:443 match DomainKeyword(bing) using CVR-当前选择[🇹🇼台湾静态三网|家宽3]")',
              'parse_route(r#"[TCP] 198.18.0.1:57701 --> r.bing.com:443 using GLOBAL"#)':
                  'parse_route("[TCP] 198.18.0.1:57701 --> r.bing.com:443 using GLOBAL")',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'missing expected pattern: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove helper and commit
        run: |
          rm -f .github/workflows/pr6-clippy-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/core/outbound_diagnostics.rs .github/workflows/pr6-clippy-fix.yml
          git diff --cached --check
          git commit -m "fix: satisfy outbound diagnostics strict clippy"
          git push origin HEAD:fix/outbound-failure-diagnostics-ci
