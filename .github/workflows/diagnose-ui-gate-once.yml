name: Diagnose UI maturity gate once

on:
  push:
    branches:
      - fix/mihomo-control-readiness
    paths:
      - '.github/workflows/diagnose-ui-gate-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mihomo-control-readiness
      - name: Label every maturity assertion
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          have_file() { if test -f "$1"; then echo "[PASS] file $1"; else echo "[FAIL] file $1"; failures=$((failures+1)); fi; }
          have() { if grep -q "$2" "$1"; then echo "[PASS] $3"; else echo "[FAIL] $3 :: $1 :: $2"; failures=$((failures+1)); fi; }
          absent() { if grep -q "$2" "$1"; then echo "[FAIL] $3 :: unexpected $2"; failures=$((failures+1)); else echo "[PASS] $3"; fi; }

          have_file src/components/connection/connection-filter-menu.tsx
          have src/pages/connections.tsx 'ConnectionFilterMenu' 'connections page filter menu'
          have src/components/connection/connection-filter-menu.tsx 'application: string' 'filter application field'
          have src/components/connection/connection-filter-menu.tsx 'rule: string' 'filter rule field'
          have src/components/connection/connection-filter-menu.tsx 'outbound: string' 'filter outbound field'
          have src/components/connection/connection-detail.tsx 'useConnectionData({ enabled: open })' 'detail live data hook'
          have src/components/connection/connection-detail.tsx 'activeConnections.find' 'detail active connection refresh'
          have src/components/connection/connection-detail.tsx '技术详情' 'technical details label'
          have src/components/connection/connection-detail.tsx '调整分流' 'routing adjustment label'
          have src/components/connection/connection-row-item.tsx 'identifiedApplication ? application : row.host' 'application-first row title'
          have src/components/routing/connection-project-card.tsx '应用规则' 'application rule summary'
          have src/components/routing/connection-project-card.tsx '当前出口' 'current outbound summary'
          absent src/components/routing/connection-project-card.tsx 'useNavigate\|<Button\|Windows TUN' 'no duplicate routing actions/technical wording'
          have src/services/process-connections.ts "'local-endpoint'" 'local endpoint attribution'
          have src/services/process-connections.ts "'recent-local-endpoint'" 'recent local endpoint attribution'
          have src/services/process-connections.ts 'RECENT_ENDPOINT_TTL_MS' 'recent endpoint TTL'
          have src/hooks/use-connection-data.ts 'PROCESS_CONNECTION_NEW_DELAY_MS' 'new connection attribution delay'
          have src/hooks/use-connection-data.ts 'requestFastProcessConnectionRefresh' 'fast attribution refresh'
          have src/services/process-connections.ts "source: 'windows'" 'windows attribution source'
          have src/services/process-connections.ts 'MAX_ATTRIBUTION_ITEMS' 'attribution cap'
          have src/components/rule/diversion-manager/manager.tsx 'builtinGroups={builtinGroups}' 'builtin groups wiring'
          have src/components/rule/diversion-manager/settings-panel.tsx '常用分流' 'common diversion label'
          have src/components/connection/connection-rule-assistant.tsx 'isMihomoFakeIp' 'fake-ip assistant handling'
          have_file src/components/base/overflow-reveal.tsx
          have src/components/base/overflow-reveal.tsx "overflowX: 'auto'" 'overflow reveal scrolling'
          have src/components/rule/diversion-manager/detected-programs-panel.tsx 'softScrollAreaSx' 'detected programs soft scrolling'
          have src/components/rule/diversion-manager/project-panel.tsx 'OverflowReveal' 'project panel overflow reveal'
          have src/components/rule/diversion-manager/action-picker.tsx 'OverflowReveal' 'action picker overflow reveal'
          have src/components/routing/routing-relations-panel.tsx 'OverflowReveal' 'relations overflow reveal'
          have src/components/routing/focused-policy-panel.tsx 'OverflowReveal' 'focused policy overflow reveal'
          absent src/components/rule/diversion-manager/project-editor-dialog.tsx 'label="目标端口"' 'project editor hides target port'
          absent src/pages/rules.tsx 'RoutingRelationsPanel' 'rules page avoids duplicate relations panel'
          have src/pages/proxies.tsx '{policyFilter && (' 'proxy policy filter rendering'

          echo "failures=$failures"
          test "$failures" -eq 0
