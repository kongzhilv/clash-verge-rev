name: Karing 2.5.4 发布运行列表

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  list:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/list-karing-v254-publish-runs'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SELF_PATH: .github/workflows/karing-v254-run-list.yml
    steps:
      - name: 列出最近发布运行
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/karing-v254-release-retry.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | {id, status, conclusion, event, created_at, updated_at, html_url}]')
          body=$(cat <<EOF
          <!-- karing-v254-publish-run-list -->
          ## Karing 2.5.4 发布运行列表

          \`\`\`json
          ${runs}
          \`\`\`
          EOF
          )
          jq -n --arg body "$body" '{body: $body}' | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" --input - >/dev/null

      - name: 清理运行列表器
        if: always()
        shell: bash
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${SELF_PATH}?ref=dev" --jq '.sha')
          jq -n --arg message 'chore: remove Karing publish run list' --arg sha "$sha" --arg branch dev \
            '{message: $message, sha: $sha, branch: $branch}' | \
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${SELF_PATH}" --input - >/dev/null