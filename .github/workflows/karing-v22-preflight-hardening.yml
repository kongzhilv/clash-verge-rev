name: Karing v22 rollback preflight hardening
on:
  push:
    branches:
      - fix/karing-windows-hotspot-v22
    paths:
      - '.github/workflows/karing-v22-preflight-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/karing-windows-hotspot-v22
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Preflight original public tether manager before mutation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/core/windows_hotspot_ics.rs')
          text = p.read_text(encoding='utf-8')
          anchor = '    let original = find_original_public_profile(&items, tun.guid)?;\n    let original_guid = profile_guid(&original)?;\n'
          replacement = '    let original = find_original_public_profile(&items, tun.guid)?;\n    require_capability(&original)?;\n    let _original_manager_preflight = manager_for(&original)?;\n    let original_guid = profile_guid(&original)?;\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one original-public preflight anchor, found {text.count(anchor)}')
          p.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          gate = Path('scripts/check-windows-hotspot-v22.mjs')
          gate_text = gate.read_text(encoding='utf-8')
          gate_anchor = "  'original-public-profile-ambiguous',\n"
          marker = "  'let _original_manager_preflight = manager_for(&original)?;',\n"
          if marker not in gate_text:
              if gate_text.count(gate_anchor) != 1:
                  raise SystemExit('expected one gate preflight insertion anchor')
              gate.write_text(gate_text.replace(gate_anchor, gate_anchor + marker, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
          node scripts/check-windows-hotspot-v22.mjs
          grep -Fq 'let _original_manager_preflight = manager_for(&original)?;' src-tauri/src/core/windows_hotspot_ics.rs
      - name: Commit permanent rollback preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/core/windows_hotspot_ics.rs scripts/check-windows-hotspot-v22.mjs
          git diff --cached --check
          git commit -m 'fix(windows): preflight hotspot rollback manager'
          git push origin HEAD:fix/karing-windows-hotspot-v22
