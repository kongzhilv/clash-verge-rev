name: v17 one-time rustfmt writeback

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  repair:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 9 &&
      github.event.comment.body == '/v17-rustfmt-writeback-24dca153'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v17 branch
        uses: actions/checkout@v7
        with:
          ref: fix/windows-hotspot-self-capture-v17
          fetch-depth: 0
      - name: Install repository rustfmt
        run: rustup component add rustfmt
      - name: Apply exact repository formatting
        run: cargo fmt --manifest-path ./src-tauri/Cargo.toml --all
      - name: Remove temporary trigger
        run: rm -f .release/v17-rustfmt-trigger.txt
      - name: Validate writeback scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              src-tauri/src/core/windows_network_diagnostics.rs|src-tauri/src/utils/windows_network.rs|.release/v17-rustfmt-trigger.txt) ;;
              '') ;;
              *) echo "Unexpected formatter change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit exact formatted output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/core/windows_network_diagnostics.rs src-tauri/src/utils/windows_network.rs
          git add -u .release/v17-rustfmt-trigger.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No writeback needed'
            exit 0
          fi
          git commit -m 'style(windows): apply repository rustfmt for v17'
          git push origin HEAD:fix/windows-hotspot-self-capture-v17
