name: Karing 4 Verified Artifact Release
run-name: Verify existing 12 installers and publish v2.5.3-karing.4

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/karing4-run-probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

env:
  SOURCE_RUN_ID: '30832791839'
  CANDIDATE_SHA: '7ec661ec241ea7571058f82463b0cc644596b10d'
  RELEASE_TAG: 'v2.5.3-karing.4'

jobs:
  publish:
    name: 复核现有产物并正式发行
    runs-on: ubuntu-latest
    steps:
      - name: 检出默认分支以核对发行定义
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 验证源码审查、九个平台构建步骤和 Artifact 身份
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "CANDIDATE_SHA: ${CANDIDATE_SHA}" .github/workflows/karing4-audited-release.yml
          gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > /tmp/jobs.json
          jq -e '.jobs[] | select(.name == "审查固定候选源码") | .conclusion == "success"' /tmp/jobs.json >/dev/null

          required_jobs=(
            '构建 Windows x64'
            '构建 Windows ARM64'
            '构建 Windows fixed WebView2 x64'
            '构建 Windows fixed WebView2 ARM64'
            '构建 macOS Apple Silicon'
            '构建 macOS Intel'
            '构建 Linux x64'
            '构建 Linux ARM64'
            '构建 Linux ARMv7'
          )

          for job in "${required_jobs[@]}"; do
            jq -e --arg job "$job" '
              .jobs[]
              | select(.name == $job)
              | any(.steps[]?; .name == "构建桌面安装包" and .conclusion == "success")
            ' /tmp/jobs.json >/dev/null
            jq -e --arg job "$job" '
              .jobs[]
              | select(.name == $job)
              | any(.steps[]?; .name == "上传平台安装包" and .conclusion == "success")
            ' /tmp/jobs.json >/dev/null
            echo "[通过] ${job}：构建与上传步骤均成功"
          done

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > /tmp/artifacts.json
          required_artifacts=(
            karing4-windows-x64
            karing4-windows-arm64
            karing4-windows-fixed-x64
            karing4-windows-fixed-arm64
            karing4-macos-arm64
            karing4-macos-x64
            karing4-linux-x64
            karing4-linux-arm64
            karing4-linux-armv7
          )

          for artifact in "${required_artifacts[@]}"; do
            jq -e --arg artifact "$artifact" '
              [.artifacts[] | select(.name == $artifact and .expired == false and .size_in_bytes > 0)]
              | length == 1
            ' /tmp/artifacts.json >/dev/null
            echo "[通过] Artifact ${artifact} 唯一、有效且非空"
          done

      - name: 下载九个平台已上传的安装包
        uses: actions/download-artifact@v8
        with:
          pattern: karing4-*
          path: downloaded-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: 校验 12 个安装文件并生成发行元数据
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-assets -type f \
            \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.rpm' \) \
            -exec cp '{}' release-assets/ \;

          exe_count=$(find release-assets -maxdepth 1 -type f -iname '*.exe' | wc -l)
          dmg_count=$(find release-assets -maxdepth 1 -type f -iname '*.dmg' | wc -l)
          deb_count=$(find release-assets -maxdepth 1 -type f -iname '*.deb' | wc -l)
          rpm_count=$(find release-assets -maxdepth 1 -type f -iname '*.rpm' | wc -l)
          installer_count=$((exe_count + dmg_count + deb_count + rpm_count))

          test "$installer_count" -eq 12
          test "$exe_count" -eq 4
          test "$dmg_count" -eq 2
          test "$deb_count" -eq 3
          test "$rpm_count" -eq 3

          (
            cd release-assets
            sha256sum *.exe *.dmg *.deb *.rpm > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

          cat > release-assets/BUILD_INFO.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${CANDIDATE_SHA}
          Source workflow run: ${SOURCE_RUN_ID}
          Version: 2.5.3-karing.4
          Platforms: Windows x64/ARM64, macOS Intel/Apple Silicon, Linux x64/ARM64/ARMv7
          Installers: 12
          Signing: unsigned fork build; no upstream Apple notarization or updater signature
          Android: intentionally not included
          EOF

          cat > release-assets/release-notes.md <<EOF
          # Clash Verge Rev Karing v2.5.3-karing.4

          本版本将分流中心继续收敛为“应用 → 应用规则 → 出口 → 当前连接”的工作流，并修复 Windows TUN/Fake-IP 与短连接场景下的应用识别。

          ## 应用识别
          - 新连接出现约 120ms 后立即读取 Windows TCP/UDP 所属进程，并追加一次 350ms 重试
          - 按完整四元组、本地 TUN/Fake-IP 端点、最近 20 秒无冲突端点、唯一源端口依次匹配
          - 候选冲突时停止猜测，避免把连接错误归给其他应用
          - 历史已结束连接不再被后续端口复用覆盖
          - 已打开的连接详情按连接 ID 持续订阅最新流量和归因结果

          ## 界面与操作
          - 主视图只保留应用、应用规则、预期出口和当前出口
          - PID、程序路径、原始规则、完整出口链和识别原因收进“技术详情”
          - 连接页支持按应用、命中规则和实际出口筛选
          - 分流中心按应用分流、通用规则和全局设置组织
          - 隐藏内部托管规则 ID，减少重复卡片、标签与低价值按钮
          - 修复小窗口、高 DPI、长域名和长路径下的裁切与挤压

          ## 安装包
          - Windows x64 与 ARM64
          - Windows x64 与 ARM64 固定 WebView2 版本
          - macOS Apple Silicon 与 Intel
          - Linux x64、ARM64 与 ARMv7 的 DEB/RPM

          本分支安装包没有上游官方签名或 Apple 公证，请使用 SHA256SUMS.txt 校验文件。

          Candidate: ${CANDIDATE_SHA}
          Audited run: ${SOURCE_RUN_ID}
          EOF

          echo "[通过] 文件结构：EXE=${exe_count} DMG=${dmg_count} DEB=${deb_count} RPM=${rpm_count}"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 创建并严格复核正式 Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" \
            release-assets/*.exe \
            release-assets/*.dmg \
            release-assets/*.deb \
            release-assets/*.rpm \
            release-assets/SHA256SUMS.txt \
            release-assets/BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title 'Clash Verge Rev Karing v2.5.3-karing.4' \
            --notes-file release-assets/release-notes.md \
            --latest

          release_json=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isDraft,isPrerelease,targetCommitish,assets)
          asset_count=$(jq '.assets | length' <<< "$release_json")
          installer_assets=$(jq '[.assets[].name | select(test("\\.(exe|dmg|deb|rpm)$"; "i"))] | length' <<< "$release_json")
          metadata_assets=$(jq '[.assets[].name | select(. == "SHA256SUMS.txt" or . == "BUILD_INFO.txt")] | length' <<< "$release_json")

          test "$asset_count" -eq 14
          test "$installer_assets" -eq 12
          test "$metadata_assets" -eq 2
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$CANDIDATE_SHA" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and .targetCommitish == $commit' \
            <<< "$release_json" >/dev/null

          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')
          test "$tag_sha" = "$CANDIDATE_SHA"

          release_url=$(jq -r '.url' <<< "$release_json")
          echo "url=${release_url}" >> "$GITHUB_OUTPUT"
          echo '[通过] Release 为正式 Latest 版本，标签精确指向候选并包含 14 个资产'
          jq '{url, tagName, targetCommitish, isDraft, isPrerelease, assets: [.assets[].name]}' <<< "$release_json"

      - name: 回报发行结果
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/status.md <<EOF
          <!-- karing4-verified-artifact-release -->
          ## Karing 4 正式发行状态

          ✅ v2.5.3-karing.4 正式发行成功

          - 候选提交：\`${CANDIDATE_SHA}\`
          - 已审查构建运行：\`${SOURCE_RUN_ID}\`
          - 本次发布运行：\`${GITHUB_RUN_ID}\`
          - 安装文件：12 个
          - Release 资产：14 个
          - Release：${RELEASE_URL}
          EOF
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md

      - name: 清理一次性辅助工作流
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin dev
          git rm -f --ignore-unmatch \
            .github/workflows/karing4-run-probe.yml \
            .github/workflows/retarget-karing4-release.yml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: remove one-time Karing 4 release helpers'
            git push origin HEAD:dev
          fi
