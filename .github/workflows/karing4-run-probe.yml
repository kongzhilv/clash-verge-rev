name: Karing 4 Run Probe
run-name: Report Karing 4 release run after audit fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/karing4-run-probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Query release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          json=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow karing4-audited-release.yml \
            --limit 3 \
            --json databaseId,status,conclusion,headSha,event,createdAt,updatedAt,url)
          cat > /tmp/probe.md <<EOF
          <!-- karing4-run-probe -->
          ## Karing 4 发行运行探针

          \
          \`\`\`json
          ${json}
          \`\`\`
          EOF
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/probe.md
